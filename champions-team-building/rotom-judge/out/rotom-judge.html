y proposed. Absol is grounded, so Psychic Terrain blocks Fake Out and Sucker Punch against it. That same partner also redirects Sneasler with Follow Me.\n\n**4. Magic Bounce still does something Z cannot.** Z's advocate argues that outspeeding Whimsicott solves the disruption problem. It doesn't, because Whimsicott's Encore has Prankster priority and goes first anyway. Encore still works on Z: a Z that just used Protect or Swords Dance gets locked into it. Against Mega, Encore and Incineroar's Parting Shot bounce back at the user.\n\n**Honest summary.** Z is faster, immune to Fake Out, and has one more no-item OHKO. Mega pays for its advantages with a Fighting weakness, so Sneasler's Close Combat does 216.9-257.7% to it.\n\nMega Absol still wins because its special attacks ignore Intimidate. Its 100%-accurate Ice Beam threatens Garchomp and M-Salamence, and becomes a guaranteed KO on both with Helping Hand. Magic Bounce blanks Encore and Parting Shot. Z's Sharpness damage, by contrast, loses a third to the #3 threat's Intimidate.","rb":"**Rebuttal: Mega Absol Z**\n\n**1. Their headline count uses an item Mega Absol cannot hold.** Mega Absol has to hold Absolite to Mega Evolve, so it cannot also hold a Life Orb. My opening said this about both forms, and their fact sheet's \"no item\" column exists for this reason. I re-ran the engine with their exact Hasty P(0,32,0,2,0,32) spread holding Absolite, taking the best move against each target from 13 moves:\n- **Mega Absol OHKOs 7 of 21 threats (84.64% total usage), not 16.**\n- **Z (Jolly, Absolite Z, 11 moves) OHKOs 8 of 21 (109.23%).**\n\nThe \"Mega-only\" kills disappear without Life Orb:\n- Ice Beam on Garchomp does 97.3-114.6% (12/16 rolls).\n- Ice Beam on M-Salamence does 92.5-109.7% (8/16).\n- Fire Blast on M-Golisopod does 90.1-107.7% (7/16).\n\nThe Foul Play kills they list also need Life Orb. Without it, Foul Play does 94.9-113% (11/16) to Indeedee-F and 87.4-103.6% (4/16) to Farigiraf. Against the same two targets, Z's Night Slash is a guaranteed KO on Indeedee-F and 14/16 on Farigiraf.\n\nOne more correction: Mega Absol's Whimsicott KO relies on Iron Tail, which has 75% accuracy. With legal items, Z still kills more of the board.\n\n**2. Their Indeedee-F plan helps the opposing Sneasler.** Psychic Surge sets Psychic Terrain, which triggers the Psychic Seed they said Sneasler holds. Sneasler gets Unburden and outspeeds Mega Absol. Close Combat then does 216.9-257.7% to Mega Absol. Follow Me can redirect it, but only if Indeedee is still standing and not Taunted. Z never needed this partner, because it is immune to Fighting and Fake Out.\n\n**3. Ice Beam and the two Dragons.** Here I concede. Without an item, Mega's Ice Beam has 100% accuracy and KOs Garchomp on 12/16 rolls, a real advantage over Z's Play Rough (65.9-77.8%, 90% accuracy). But 12/16 is not a guaranteed KO. Salamence survives it half the time (8/16). Z moves 40 Speed points ahead of both Dragons and can 2HKO either one, or take Salamence down with a Helping Hand hit.\n\n**Honest concessions:**\n- Intimidate from Incineroar cuts Z's physical damage and does not touch Mega's special attacks.\n- Magic Bounce really does reflect Parting Shot and Encore back at the user.\n- Thunderbolt KOs Pelipper cleanly, while Z needs Stone Edge (11/16 rolls, 80% accuracy).\n- Mega takes half as much from Farigiraf's Foul Play.\n\nSpeed is not damage, but it decides who acts first. Z at 223 moves before Sneasler and Whimsicott, and Mega Absol at 183 does not.\n\n**Bottom line:** once Mega Absol holds its own stone, Z KOs more of the board, moves first against everything and cannot be hit by the board's most common Fake Out and Close Combat users, so Mega Absol Z still wins."},"checks":[{"sideName":"Mega Absol","side":"A","claim":"Life Orb Mega OHKOs 16/21 (Ice Beam Garchomp 126.5-149.2%, Salamence 120.4-142.5%, Fire Blast Golisopod 117-140.1%)","holds":false,"recomputed":"Rolls reproduce, but Mega must hold Absolite, so Life Orb is not possible. A withdrew it."},{"sideName":"Mega Absol","side":"A","claim":"No-item Ice Beam: Garchomp 97.3-114.6% (12/16), M-Salamence 92.5-109.7% (8/16)","holds":true,"recomputed":"97.3-114.6% (12/16); 92.5-109.7% (8/16)"},{"sideName":"Mega Absol","side":"A","claim":"HH Ice Beam: Garchomp 145.9-171.9%, Salamence 138.7-164.5%","holds":true,"recomputed":"145.9-171.9% KO; 138.7-164.5% KO"},{"sideName":"Mega Absol","side":"A","claim":"Intimidate cuts Z: HH X-Scissor Rillaboom -1 82.6-97.6%, HH Night Slash Pelipper -1 75.2-90.5%, +1 Night Slash Garchomp 85.9-102.2% (2/16)","holds":true,"recomputed":"82.6-97.6%; 75.2-90.5%; 85.9-102.2% (2/16)"},{"sideName":"Mega Absol","side":"A","claim":"Thunderbolt kills Pelipper (151.8-181%)","holds":false,"recomputed":"151.8-181%, but the board Pelipper holds Focus Sash, so it is not a KO from full"},{"sideName":"Mega Absol","side":"A","claim":"Kingambit Iron Head (82.4-97.2%) never OHKOs Mega","holds":false,"recomputed":"On A's own Hasty spread (72 Def): 92.1-109.3% (8/16)"},{"sideName":"Mega Absol","side":"A","claim":"Mega OHKO'd by 13/21 vs Z 12/21, only one extra","holds":false,"recomputed":"On Hasty, Mega is OHKO'd by 16/21 (Incineroar Flare Blitz 14/16, Garchomp Dragon Claw 105.7-125%, M-Tyranitar Low Kick 105.7-125.7%); Z by 12"},{"sideName":"Mega Absol Z","side":"B","claim":"Z 223 Speed outspeeds all 21 threats; 20 Megas outspeed Mega's 183","holds":true,"recomputed":"Spe 223 vs 183; fact sheet lists 20 faster Megas"},{"sideName":"Mega Absol Z","side":"B","claim":"Night Slash on Garchomp: Z 58.4-68.6%, Mega 37.8-45.4%","holds":true,"recomputed":"58.4-68.6%; 37.8-45.4%"},{"sideName":"Mega Absol Z","side":"B","claim":"X-Scissor Rillaboom 81.2-95.7%, HH 121.7-143.5%","holds":true,"recomputed":"81.2-95.7%; 121.7-143.5% KO"},{"sideName":"Mega Absol Z","side":"B","claim":"HH Night Slash KOs Pelipper 110.2-132.8% and M-Metagross 128.7-152.6%","holds":false,"recomputed":"Rolls reproduce, but Pelipper's Focus Sash stops the KO from full; Metagross holds"},{"sideName":"Mega Absol Z","side":"B","claim":"+2 Night Slash: Rillaboom 104.8-124.6%, Garchomp 115.1-136.2%, Milotic 111.4-131.2%","holds":true,"recomputed":"Same, all KO"},{"sideName":"Mega Absol Z","side":"B","claim":"Phantom Force Gholdengo 107.7-127.8%, HH 161.5-191.7%","holds":true,"recomputed":"Same (two-turn move)"},{"sideName":"Mega Absol Z","side":"B","claim":"With legal items Mega OHKOs 7/21 (84.64%), Z 8/21 (109.23%)","holds":true,"recomputed":"7 (84.64) vs 8 (109.23); without Sash holders at 100% accuracy, 5 (58.90) vs 7 (96.58)"},{"sideName":"Mega Absol Z","side":"B","claim":"Sneasler CC 216.9-257.7% on Mega, Dire Claw 35.9-43% on Z; Fake Out cannot hit Z","holds":true,"recomputed":"Same on Jolly (Hasty: CC 244.3-288.6%); Fake Out IMMUNE into Z"}],"teams":[{"legal":true,"paste":"Absol @ Absolite\nAbility: Justified\nLevel: 50\nEVs: 26 HP / 20 SpA / 20 Spe\nTimid Nature\n- Ice Beam\n- Dark Pulse\n- Flamethrower\n- Protect\n\nIndeedee-F @ Sitrus Berry\nAbility: Psychic Surge\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nRelaxed Nature\n- Follow Me\n- Helping Hand\n- Expanding Force\n- Trick Room\n\nTalonflame @ Sharp Beak\nAbility: Gale Wings\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Brave Bird\n- Flare Blitz\n- Tailwind\n- Protect\n\nArcanine-Hisui @ Charcoal\nAbility: Intimidate\nLevel: 50\nEVs: 12 HP / 32 Atk / 22 Spe\nJolly Nature\n- Flare Blitz\n- Head Smash\n- Extreme Speed\n- Protect\n\nSneasler @ Psychic Seed\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Close Combat\n- Gunk Shot\n- Fake Out\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n","default_four":"Absol, Indeedee-F, Talonflame and Arcanine-Hisui. Default lead is Indeedee-F + Absol: Mega Evolve on turn 1, with Follow Me or Helping Hand from Indeedee. Talonflame (Tailwind) and Arcanine (Intimidate) wait in the back. Against Sneasler teams, lead Talonflame + Absol and keep Indeedee in the back: our Psychic Terrain would trigger their Psychic Seed (378 Speed) and block our Gale Wings priority into it. Against Incineroar + Kingambit, bring Sneasler over Talonflame. Against Fairy or Gholdengo, bring Gholdengo over Arcanine. Against rain, bring Absol, Indeedee, Sneasler and Gholdengo.","headline":"Timid special Mega Absol (170 Speed) guarantees Ice Beam OHKOs on Garchomp (110.3-129.7%) and M-Salamence (103.2-122.6%) with no Helping Hand, and opposing Intimidate cannot lower its damage. Indeedee-F's Psychic Terrain and Follow Me shield it from Fake Out, priority and Close Combat, and Talonflame, Arcanine-H, Sneasler and Gholdengo beat what Absol can't touch. Speed control is Tailwind plus Unburden, with Trick Room as a third layer. Note: the brief's Foul Play KOs came from an engine bug (app.js prices Foul Play with the attacker's Attack instead of the target's), so Foul Play was replaced with Dark Pulse. The worst matchup is rain.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Absol/absol-mega-notes.md"},{"legal":true,"paste":"Absol @ Absolite Z\nAbility: Justified\nLevel: 50\nEVs: 2 HP / 30 Atk / 16 Def / 18 Spe\nJolly Nature\n- Night Slash\n- Psycho Cut\n- Sucker Punch\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 12 Atk / 22 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Helping Hand\n- Parting Shot\n\nSneasler @ White Herb\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Close Combat\n- Gunk Shot\n- Fake Out\n- Protect\n\nArcanine-Hisui @ Charcoal\nAbility: Intimidate\nLevel: 50\nEVs: 12 HP / 28 Atk / 26 Spe\nJolly Nature\n- Flare Blitz\n- Head Smash\n- Extreme Speed\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n\nMilotic @ Leftovers\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 14 Def / 20 SpA\nModest Nature\n- Scald\n- Ice Beam\n- Icy Wind\n- Protect","default_four":"Default four: Mega Absol Z, Incineroar, Sneasler and Arcanine-Hisui. Lead Absol + Incineroar. On turn 1 Absol Mega Evolves, and Incineroar uses Fake Out on Rillaboom, Salamence or Whimsicott while Absol KOs Indeedee-F, Sneasler, Gholdengo or Farigiraf. On turn 2 Incineroar either uses Helping Hand on Absol or Parting Shot to bring in Arcanine for a second Intimidate. Swaps: Gholdengo in for Arcanine against Fairy teams (then lead Absol + Sneasler); Milotic in for Sneasler against Salamence, Garchomp or Baxcalibur; lead Sneasler + Arcanine against Kingambit + Incineroar; bring Milotic + Gholdengo over Arcanine + Incineroar against rain.","headline":"Mega Absol Z runs 207 Speed, which outspeeds all 21 board threats. It OHKOs Indeedee-F, Gholdengo, Sneasler and M-Froslass, and Farigiraf 14/16. Two Intimidate users (Incineroar and Arcanine-Hisui) cut the physical hits that would OHKO it. Sneasler, Arcanine and Gholdengo take the Dark types, Gholdengo and Sneasler take the Fairies, and Milotic's Ice Beam takes the Dragons. Speed control is layered: two Fake Outs, Icy Wind, Unburden, and priority (Sucker Punch and Extreme Speed). Weakest matchups are rain, and Indeedee-F/Farigiraf, which only Absol answers cleanly.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Absol/absol-mega-z-notes.md"}],"brief_a":{"game_plan":"Fast mixed attacker (Hasty 183 Spe) whose job is to fire 100%-accurate special coverage that Intimidate cannot touch, with Magic Bounce reflecting Parting Shot. Set: Ice Beam / Foul Play / Close Combat or Thunderbolt / Protect. Run it next to Helping Hand plus a redirector, because it is extremely frail: on the Hasty spread it is OHKO'd by 16 of 21 threats. Consider Jolly or some Def points if the team cannot shield it.","lean_into":["Ice Beam, 100% accurate and unaffected by Intimidate: Garchomp 97.3-114.6% (12/16), M-Salamence 92.5-109.7% (8/16)","Helping Hand Ice Beam guarantees both KOs: Garchomp 145.9-171.9%, Salamence 138.7-164.5%","Foul Play: Gholdengo 111.2-132.5% KO, M-Froslass 163.3-193.2% KO, Indeedee-F 94.9-113% (11/16), Farigiraf 87.4-103.6% (4/16)","Zen Headbutt Sneasler 193.6-229.3%, Close Combat Arcanine-H 105.8-125.6% and M-Tyranitar 104.3-123.7%","Resists Dark and Ghost: Kowtow Cleave 48.6-57.9%, Sucker Punch 40-47.1%, Foul Play 17.9-20.7%","Magic Bounce reflects Incineroar's Parting Shot (Whimsicott's Prankster Encore already fails on Dark types)"],"must_cover":["Sneasler (34.29%, 189 Spe, faster than Mega): Close Combat 244.3-288.6% on Hasty","M-Golisopod First Impression 291.4-345.7% (priority); M-Staraptor Close Combat 227.1-267.1%, Brave Bird 113.6-133.6%","Fake Out from Rillaboom (29.3-35%) and Incineroar (22.1-26.4%); Magic Bounce does not stop it","Hasty 72 Def: Kingambit Iron Head 92.1-109.3% (8/16), Incineroar Flare Blitz 98.6-116.4% (14/16), Garchomp Dragon Claw 105.7-125%, M-Tyranitar Low Kick 105.7-125.7%, Rillaboom Wood Hammer 170-200.7%","Whimsicott Moonblast 124.3-147.1%, and Whimsicott (184) is faster","Rillaboom (37.18%): best answer is Megahorn 79.2-93.7% at 85%; Fire Blast only 41.5-49.3% into Assault Vest","Pelipper and Whimsicott hold Focus Sash; only 5 honest no-item OHKOs (58.90% usage)"],"partner_ideas":["Indeedee-F: Follow Me against Sneasler and Staraptor; Psychic Terrain blocks Fake Out, Sucker Punch and First Impression on grounded Absol (but it triggers an opposing Sneasler's Psychic Seed)","Helping Hand user to make Ice Beam a guaranteed KO on Garchomp and Salamence","Intimidate support (Incineroar) to blunt Sneasler, Golisopod, Rillaboom and Staraptor","Steel or Poison Fairy answer for Whimsicott and Sylveon","Wide Guard or a Fighting-resistant partner (Psychic, Flying, Ghost) to absorb Close Combat"]},"brief_b":{"game_plan":"Fastest Pokemon on the board (Jolly 32 Spe, 223; outspeeds all 21 threats), used as a Sharpness lead sweeper. Set: Night Slash / X-Scissor / Sucker Punch or Shadow Sneak / Protect, with Swords Dance as an option. It ignores Fake Out and Fighting moves, and a Helping Hand partner turns its 2HKOs into OHKOs. Partners must keep Intimidate off it and remove Fairy attackers and the Dragons.","lean_into":["223 Speed: moves before Sneasler 189, Whimsicott 184, M-Froslass 189 and M-Staraptor 178; only ties Garchomp Z and Lucario Z","Immune to Fake Out (Rillaboom, Incineroar) and to Close Combat from Sneasler and Staraptor; Sneasler's best hit is Dire Claw 35.9-43%","No-item OHKOs: Night Slash Indeedee-F 108.5-128.8%, Gholdengo 127.8-150.9%, Farigiraf 98.6-117.6% (14/16), M-Froslass 185.7-220.4%; Psycho Cut Sneasler 259.9-309.6%; Close Combat Arcanine-H 108.1-127.9% and M-Tyranitar 106.3-125.6%","Helping Hand: X-Scissor Rillaboom 121.7-143.5% KO, Night Slash M-Metagross 128.7-152.6% KO, Play Rough Garchomp 98.9-116.8% (14/16)","+2 Night Slash OHKOs Rillaboom 104.8-124.6%, Garchomp 115.1-136.2%, Milotic 111.4-131.2%; +1 X-Scissor Rillaboom 121.7-143.5%","OHKO'd by only 12/21 threats, against Mega's 13 (Jolly) or 16 (Hasty)"],"must_cover":["Intimidate (Incineroar 26.77%): at -1, Night Slash Gholdengo 85.2-101.2% (1/16), Indeedee-F 71.2-86.4%, Farigiraf 66.2-78.4%, HH X-Scissor Rillaboom 82.6-97.6%; no Clear Amulet in Champions; Parting Shot also lands on Z","Fairy: Whimsicott Moonblast 122.5-145.1% KO (Whimsicott holds Sash), Sylveon Hyper Beam 354.9-419.7%","M-Golisopod First Impression 128.9-152.1%, which is priority, so Speed does not help","Cannot OHKO the Dragons: Stone Edge Salamence 55.9-66.7% (80% acc; HH 83.9-100%), Play Rough Garchomp 65.9-77.8% (90%); Salamence Double-Edge does 154.9-182.4% to Z","Rillaboom Wood Hammer 150.7-178.2%, M-Staraptor Brave Bird 101.4-119%, Kingambit Kowtow Cleave 86.6-102.1% (3/16) and Sucker Punch 71.8-84.5%","Poor into Kingambit (Night Slash 20.8-24.6%, Close Combat 63.8-75.4% into Chople) and Incineroar (Night Slash 25.7-31.2%)"],"partner_ideas":["Helping Hand user, ideally one with Fairy or Ice coverage for Garchomp and M-Salamence","Steel-type Fairy answer (Gholdengo, Archaludon or Kingambit) for Whimsicott and Sylveon","Incineroar answer (Fighting- or Water-type attacker), or your own Intimidate to blunt Rillaboom, Salamence and Golisopod","Optional Indeedee-F Psychic Terrain against First Impression and Sucker Punch (Z is grounded), but it disables Z's own priority into grounded targets and triggers an opposing Sneasler's Psychic Seed","No Tailwind needed; avoid Trick Room"]}},{"species":"Lucario","slug":"lucario","hypothetical":false,"hypoNote":"","short":" vs Z","forms":[{"label":"Mega","name":"Mega Lucario","slug":"lucario-mega","stone":"Lucarionite"},{"label":"Mega Z","name":"Mega Lucario Z","slug":"lucario-mega-z","stone":"Lucarionite Z"}],"winnerName":"Mega Lucario","score_a":77,"score_b":80,"rubric_a":"30/40, 22/25, 15/20, 10/15","rubric_b":"32/40, 19/25, 16/20, 13/15","ruleLine":"Rotom Judge rules that Mega Lucario is the better form (Mega Lucario 77, Mega Lucario Z 80).","opinion":"Almost every damage roll reproduces. The debate turned on three things: Focus Sash, Speed, and how many accurate OHKOs each form actually has.\n\n**Accurate OHKOs decide it.** This count uses moves with at least 90% accuracy, ignores Focus Sash holders and uses no item.\n- **Mega Lucario (Jolly)** OHKOs 10 threats: Sneasler (Zen Headbutt), Incineroar, Kingambit, Archaludon, Arcanine-H, M-Baxcalibur and M-Tyranitar (all Close Combat), Garchomp (Ice Punch), and Sylveon and M-Froslass (Meteor Mash). That is 130.61% of summed usage.\n- **Mega Lucario Z (Timid)** OHKOs 5: Sneasler (Psychic), Archaludon, Arcanine-H and M-Tyranitar (Aura Sphere), and M-Froslass (Flash Cannon). That is 53.65% of summed usage.\n- B conceded that without Focus Blast, Rillaboom, Incineroar and Garchomp are 2HKOs for Z. Rillaboom takes 35.3-42% from Aura Sphere, and Garchomp takes 50.3-60%.\n\n**B's real wins:**\n- **Sneasler.** Z moves first and Psychic KOs it (186-221.7%). Mega is outsped and OHKO'd by Close Combat (155.1-183.7%). This is a clean win for Z against the #2 threat.\n- **Aura Guard.** Z is OHKO'd by 4/21 threats against Mega's 8/21. Incineroar's Flare Blitz, M-Salamence's Double-Edge and M-Staraptor's Close Combat stop being KOs.\n- **Intimidate.** It costs the physical Mega its Kingambit KO (81.2-96.6%), its Garchomp KO (Ice Punch 71.4-84.3%) and its Helping Hand Rillaboom KOs.\n\n**Why Mega still wins:**\n- At -1, Mega's Close Combat still OHKOs Incineroar itself (101-120.8%), and Meteor Mash still OHKOs M-Froslass.\n- A Timid Mega out-damages Z's best special set on every shared target and ignores Intimidate just as Z does. Aura Sphere does 108.2-127.5% to Kingambit against Z's 89.9-107.2%.\n- Z's defensive edge does not cover Garchomp. Earthquake hits Z harder: 148.3-176.9% against Mega's 127.2-150.3%.\n- Z cannot take both bulk and damage. A's rebuttal proved this, and B conceded it.\n\n**A's overclaims.** Two of A's OHKOs are blocked by Focus Sash: Pelipper (Thunder Punch) and Whimsicott (Meteor Mash). A also offered Helping Hand Close Combat on Sneasler as a KO even though Sneasler moves first. Bullet Punch is also blocked by Indeedee-F's Psychic Terrain against grounded targets.\n\n**Engine gap (not scored against either side).** Aura Guard is not applied to Fake Out or Glaive Rush, because both are missing from `MF_CONTACT`. The real damage Z takes from those two moves is about half what is shown.","conclusion":"Mega Lucario wins on evidence, even though Mega Lucario Z's advocate argued more cleanly and scores slightly higher (80 vs 77).\n\n- **Accurate OHKOs decide it.** This counts moves with at least 90% accuracy, no item, and leaves out the Focus Sash holders (Pelipper, Whimsicott). Mega OHKOs 10 threats (130.61% summed usage), including Incineroar, Kingambit and Garchomp. Z OHKOs 5 (53.65%). B conceded that Rillaboom, Incineroar and Garchomp are 2HKOs for Z without 70% Focus Blast.\n- **Z's real wins.** It moves first against Sneasler and KOs it with Psychic (186-221.7%), while Mega is outsped and OHKO'd by Close Combat (155.1-183.7%). Aura Guard cuts Z's OHKO count to 4/21 against Mega's 8/21. Its special damage ignores Intimidate.\n- **Intimidate costs Mega some KOs, not all.** At -1, Mega loses its Kingambit and Garchomp KOs but still OHKOs Incineroar (101-120.8%). A Timid Mega out-damages Z on every shared special target.\n- **Overclaims on both sides.** A counted two Focus Sash holders as OHKOs. B's bulk spread cannot keep its 216-SpA KOs, which B conceded.\n\n**What each form is for:**\n- Mega is a Tailwind or Helping Hand-supported physical wallbreaker.\n- Mega Z is a fast special lead that beats Sneasler and survives physical contact hits but needs a partner to bring more damage.\n\n**Engine gap:** MF_CONTACT is missing Fake Out and Glaive Rush, so the engine does not apply Aura Guard to either move.","debate":{"oa":"**Thesis:** Adaptability gives Mega Lucario (holding Lucarionite) the strongest hits either Lucario can throw, on either attacking stat. It removes most of the Reg M-C board with accurate moves, while Mega Lucario Z depends on 70%-accurate Focus Blast and fixes only half the problem with its bulk.\n\nMega Stones take the item slot, so every number below is a no-item calc. Life Orb and Choice Band are not available to either form.\n\n**1. More OHKOs, and they don't depend on luck (fact sheet).**\n- Mega's Jolly physical set OHKOs **12/21** board threats. The Z form's best set OHKOs **9/21**.\n- The Z form's line is built on Focus Blast into Rillaboom, Incineroar, Kingambit, Garchomp and more, and Focus Blast hits 70% of the time.\n- Mega's OHKOs come from accurate moves (engine run):\n  - Close Combat (100%): Incineroar 152.5-180.2%, Kingambit 121.7-144.9%, Archaludon 132.6-156.9%, Arcanine-Hisui 209.3-246.5%, M-Baxcalibur 126.2-149.5%, M-Tyranitar 201-239.6%.\n  - Ice Punch: Garchomp 105.9-125.4%.\n  - Thunder Punch: Pelipper 137.2-163.5%.\n- That is 8 sure OHKOs, with no accuracy discount, against 5 of the most-used threats on the board.\n\n**2. Adaptability beats the Z form's 24 extra SpA on the Z form's own special game (engine).**\n- On Timid 32 SpA, Mega Aura Sphere does 108.2-127.5% to Kingambit, a guaranteed OHKO. The Z form's Aura Sphere does 89.9-107.2% (6/16).\n- Into Incineroar, Mega does 83.2-99% and the Z form does 71.3-84.2%.\n- Mega Flash Cannon does 88.1-106.2% to Sylveon. The Z form does 74.6-88.1%.\n- Mega Vacuum Wave does 85-100.5% to M-Tyranitar. The Z form does 69.6-83.1%.\n- The Z form's high Special Attack does not make up for losing the x2 STAB.\n\n**3. Priority with double STAB covers the three threats that outspeed it (sheet plus engine).**\n- At 180 Speed, Mega is outspeeded only by Sneasler (189), Whimsicott (184) and M-Froslass (189).\n- Meteor Mash OHKOs all three: Sneasler 107-126.1%, Whimsicott 186.9-221.9%, Froslass 201.4-239.5%. It is 90% accurate.\n- Bullet Punch, a priority move at +1, does 92.5-108.8% to M-Froslass and 84.7-102.2% to Whimsicott before they move.\n\n**4. Helping Hand turns the top threat into an OHKO (engine).**\n- With Helping Hand, High Jump Kick does 124.6-147.8% to Rillaboom (37.18% usage) and Close Combat does 114.5-136.2%. Unboosted, the best hit is 83.1-98.6%.\n- Helping Hand Close Combat also OHKOs Sneasler (107-126.1%), Indeedee-F (118.6-140.7%), Farigiraf (106.8-127%) and Milotic (121.8-144.1%).\n- Those are the first- and sixth-most-used threats, plus Farigiraf and Milotic, all removed in one move.\n\n**5. Swords Dance takes over the game (engine, +2 Atk).**\n- At +2, Close Combat OHKOs Rillaboom (152.7-180.7%), M-Metagross (122.8-145%), Pelipper (108-127.7%) and Milotic (161.4-190.1%). M-Golisopod goes down on 15/16 rolls (98.9-117.6%).\n- At +2, Meteor Mash OHKOs M-Staraptor (121.1-142.7%).\n- On this board, only Gholdengo (68.6-81.1%) and M-Salamence (96.8-114%, 13/16) avoid a sure OHKO. Ice Punch OHKOs M-Salamence at 159.1-189.2%.\n- The Z form's Aura Guard gives it nothing comparable.\n\n**Team role and partners.**\n- Mega Lucario is a Jolly 2/32/32 physical sweeper with Close Combat, Meteor Mash, Ice Punch or Bullet Punch, and Protect or Swords Dance.\n- It pairs best with a Helping Hand or redirection partner. Indeedee-F's Follow Me covers a Swords Dance turn. Incineroar's Fake Out and Intimidate help it survive the fire and fighting hits it fears.\n- A Tailwind setter such as Whimsicott lifts it to 360 Speed, above the entire board.\n- Lucario resists Normal, Grass, Ice, Dragon, Dark and Steel, and is immune to Poison. That lets it switch into Kingambit, Rillaboom's Grassy Glide and Garchomp's Dragon Claw.\n\n**Pre-empting the Z form's case: 223 Speed and Aura Guard.**\n- **Speed.** Outspeeding all 21 threats only matters if the hit that follows is a KO. Against Rillaboom, Incineroar, Kingambit and Garchomp, the Z form's KO or near-KO move is Focus Blast, which fails 30% of the time. On a two-target turn, both Focus Blasts land only 49% of the time.\n- **Bulk.** The Z form is OHKO'd by 4/21 threats against Mega's 8/21. Aura Guard only halves contact moves, though, and the Z form's Defense is 90 against Mega's 108:\n  - Garchomp's Earthquake OHKOs the Z form harder: 148.3-176.9%, against 127.2-150.3% on Mega.\n  - Sylveon's Hyper Beam, Pelipper's Weather Ball and Gholdengo's Shadow Ball do exactly the same to both forms.\n  - The Z form still takes 92.5-110.2% from Sneasler's Close Combat (10/16 OHKO).\n- **Summary.** The Z form survives more hits but deals less damage with each attack. Mega Lucario turns each hit it takes into an accurate OHKO.","ob":"**Opening argument for Mega Lucario Z**\n\n**Thesis:** Mega Lucario Z is the better Mega for Reg M-C doubles. It is the fastest Mega in the format, half as many board threats can OHKO it, and it doesn't depend on a 90%-accurate crash move or on an Attack stat that Intimidate can cut.\n\n**1. Nothing on the board outspeeds it (fact sheet).** Timid 32 Spe gives Mega Z 223 Speed. It outspeeds all 21 board threats, and no Mega is faster; it only ties Absol Mega Z and Garchomp Mega Z. Mega Lucario tops out at 180. Sneasler (189, 34.29% usage, the #2 threat), Whimsicott (184) and M-Froslass (189) all move before it, and 22 Megas are faster than it. The Sneasler matchup decides the argument. Without Psychic Terrain (its Psychic Seed Unburden needs terrain), Mega Z moves first and Psychic does 186–221.7%, a KO. Mega Lucario moves second and takes Close Combat for 155.1–183.7%, a KO. Mega Z also survives that Close Combat in 6 of 16 rolls (92.5–110.2%).\n\n**2. Aura Guard halves the board's main attacks (fact sheet).** Mega Z is OHKO'd by 4 of 21 threats; Mega Lucario by 8 of 21. The threats Mega Lucario loses to but Mega Z survives:\n- Incineroar Flare Blitz (26.77% usage): 126.5–148.3% KO becomes 75.5–89.8%\n- M-Salamence Double-Edge: 110.2–130.6% KO becomes 66.0–78.2%\n- M-Golisopod Close Combat: 164.6–194.6% KO becomes 99.3–117%\n- M-Staraptor Close Combat: 144.2–171.4% KO becomes 86.4–102.7% (only 3/16 KO)\n- Kingambit Low Kick: 77.6–92.5% becomes 46.9–55.8%\n\nMy engine run with a 32 HP / 2 Def / 32 Spe spread (HP 177) stops every contact move on the board from OHKOing it:\n- Sneasler Close Combat: 76.3–89.8%\n- Golisopod Close Combat: 80.2–94.9%\n- Arcanine-Hisui Flare Blitz: 90.4–106.2%, only 7/16 KO\n\nIt keeps 223 Speed on that spread.\n\n**3. Intimidate doesn't touch it (my engine run).** Incineroar is the #3 threat at 26.77% usage and brings Intimidate. Mega Lucario's damage depends on its Attack stat. At −1, its High Jump Kick on Kingambit drops from a clean KO (131.4–156.5%) to 87–104.3% (4/16). Its HJK on Rillaboom drops to 55.1–65.7%, and on Garchomp to 60.5–72.4%. Mega Z attacks with 216 SpA: Aura Sphere, Flash Cannon, Psychic and Vacuum Wave. Intimidate does nothing to any of them.\n\n**4. Its attacks hit reliably (my engine run, E.accuracy).** Aura Sphere is 100% accurate. It KOs M-Tyranitar (135.3–162.3%), Archaludon (127.1–150.3%) and Arcanine-Hisui (115.1–136%). Flash Cannon KOs M-Froslass (111.6–132%), and Psychic KOs Sneasler. Mega Lucario's board-wide numbers lean on High Jump Kick (90%, and it crashes on a miss) and Iron Tail (75%). Its answers to Whimsicott, Sylveon, M-Froslass and M-Staraptor are all Iron Tail, so a quarter of those turns do nothing.\n\n**5. Helping Hand adds KOs (my engine run).** With Helping Hand, Aura Sphere KOs Incineroar (106.9–126.2%), Kingambit (134.8–160.9%) and M-Baxcalibur (118–139.8%). It also puts Garchomp at 75.1–89.7% before Garchomp can act. Vacuum Wave gives it Fighting priority to finish targets: 69.6–83.1% on M-Tyranitar and 64.1–76.2% on Archaludon.\n\n**Team role and partners.** Mega Z is a speed-control-independent lead. It outspeeds Sneasler and M-Froslass without Tailwind, which frees a team slot. Good partners:\n- **Helping Hand user**, to reach the KOs above.\n- **Fake Out user**, to cover it.\n- **Ground-immune or Wide Guard partner.** Garchomp Earthquake is its one clean loss (148.3–176.9% KO).\n- **A way to deny Indeedee-F's Psychic Terrain.** That terrain is the only thing that lets a Psychic Seed Sneasler outspeed it.\n\nBecause the Mega holds its stone, it can't use Choice Band or Specs anyway (neither exists in Champions). So Mega Lucario's item headroom doesn't exist, and the forms compare on raw stats and ability.\n\n**Pre-empting the opponent.** Mega Lucario's best point is Adaptability's 12/21 no-item OHKOs against Mega Z's 9/21. The raw count overstates it:\n- It is a Speed-180 Pokémon, and Sneasler, Whimsicott and M-Froslass all move before it. Mega Lucario is OHKO'd by 8 board threats, including the #2 (Sneasler) and #3 (Incineroar).\n- Several of those OHKOs depend on 90% HJK or 75% Iron Tail.\n- The first Intimidate from the #3-usage threat turns KOs into 2HKOs. Kingambit goes from a KO to 87–104.3%.\n\nDamage that loses the Speed race, can miss, and shrinks when Incineroar switches in is not as good as the table makes it look.\n\nOn Fake Out: the engine prices Incineroar's Fake Out at 8.2–10.2% on Mega Z against 6.8–8.2% on Mega Lucario, so it doesn't appear to apply Aura Guard to Fake Out. `MF_CONTACT` in `champions-team-building/app/app.js` may be missing Fake Out. I left it out of the argument.","ra":"**Rebuttal for Mega Lucario**\n\n**Concessions first.**\n- Mega Lucario Z has 223 Speed and Mega Lucario has 180. Mega Lucario Z moves before Sneasler, and its Psychic KOs it (186–221.7%). Mega Lucario moves second, and Sneasler's Close Combat OHKOs it. Sneasler is a clean win for Mega Lucario Z.\n- Aura Guard is real. Mega Lucario Z is OHKO'd by 4/21 threats, against 8/21 for Mega Lucario. Incineroar's Flare Blitz is a KO on me and is not a KO on Mega Lucario Z.\n\n**1. The bulk spread and the damage spread are two different Pokémon.**\nThe opponent's bulk figures use 32 HP / 2 Def / 32 Spe. Its KO figures use 216 SpA. It cannot have both at once. On the bulk spread, SpA is 184. I re-ran the engine at 184 SpA:\n- **Aura Sphere into Kingambit:** 76.3–90.8%, not a KO.\n- **Aura Sphere into Incineroar:** 59.4–71.3%.\n- **Aura Sphere into Arcanine-Hisui:** 97.7–115.1%, a KO on 13/16 rolls.\n- **Helping Hand Aura Sphere into Incineroar:** 89.1–106.9%, a KO on 5/16 rolls, not the 106.9–126.2% claimed.\n- **Flash Cannon into M-Froslass:** 93.9–111.6%, a KO on 10/16 rolls. The claim was 111.6–132%.\n\nSo the bulky Mega Lucario Z gives up the KOs that point 5 depends on. The Mega Lucario Z that keeps those KOs is back to 147 HP and loses the \"no contact move OHKOs it\" line.\n\n**2. Intimidate is overstated, and it can be avoided entirely.**\n- **My set doesn't lean on the moves they named.** I never argued with High Jump Kick or Iron Tail. My opening used Close Combat and 90%-accurate Meteor Mash.\n- **Numbers at −1 Attack (engine):**\n  - Close Combat into Incineroar: 101–120.8%. It still OHKOs the Intimidate user itself.\n  - Meteor Mash into Whimsicott: 125.5–148.9%, still a KO.\n  - Meteor Mash into M-Froslass: 136.1–160.5%, still a KO.\n  - Meteor Mash into Sylveon: 94.9–113%, a KO on 11/16 rolls.\n  - Close Combat into Kingambit: 81.2–96.6%. I concede that KO is lost.\n- **Mega Lucario has a special set too.** If Incineroar is a worry, a Timid special Mega Lucario ignores Intimidate completely, and it hits harder than Mega Lucario Z's best-case 216 SpA:\n  - Kingambit: 108.2–127.5%, a KO. Mega Lucario Z does 89.9–107.2%.\n  - Incineroar: 83.2–99%. Mega Lucario Z does 71.3–84.2%.\n  - Archaludon: 150.3–179%. Mega Lucario Z does 127.1–150.3%.\n- **Adaptability's x2 STAB beats 24 extra points of SpA.** Mega Lucario Z's \"Intimidate-proof\" advantage belongs to Mega Lucario as well.\n\n**3. Speed only matters if the attack that follows KOs.**\n- **Sneasler is the one clean Speed win.** Mega Lucario Z's Psychic KOs it even on the bulk spread (158–188.5%).\n- **Against the other top threats, being first doesn't produce a KO.**\n  - Rillaboom (the #1 threat): Aura Sphere does 35.3–42%.\n  - Garchomp: Aura Sphere does 50.3–60%.\n  - Mega Lucario Z's only way to KO either one is Focus Blast. The engine gives it 70% accuracy.\n- **Mega Lucario outspeeds and OHKOs most of what Mega Lucario Z mainly outspeeds.** At 180 Speed, only three threats are faster than Mega Lucario (Sneasler, Whimsicott and M-Froslass). Meteor Mash OHKOs Whimsicott and M-Froslass. Bullet Punch puts real damage on both before they move (84.7–102.2% on Whimsicott, 92.5–108.8% on M-Froslass).\n\n**Summary.** Mega Lucario Z wins the Sneasler matchup and takes contact hits better. Mega Lucario hits harder on either stat, and many of its KOs survive Intimidate at −1. Its KOs come from 100% and 90% moves, not from 70% Focus Blast. In a format decided by removing threats, that matters more than an extra 43 Speed.\n\n**Why Mega Lucario still wins:** Mega Lucario Z has to choose between bulk and damage and still needs a 70% Focus Blast for its biggest KOs, while Mega Lucario turns each turn into an accurate KO on either attacking stat.","rb":"Mega Lucario's attacks hit harder. I accept that and correct my own spread first. My 32 HP / 2 Def / 32 Spe bulk spread has 184 SpA, not 216 (engine `stats()`), so the bulk numbers and the SpA numbers in my opening can't both be on the field at once. The opponent is also right that Adaptability out-damages the Z form's extra SpA. Mega Aura Sphere does 108.2–127.5% to Kingambit. Mine does 89.9–107.2% (6/16). The 12/21 vs 9/21 OHKO count stands.\n\nThree of their points need correcting.\n\n**1. The Speed answer to Sneasler doesn't work.** Mega Lucario never gets to throw Meteor Mash (107–126.1%) or Helping Hand Close Combat on Sneasler. Sneasler is faster (189 vs 180), and its Close Combat does 155.1–183.7% to Mega (fact sheet), so Mega is KO'd before it moves. The same applies to Helping Hand CC on Sneasler, and Zen Headbutt already KOs it without Helping Hand (188.5–224.2%). Sneasler is the #2 threat at 34.29% usage. Mega Z moves first and Psychic KOs it (186–221.7%). That one matchup is my case.\n\n**2. The Whimsicott and Froslass numbers miss context.** Whimsicott on the board holds a Focus Sash (engine.js BOARD). Meteor Mash at 186.9–221.9% doesn't OHKO it, and neither does my Flash Cannon. Bullet Punch into M-Froslass is 8/16. Indeedee-F's Psychic Terrain (21.78% usage) blocks Bullet Punch against grounded Froslass and Whimsicott, but it blocks my Vacuum Wave the same way. I concede that Mega survives Froslass's hits: Shadow Ball does 66–78.2% and snow Blizzard does 34–40.1%. So it can take a hit and then OHKO back.\n\n**3. The Helping Hand and Swords Dance numbers assume no Intimidate.** Incineroar is the #3 threat, and they name it as their own partner. When the opponent brings it, Mega's physical numbers drop:\n- Helping Hand Close Combat on Rillaboom at −1 does 76.8–91.3%.\n- Helping Hand High Jump Kick on Rillaboom does 82.6–98.6%, so their Rillaboom OHKO is gone.\n- Close Combat at −1 does 81.2–96.6% to Kingambit, 5/16 to Archaludon and 1/16 to M-Baxcalibur.\n\nSwords Dance needs a free turn, and at 180 Speed that means redirection just to set up.\n\n**On Focus Blast:** that's the fact sheet's automated pick, not my set. I never ran it. My Aura Sphere lines are 100% accurate:\n- M-Tyranitar: 135.3–162.3%\n- Archaludon: 127.1–150.3%\n- Arcanine-Hisui: 115.1–136%\n\nI concede that without Focus Blast, Rillaboom, Incineroar and Garchomp are 2HKOs for Mega Z (Aura Sphere does 50.3–60% to Garchomp). Mega Lucario's accurate Close Combat and Ice Punch KOs on Incineroar and Garchomp are real.\n\n**On bulk:** they're right that Earthquake, Hyper Beam, Weather Ball and Shadow Ball hit both forms the same. But Aura Guard turns four contact hits that KO Mega into hits the Z form usually survives:\n- Incineroar Flare Blitz: 75.5–89.8%, no KO\n- M-Salamence Double-Edge: 66–78.2%, no KO\n- M-Staraptor Close Combat: 3/16 KO\n- M-Golisopod Close Combat: 15/16 KO on the no-investment spread\n\nGolisopod doesn't KO the bulk spread (80.2–94.9%), but that spread gives up SpA.\n\nMega Lucario hits harder per attack, but Mega Lucario Z still wins: it moves before the #2 threat and KOs it, and Intimidate from the #3 threat doesn't touch its damage, while Mega's KOs need it to survive a Sneasler first or to face a board with no Incineroar."},"checks":[{"sideName":"Mega Lucario","side":"A","claim":"Close Combat OHKOs Incineroar/Kingambit/Archaludon/Arcanine-H/M-Bax/M-Ttar; Ice Punch OHKOs Garchomp 105.9-125.4%","holds":true,"recomputed":"CC 152.5-180.2 / 121.7-144.9 / 132.6-156.9 / 209.3-246.5 / 126.2-149.5 / 201-239.6; IP Garchomp 105.9-125.4"},{"sideName":"Mega Lucario","side":"A","claim":"Thunder Punch OHKOs Pelipper 137.2-163.5% (one of 8 sure OHKOs)","holds":false,"recomputed":"137.2-163.5% but Pelipper holds Focus Sash on the board, so no OHKO from full HP"},{"sideName":"Mega Lucario","side":"A","claim":"Meteor Mash OHKOs Whimsicott 186.9-221.9% (125.5-148.9% at -1)","holds":false,"recomputed":"186.9-221.9% / 125.5-148.9% but Whimsicott holds Focus Sash"},{"sideName":"Mega Lucario","side":"A","claim":"Timid Mega Aura Sphere Kingambit 108.2-127.5% vs Z 89.9-107.2%; Incineroar 83.2-99% vs 71.3-84.2%","holds":true,"recomputed":"108.2-127.5 vs 89.9-107.2 (6/16); 83.2-99 vs 71.3-84.2"},{"sideName":"Mega Lucario","side":"A","claim":"HH HJK Rillaboom 124.6-147.8%, HH CC Rillaboom 114.5-136.2%, HH CC Indeedee-F 118.6-140.7%","holds":true,"recomputed":"124.6-147.8 / 114.5-136.2 / 118.6-140.7"},{"sideName":"Mega Lucario","side":"A","claim":"-1 CC Incineroar 101-120.8% KO, -1 CC Kingambit 81.2-96.6%, -1 MM Sylveon 94.9-113% (11/16)","holds":true,"recomputed":"101-120.8 KO / 81.2-96.6 / 94.9-113 (11/16)"},{"sideName":"Mega Lucario","side":"A","claim":"Z bulk spread (184 SpA): AS Kingambit 76.3-90.8%, HH AS Incineroar 89.1-106.9% (5/16), FC Froslass 93.9-111.6% (10/16)","holds":true,"recomputed":"SpA 184; 76.3-90.8 / 89.1-106.9 (5/16) / 93.9-111.6 (10/16)"},{"sideName":"Mega Lucario Z","side":"B","claim":"Z 223 Speed outspeeds all 21; Psychic on Sneasler 186-221.7%; Sneasler CC on Mega 155.1-183.7%, on Z 92.5-110.2% (10/16)","holds":true,"recomputed":"223; 186-221.7 KO; 155.1-183.7 KO; 92.5-110.2 (10/16)"},{"sideName":"Mega Lucario Z","side":"B","claim":"Bulk spread 32/2/32 stops every contact OHKO while keeping 216-SpA KOs (HH AS Incineroar 106.9-126.2%)","holds":false,"recomputed":"Bulk spread has 184 SpA: HH AS Incineroar 89.1-106.9% (5/16); Arcanine-H Flare Blitz still 90.4-106.2% (7/16)"},{"sideName":"Mega Lucario Z","side":"B","claim":"At -1: HJK Kingambit 87-104.3% (4/16), HJK Rillaboom 55.1-65.7%, HJK Garchomp 60.5-72.4%, HH HJK Rillaboom 82.6-98.6%","holds":true,"recomputed":"87-104.3 (4/16) / 55.1-65.7 / 60.5-72.4 / 82.6-98.6"},{"sideName":"Mega Lucario Z","side":"B","claim":"Aura Sphere OHKOs M-Ttar 135.3-162.3%, Archaludon 127.1-150.3%, Arcanine-H 115.1-136%; HH AS Kingambit 134.8-160.9%, M-Bax 118-139.8%","holds":true,"recomputed":"135.3-162.3 / 127.1-150.3 / 115.1-136 / 134.8-160.9 / 118-139.8"},{"sideName":"Mega Lucario Z","side":"B","claim":"Aura Guard: Incineroar Flare Blitz on Z 75.5-89.8% vs Mega 126.5-148.3%; Garchomp EQ on Z 148.3-176.9%","holds":true,"recomputed":"75.5-89.8 vs 126.5-148.3; EQ Z 148.3-176.9 vs Mega 127.2-150.3"},{"sideName":"Mega Lucario Z","side":"B","claim":"Engine does not apply Aura Guard to Fake Out (8.2-10.2% on Z vs 6.8-8.2% on Mega)","holds":true,"recomputed":"Confirmed; Fake Out (and Glaive Rush) absent from MF_CONTACT in app/app.js"}],"teams":[{"legal":true,"paste":"Lucario @ Lucarionite\nAbility: Justified\nLevel: 50\nEVs: 4 HP / 28 Atk / 2 Def / 32 Spe\nJolly Nature\n- Close Combat\n- Meteor Mash\n- Ice Punch\n- Protect\n\nWhimsicott @ Focus Sash\nAbility: Prankster\nLevel: 50\nEVs: 26 HP / 8 SpA / 32 Spe\nTimid Nature\n- Tailwind\n- Moonblast\n- Helping Hand\n- Encore\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 22 Atk / 12 Def\nAdamant Nature\n- Fake Out\n- Flare Blitz\n- Darkest Lariat\n- Parting Shot\n\nTalonflame @ Life Orb\nAbility: Gale Wings\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Brave Bird\n- Flare Blitz\n- Tailwind\n- Protect\n\nGholdengo @ Expert Belt\nAbility: Good as Gold\nLevel: 50\nEVs: 32 Def / 32 SpA / 2 Spe\nModest Nature\n- Make It Rain\n- Psyshock\n- Focus Blast\n- Protect\n\nPrimarina @ Mystic Water\nAbility: Torrent\nLevel: 50\nEVs: 32 HP / 10 Def / 24 SpA\nModest Nature\n- Moonblast\n- Hydro Pump\n- Icy Wind\n- Protect\n","default_four":"Default bring: Mega Lucario, Whimsicott, Incineroar, Talonflame.\n- Lead Whimsicott + Lucario. On turn 1, Lucario Mega Evolves and Whimsicott sets Tailwind with Prankster priority. Lucario uses Close Combat or Ice Punch, or Protect into a Fake Out or Sneasler lead.\n- In the back, Incineroar resets Intimidate and Fake Out. Talonflame is the second Tailwind (Gale Wings priority) and the answer to Rillaboom and Sneasler.\n- Against Sneasler or psyspam: lead Gholdengo + Whimsicott, with Lucario and Primarina in the back.\n- Against dragons, Garchomp or M-Salamence: bring Primarina instead of Talonflame.\n- Against Trick Room: lead Incineroar + Lucario and use Helping Hand Close Combat to OHKO Indeedee-F or Farigiraf.","headline":"Mega Lucario is a Tailwind wallbreaker. Two Tailwind setters (Prankster Whimsicott and Gale Wings Talonflame) take it to 360 Speed. Whimsicott's Helping Hand and Incineroar's Fake Out and Intimidate support it, and Gholdengo and Primarina cover Sneasler, M-Salamence and Garchomp. Every top-8 threat has two engine-verified answers, but two of them are inaccurate: Hydro Pump on Incineroar (80%) and Focus Blast on Kingambit (70%). The worst matchup is psyspam with Unburden Sneasler plus Trick Room.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Lucario/lucario-mega-notes.md"},{"legal":true,"paste":"Lucario @ Lucarionite Z\nAbility: Inner Focus\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Aura Sphere\n- Flash Cannon\n- Psychic\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 22 Atk / 12 Def\nAdamant Nature\n- Fake Out\n- Flare Blitz\n- Darkest Lariat\n- Helping Hand\n\nRillaboom @ Miracle Seed\nAbility: Grassy Surge\nLevel: 50\nEVs: 32 HP / 32 Atk / 2 Def\nBrave Nature\n- Fake Out\n- Grassy Glide\n- Wood Hammer\n- High Horsepower\n\nTalonflame @ Sharp Beak\nAbility: Gale Wings\nLevel: 50\nEVs: 10 HP / 32 Atk / 24 Spe\nAdamant Nature\n- Brave Bird\n- Flare Blitz\n- Tailwind\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Power Gem\n- Protect\n\nDragonite @ Never-Melt Ice\nAbility: Multiscale\nLevel: 50\nEVs: 32 HP / 32 Atk / 2 Def\nAdamant Nature\n- Extreme Speed\n- Ice Spinner\n- Tailwind\n- Helping Hand\n","default_four":"Default four: Lucario and Incineroar lead, with Talonflame and Dragonite in the back.\n- Turn 1: Incineroar uses Fake Out while Lucario Mega Evolves and KOs whatever it outspeeds. Psychic OHKOs Sneasler (186-221.7%) and Flash Cannon OHKOs M-Froslass (111.6-132%).\n- Turn 2: Incineroar's Helping Hand turns Aura Sphere into OHKOs on Incineroar (106.9-126.2%) and Kingambit (134.8-160.9%).\n\nSwaps by matchup:\n- **Indeedee-F psyspam or Garchomp:** lead Lucario and Rillaboom. Grassy Surge overwrites Psychic Terrain, and Grassy Terrain halves Earthquake on Lucario to 74.1-88.4%. Gholdengo comes in the back against Sneasler.\n- **Sylveon or Fairy teams:** bring Gholdengo. Make It Rain OHKOs Sylveon (101.1-120.3%).\n- **Rain:** bring Rillaboom and Gholdengo, and leave Talonflame and Incineroar behind, because Weather Ball OHKOs both.\n- **Trick Room:** lead Rillaboom and Incineroar and double into Farigiraf.","headline":"Mega Lucario Z (Timid, 216 SpA, 223 Spe) is the fast special lead, and its partners give it Helping Hand (Incineroar, Dragonite) and Grassy Terrain (Rillaboom), which halves Garchomp's Earthquake and overwrites Psychic Terrain. Speed control is Gale Wings Tailwind (Talonflame, with Dragonite as backup), two Fake Outs and a priority package, and every top threat has two engine-checked answers.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Lucario/lucario-mega-z-notes.md"}],"brief_a":{"game_plan":"Jolly 2 HP / 32 Atk / 32 Spe Mega Lucario (180 Spe): Close Combat, Meteor Mash, Ice Punch, Protect or Swords Dance.\n\nIt is a physical Adaptability wallbreaker that OHKOs the slow and mid-speed bulk with accurate moves:\n- Close Combat: Incineroar, Kingambit, Archaludon, Arcanine-H, M-Baxcalibur, M-Tyranitar.\n- Ice Punch: Garchomp.\n- Meteor Mash: Sylveon, M-Froslass.\n\nThe team supplies Speed (Tailwind) and redirection or Fake Out, because it is outsped and OHKO'd by Sneasler and OHKO'd by 8/21 threats.\n\nIf the opponent leans on Intimidate, a Timid special set is the alternative: Aura Sphere, Flash Cannon, Psychic, Vacuum Wave.","lean_into":["Accurate no-item Close Combat OHKOs: Incineroar 152.5-180.2%, Kingambit 121.7-144.9%, Archaludon 132.6-156.9%, Arcanine-H 209.3-246.5%, M-Bax 126.2-149.5%, M-Ttar 201-239.6%","Ice Punch OHKOs Garchomp 105.9-125.4%","Meteor Mash (90%) OHKOs Sylveon 140.1-167.2% and M-Froslass 201.4-239.5%","Helping Hand OHKOs: HJK Rillaboom 124.6-147.8%, CC Rillaboom 114.5-136.2%, CC Indeedee-F 118.6-140.7%, CC Farigiraf 106.8-127%, CC Milotic 121.8-144.1%","+2 OHKOs: CC Rillaboom 152.7-180.7% and M-Metagross 122.8-145%, Ice Punch M-Salamence 159.1-189.2%, Blaze Kick Gholdengo 130.2-153.8%","Through Intimidate, -1 CC still OHKOs Incineroar (101-120.8%) and -1 Meteor Mash still OHKOs M-Froslass (136.1-160.5%)","Timid special alternative ignores Intimidate: Aura Sphere Kingambit 108.2-127.5%, Archaludon 150.3-179%; Psychic Sneasler 168.2-198.7%"],"must_cover":["Sneasler (34.29%): 189 Speed beats 180, and its CC OHKOs Mega at 155.1-183.7%","Hits that OHKO Mega: Incineroar Flare Blitz 126.5-148.3%, M-Salamence Double-Edge 110.2-130.6%, M-Golisopod CC 164.6-194.6%, Garchomp EQ 127.2-150.3%, Arcanine-H Flare Blitz 185.7-219%, M-Staraptor CC 144.2-171.4%, Sylveon Hyper Beam 153.1-180.3%","Intimidate cuts physical KOs at -1: CC Kingambit 81.2-96.6%, Ice Punch Garchomp 71.4-84.3%, CC Archaludon 5/16, CC M-Bax 1/16, HH HJK Rillaboom 82.6-98.6%","Rillaboom (37.18%) has no unboosted OHKO (HJK 83.1-98.6%, and HJK crashes on a miss); it needs Helping Hand or +2","Focus Sash on Pelipper and Whimsicott: do not count them as OHKOs","Whimsicott (184) and M-Froslass (189) outspeed it; Psychic Terrain blocks Bullet Punch against grounded targets","Gholdengo is immune to CC and HJK; unboosted Blaze Kick only does 66.3-78.1%"],"partner_ideas":["Tailwind setter (Whimsicott or Pelipper) to reach 360 Speed and move before Sneasler","Helping Hand user to OHKO Rillaboom, Indeedee-F, Farigiraf and Milotic","Follow Me or Rage Powder redirector (Indeedee-F or Amoonguss) to cover a Swords Dance turn","Incineroar for Fake Out plus Intimidate to blunt Flare Blitz, Double-Edge and Close Combat","Water type or Flying/Levitate partner to take Fire and Ground hits","Special Fire or Dark attacker for Gholdengo"]},"brief_b":{"game_plan":"Timid 2 HP / 32 SpA / 32 Spe Mega Lucario Z (216 SpA, 223 Spe): Aura Sphere, Flash Cannon, Psychic, Vacuum Wave or Protect.\n\nIt is a fast special lead that outspeeds all 21 threats without Tailwind. It KOs Sneasler, M-Froslass, Archaludon, Arcanine-H and M-Tyranitar with accurate moves, and Aura Guard lets it survive the physical contact hits that KO regular Mega Lucario.\n\nDo not run the 32 HP bulk spread when you need KOs: at 184 SpA it loses them.\n\nThe team must bring the damage Z lacks into Rillaboom, Incineroar, Garchomp and Kingambit (2HKOs without Helping Hand or 70% Focus Blast), and must cover Garchomp's Earthquake.","lean_into":["223 Speed; no Mega is faster (Absol Mega Z and Garchomp Mega Z tie it)","Psychic OHKOs Sneasler 186-221.7% before it moves","Flash Cannon OHKOs M-Froslass 111.6-132%","Aura Sphere OHKOs M-Ttar 135.3-162.3%, Archaludon 127.1-150.3% and Arcanine-H 115.1-136%","Helping Hand Aura Sphere OHKOs Incineroar 106.9-126.2%, Kingambit 134.8-160.9% and M-Bax 118-139.8%; Helping Hand Focus Blast (70%) OHKOs Garchomp 112.4-133.5%","Aura Guard: OHKO'd by only 4/21. Incineroar Flare Blitz 75.5-89.8%, M-Salamence Double-Edge 66-78.2%, Kingambit Low Kick 46.9-55.8%, Sneasler CC 92.5-110.2% (10/16)","All-special damage is unaffected by Intimidate"],"must_cover":["Garchomp Earthquake 148.3-176.9% OHKO (non-contact, so Aura Guard does not apply)","Sylveon Hyper Beam 153.1-180.3%, Arcanine-H Flare Blitz 111.6-130.6%, M-Golisopod CC 15/16, Pelipper rain Weather Ball 11/16","Rillaboom (37.18%): Aura Sphere 35.3-42%, and even Helping Hand Focus Blast is only 78.7-93.2%","Low damage elsewhere: Garchomp Aura Sphere 50.3-60%, Incineroar 71.3-84.2%, Kingambit 89.9-107.2% (6/16), Sylveon Flash Cannon 74.6-88.1%","Indeedee-F Psychic Terrain (21.78%) triggers Sneasler's Psychic Seed and Unburden, which outspeeds Z, and blocks Vacuum Wave against grounded targets","Focus Sash on Whimsicott and Pelipper: Flash Cannon's 150.4-179.6% does not OHKO Whimsicott"],"partner_ideas":["Helping Hand user for the Aura Sphere OHKOs on Incineroar, Kingambit and M-Bax","Rillaboom answer: a Flying or Fire attacker","Wide Guard user, or a Flying/Levitate partner, against Garchomp's Earthquake","Grassy, Electric or Misty Surge setter to overwrite Psychic Terrain and deny Sneasler's Psychic Seed","Fake Out user","Fairy and Special Defense check for Sylveon's Hyper Beam","Physical attacker to pressure slow bulk; Z needs no Tailwind, which frees a slot"]}},{"species":"Greninja","slug":"greninja","hypothetical":true,"hypoNote":"Ash-Greninja is not in Pokémon Champions. Mega Greninja is real Champions data; Ash-Greninja is a what-if using its Gen 7 Battle Bond transformation with Champions Greninja's moves. Every other Pokémon, item and rule is real Champions data.","short":" vs Ash","forms":[{"label":"Mega","name":"Mega Greninja","slug":"greninja-mega","stone":"Greninjite"},{"label":"Ash","name":"Ash-Greninja","slug":"greninja-ash","stone":"a normal item (no Mega Stone)"}],"winnerName":"Ash-Greninja","score_a":78,"score_b":70,"rubric_a":"32/40, 18/25, 17/20, 11/15","rubric_b":"24/40, 21/25, 16/20, 9/15","ruleLine":"Rotom Judge rules that Ash-Greninja is the better form (Mega Greninja 78, Ash-Greninja 70).","opinion":"I rule for Ash-Greninja. B did not argue it well, but the corrected evidence supports it. B built its case on Choice Specs, which does not exist in Champions. That cost B points on Evidence and Honesty. A never noticed, and conceded the Specs figures. When I reran B's case with Life Orb, the gap mostly held. Transformed Ash OHKOs 13/21 (11 net of Sash) without being locked into one move. Mega Greninja OHKOs 8/21 on fresh Protean and 3/21 once Protean is spent. B's strongest rebuttal was the Protean-spent collapse, and it holds.\n\nA was right on several points. Mega is faster, at 213 against 202 and 191. Gunk Shot OHKOs Rillaboom (104.3-122.7%), while Life Orb Ash's Ice Beam does only 65.2-77.8%. Pre-KO rain Water Shuriken is weak, at 59.2-70.7% into Sneasler. A was wrong in two places. First, A quoted Ash's weaker physical Life Orb spread (5/21); the special spread OHKOs 7/21 before any KO, which is close to Mega's 8/21. Second, A's headline is \"Helping Hand Liquidation KOs Incineroar\", but Incineroar's own Intimidate drops that hit to 75.7-89.1%. At -1, physical Mega's no-help OHKO count falls to 2/21. Neither side mentioned Intimidate.\n\nB's claim of priority KOs on Sneasler and Incineroar mostly did not survive the move to Life Orb. Rain Water Shuriken against Sneasler KOs on only 7/16 rolls, and Psychic Terrain blocks it outright. It still KOs Incineroar in rain or with Helping Hand (104-127.7%). Neither side priced Sneasler's Psychic Seed and Unburden: on an Indeedee-F team, Sneasler outspeeds both forms.\n\nWhat decided it: Ash has every advantage Mega Greninja has except about 11-22 points of Speed and one Rillaboom KO. Ash also keeps its item slot and leaves the team's Mega Evolution free. Mega Greninja is best as a fast Helping Hand nuke on the turn after it switches in; its special set with Helping Hand OHKOs 13/21 even with Protean spent. Ash is best as a Life Orb special attacker that snowballs after its first KO and shares the team with a second Mega.\n\nConclusion: Ash-Greninja is the better form in this format, even without the illegal Choice Specs. First, transformed Life Orb Ash OHKOs 13/21 with free move choice (17/21 with Helping Hand). Mega Greninja OHKOs 8/21 on fresh Protean and only 3/21 physical once Protean is spent. Second, before its first KO, Life Orb Battle Bond Greninja already matches Mega Greninja (7/21 against 8/21, and 14/21 against 15/21 with Helping Hand) while still outspeeding all 21 threats at 191. Third, Ash leaves the team's one Mega Evolution free. Mega Greninja's real edges are 213 Speed and the Gunk Shot KO on Rillaboom, and they do not outweigh those three points.","conclusion":"Conclusion: Ash-Greninja is the better form in this format, even without the illegal Choice Specs. First, transformed Life Orb Ash OHKOs 13/21 with free move choice (17/21 with Helping Hand). Mega Greninja OHKOs 8/21 on fresh Protean and only 3/21 physical once Protean is spent. Second, before its first KO, Life Orb Battle Bond Greninja already matches Mega Greninja (7/21 against 8/21, and 14/21 against 15/21 with Helping Hand) while still outspeeding all 21 threats at 191. Third, Ash leaves the team's one Mega Evolution free. Mega Greninja's real edges are 213 Speed and the Gunk Shot KO on Rillaboom, and they do not outweigh those three points.","debate":{"oa":"**Thesis:** Mega Greninja is the better Mega form of Greninja. It is at full power from turn 1 with no conditions. Ash-Greninja only reaches its best numbers after it gets a KO, and before that KO it is a plain Greninja with an item and a gamble.\n\n**1. It hits hard with no item, from the first turn.** On Jolly 2/32/32, Mega Greninja OHKOs **8/21** board threats with no item (fact sheet). The Rillaboom Gunk Shot is 80% accurate, and against Focus-Sash Whimsicott a clean OHKO is not possible. Transformed Ash-Greninja on the same physical spread OHKOs only **6/21** (fact sheet). Mega Greninja is also the only form that OHKOs the most-used threat on the board, Rillaboom at 37.18% usage: Gunk Shot does **104.3-122.7%** (sheet). Ash's Gunk Shot does **76.3-90.8%**, and even Ash's Specs Ice Beam does only **75.4-88.9%** (my engine run). Caveat: Protean gives STAB only on the first attack after each switch-in. With Protean already spent, Gunk Shot falls to 69.6-82.1% (my run), so Mega Greninja should lead with the move it needs most.\n\n**2. Ash spends most games as plain Greninja.** Before its first KO it has Speed **191** and Atk 147 / SpA 110 (my run). Holding Life Orb it OHKOs just **5/21** (my run). Choice Specs reaches **9/21** but locks it into one move. Several of those Specs KOs rely on 80%-accurate Hydro Pump (Incineroar, Arcanine-Hisui). The KOs against Indeedee-F (10/16 rolls) and Pelipper (1/16) don't reliably happen. Incineroar (26.77%) and Sneasler (34.29%) both carry Fake Out, which can delay that first KO further. Mega Greninja needs no KO to be at full power.\n\n**3. It is faster.** Mega Greninja runs **213** Speed against Ash's **202** and pre-KO Greninja's **191** (sheet). Nothing on the board outspeeds it. It also clears the Mega Manectric and Mega Lopunny tiers (205) and Mega Delphox (204), which Ash does not. Pre-KO Greninja is slower than 16 Megas, including Mega Gengar and Mega Raichu Y at 200.\n\n**4. It takes hits better.** Mega Greninja's spread is HP 149 / Def 97 / SpD 101. Ash's is 149 / 87 / 91. Mega is OHKO'd by **9/21** threats and Ash by **10/21** (sheet). The difference is Whimsicott's Moonblast: **92.6-110.1% (10/16)** on Mega against a guaranteed **102-122.1%** on Ash. Garchomp's Dragon Claw does 73.8-89.3% to Mega but up to 98% to Ash.\n\n**5. Ash's signature move is weak on this board.** Ash's 20 BP x3 Water Shuriken OHKOs **1/21** threats even with Choice Specs (my run). That one is Arcanine-Hisui, and Hydro Pump already KOs it. Against Sneasler it does 68.8-82.2%, and against Garchomp 53.5-64.9%. On top of that, Indeedee-F (21.78%) sets Psychic Surge, and Psychic Terrain blocks the priority against every grounded target.\n\n**6. With Helping Hand it becomes a nuke.** Jolly Mega Greninja plus Helping Hand OHKOs **13/21** (my run), still with no item. That list includes Incineroar (111.4-130.7%), Pelipper (111.7-131.4%, which breaks its Sash only if it is already chipped), Mega Baxcalibur (128.2-152.9%) and Mega Staraptor (102.2-121.6%).\n\n**Team role and partners:** a fast physical Mega that picks the right STAB for each target, played in a standard Fake Out plus Helping Hand support shell. Incineroar gives Fake Out and Intimidate to protect the Mega Greninja + Helping Hand turn. A Helping Hand partner turns 8 OHKOs into 13. Protect and U-turn let Mega Greninja switch out and switch back in to reset Protean. Because Mega Greninja has the stone, the other five Pokemon keep their items free. Swords Dance and Icy Wind are options when opponents lean on Trick Room teams (Farigiraf, Indeedee-F).\n\n**Pre-empting Ash's best argument: \"free item plus a second Mega, and after one KO Specs Ash OHKOs 14/21.\"** The 14/21 figure is real (my run). But it is a best case that holds only after Ash has already won an exchange as a 191-Speed, 530-BST Pokemon. At that stage it OHKOs 5/21 with Life Orb, or 9/21 with Specs while locked into one move, and it faces Fake Out from the two most-used Fake Out users. Getting the second Mega onto the team is a real benefit. Mega Greninja's answer is Helping Hand: 13/21 OHKOs from turn 1, at 213 Speed, with no KO needed. The second-Mega argument also has a cost. The Ash team needs a partner Mega to justify it, and that Mega can't help while Ash is still trying to find its first KO. Mega Greninja is at its strongest from turn 1; Ash-Greninja has to get a KO before it is.","ob":"**Thesis:** Ash-Greninja comes out ahead of Mega Greninja on both sides of the ledger. It keeps an item slot, and Choice Specs in that slot hits harder than Greninjite does. It also leaves the team's one Mega Evolution free for another Pokemon. Mega Greninja pays for its extra Speed with both.\n\n**1. Ash is simply the stronger attacker (my engine runs).** Both builds are Timid 2/0/0/32/0/32. Ash with Choice Specs has 205 SpA. Mega Greninja has 185 SpA and no item, because Greninjite fills the slot.\n- **Kingambit:** Ash's Specs Hydro Pump does 87.4-103.4% (4/16 rolls KO). Mega's does 52.7-62.8%.\n- **Indeedee-F:** Ash's Dark Pulse does 123.2-146.9%, a KO. Mega's does 75.7-89.3%.\n- **Farigiraf:** Ash's Dark Pulse does 116.2-137.8%, a KO. Mega's does 70.3-83.8%.\n- **Gholdengo:** Ash's Dark Pulse does 149.1-175.1%. Mega's does 89.9-106.5% (6/16).\n- **M-Metagross:** Ash's Dark Pulse does 126.3-148.5%. Mega's does 77.2-91.2%.\n- **Overall:** Specs Ash OHKOs 14 of the 21 board threats. Two of those 14 are Pelipper and Whimsicott, which carry Focus Sash, so the honest count is 12. The fact sheet gives Mega's best spread 6 of 21.\n\n**2. Water Shuriken becomes a +1 priority attack that can KO (my engine runs).** Ash's Water Shuriken is 20 BP and always hits 3 times.\n- **Specs, neutral field:** 251.2-300% into Arcanine-Hisui, 74.3-92.1% into Incineroar and 72.5-89.9% into M-Tyranitar.\n- **Specs, in rain:** it OHKOs Incineroar (115.8-136.6%), M-Tyranitar (113-133.3%) and Sneasler (103.2-122.3%).\n- **With Helping Hand instead of rain:** it still OHKOs Incineroar (111.4-138.1%).\n- **Mega's Water Shuriken for comparison:** 8.7-44.6% into those same targets, apart from Arcanine-Hisui.\n\nMoving first with an attack that KOs Sneasler and Incineroar is the strongest thing a Greninja can do on this board. Sneasler and Incineroar are two of the three highest-usage threats (34.29% and 26.77%).\n\n**3. The first KO needed to transform is easy to get (my engine runs, Specs Battle Bond form, 191 Speed).** Before its first KO it has plain Greninja stats. Even so, it outspeeds all 21 board threats, according to the fact sheet. It OHKOs these high-usage threats:\n- Sneasler (34.29%): Extrasensory, 178.3-211.5%.\n- Incineroar (26.77%): Hydro Pump, 104-122.8%. Hydro Pump is 80% accurate.\n- M-Salamence (23.15%): Ice Beam, 154.8-182.8%.\n- Garchomp (17.12%): Ice Beam, 162.2-192.4%.\n- Gholdengo (15.23%): Dark Pulse, 111.2-132.5%.\n- Arcanine-Hisui (9.38%): Water Shuriken, 146.5-174.4%.\n\nIt also has Surf in rain, which hits 11/16 into Incineroar as a spread move. In five of the six most common threats there is at least one clean turn-1 KO. After it transforms, the change lasts for the rest of the battle, even through switches.\n\n**4. The team keeps its Mega Evolution.** Ash is not a Mega, so the same team can Mega Evolve something else, such as M-Salamence or M-Metagross. The Mega Greninja team has spent its Mega on one attacker. The Ash team gets an attacker at Mega level plus a real Mega on top.\n\n**5. It has a full normal-item slot.** Specs is not the only choice. Life Orb keeps it free to change moves and still OHKOs Indeedee-F (107.3-127.7%) and Farigiraf (101.8-120.7%). Focus Sash guarantees it survives long enough to get its first KO.\n\n**Team role and partners.**\n- **Rain lead:** Pelipper with Drizzle next to Specs Ash. Rain Water Shuriken OHKOs Sneasler, Incineroar and M-Tyranitar before they can move. Rain Surf from Ash OHKOs Incineroar (125.7-148.5%) and Sneasler (111.5-131.8%), hitting both targets.\n- **Second attacker:** a Mega Evolution such as M-Salamence or M-Metagross.\n- **Support:** Helping Hand or Tailwind users to cover the turns before it transforms.\n\n**Pre-empting Mega Greninja's case.** My opponent's best argument is Speed and reliability: 213 Speed, a stronger form from turn 1, and slightly more bulk (97/101 defenses against Ash's 87/91).\n- **Speed:** No board threat is faster than 191, according to the fact sheet. That means the extra 22 points only matter against other Megas and in the mirror match.\n- **Bulk:** The difference changes little. The Rillaboom, Sneasler, M-Salamence, Sylveon and Archaludon hits on the fact sheet OHKO both forms.\n- **Protean:** It gives STAB to only one attack per switch-in, so Mega's coverage moves lose STAB after the first one.\n- **Reliability:** The \"no KO needed\" advantage mostly disappears when the Battle Bond form already OHKOs Sneasler, Incineroar, M-Salamence and Garchomp on turn 1.\n\nMega Greninja's extra Speed comes at the cost of its item and the team's only Mega Evolution. On this board, the Speed is worth less than either of those.","ra":"**Rebuttal (Mega Greninja)**\n\n**Concessions first.** Once Specs Ash has transformed, it hits harder than Mega Greninja's special set. I reran the Kingambit, Indeedee-F, Gholdengo and Metagross numbers and they hold up. The count of 12 honest OHKOs out of 21 is also fair. The pre-KO Specs form does OHKO Sneasler (Extrasensory, 178.3-211.5%), M-Salamence, Garchomp and Gholdengo. Keeping a free Mega is a real benefit. I also accept that Protean gives STAB only once per switch-in.\n\n**1. The rain Water Shuriken OHKOs all come from the transformed form, not from turn 1.** Ash's Shuriken OHKOs Sneasler (103.2-122.3%) and Incineroar in rain, but that is the 20 BP x3 move, which only exists after the first KO. I ran the pre-KO Specs Battle Bond form in rain:\n- Water Shuriken does **59.2-70.7%** to Sneasler and **71.3-83.2%** to Incineroar.\n- Rain Surf does only **84.7-100% (1/16)** to Sneasler.\n\nSo the \"moves first and KOs Sneasler and Incineroar\" play needs rain from Pelipper and a KO already scored. Indeedee-F's Psychic Surge also blocks the priority into both of those targets, because both are grounded. The Pelipper lead that makes the play work also takes a team slot and a lead slot. That leaves one fewer slot for the second Mega the opponent relies on in point 4.\n\n**2. \"Easy first KO\" leaves out Fake Out, accuracy and the Specs lock.**\n- The Incineroar KO is Hydro Pump, **104-122.8%**, which is **80%** accurate (engine accuracy check). Incineroar also carries Fake Out, and so does Sneasler, so the two KOs they cite are exactly the turns most likely to get Faked Out.\n- Whatever move lands the KO, Specs locks Ash into it. If Hydro Pump takes the KO, the new Ash form keeps firing Hydro Pump. To use its +1 Shuriken it has to switch out and come back in, which costs a turn.\n- The 191 Speed is barely ahead: Sneasler and M-Froslass sit at **189** and Whimsicott at **184** (engine). Any Tailwind or Speed boost puts pre-KO Greninja behind all three.\n\nMega Greninja has none of these conditions. Jolly with no item OHKOs **8/21** from turn 1. With Helping Hand it OHKOs **13/21**, including Incineroar at **111.4-130.7%**. At **213** Speed it also outspeeds the 205 Mega tier (Mega Manectric and Mega Lopunny) and Mega Delphox at 204, which Ash, at 202, does not.\n\n**3. The comparison uses the wrong Mega Greninja set.** They compare Specs Ash against Mega Greninja's special spread, which OHKOs 6/21. The fair comparison is against my physical set:\n- Gunk Shot OHKOs Rillaboom, the most-used threat at 37.18%, for **104.3-122.7%**. Ash's Specs Ice Beam does only **75.4-88.9%** there.\n- Transformed physical Ash OHKOs 6/21.\n\nOn bulk, I concede that most big hits OHKO both forms. The Whimsicott Moonblast is the difference: 10/16 rolls KO Mega, while every roll KOs Ash.\n\n**Summary.** Ash's best numbers depend on a chain of conditions: rain, no Fake Out, an 80% Hydro Pump landing, no Psychic Terrain and a Specs re-lock. Mega Greninja's numbers need none of these.\n\nMega Greninja wins because 13/21 OHKOs at 213 Speed from turn 1 are a sure thing, while Ash's 12/21 come only after it survives, lands a KO and gets back into position as a 191-Speed Greninja with no boosts.","rb":"**Rebuttal (Ash-Greninja)**\n\n**1. The Helping Hand comparison helps Ash more than it helps Mega.** My opponent's best number is \"Helping Hand Mega Greninja OHKOs 13/21 from turn 1.\" I recomputed it, and it depends on Protean.\n- **Fresh Protean:** Jolly Mega Greninja with Helping Hand reaches 16/21. Pelipper and Whimsicott carry Focus Sash, so the real count is 14.\n- **Protean spent:** after its first attack of the switch-in, it drops to 11/21, or 10 net of Sash. Mega Greninja only gets the 13-14 figure on the first turn after each switch-in. After that it has to switch out to reset Protean, which costs turns and exposes the team to extra hits.\n- **Pre-KO Greninja, same partner:** Choice Specs Battle Bond Greninja with Helping Hand OHKOs 15/21, or 13 net of Sash. That matches their headline before Ash has transformed, and it never loses STAB. It includes Kingambit (15/16), Archaludon (102.8-121.5%) and Pelipper (127.7-151.1%).\n- **After the transform:** Specs Ash with Helping Hand OHKOs 20/21, or 18 net of Sash. Only M-Baxcalibur survives, at 83.5-99%.\n\n**2. \"It spends most games as plain Greninja.\"** With Specs at 191 Speed, pre-KO Greninja still OHKOs Sneasler (236.9%+ before Helping Hand), M-Salamence, Garchomp, Gholdengo and Indeedee-F without any partner, and it outspeeds all 21 threats. Fake Out is not an argument against Ash in particular. Mega Greninja takes the same Fake Out from Incineroar and Sneasler, and without a Focus Sash option it has nothing to protect its turn.\n\n**3. Water Shuriken \"1/21.\"** On a neutral field their number is correct, and I concede it. But this is doubles, and both Ash builds I proposed run a partner.\n- **With Helping Hand:** Ash's Water Shuriken OHKOs Sneasler (103.2-122.3%) and Incineroar (111.4-138.1%).\n- **In rain:** it also OHKOs Sneasler and Incineroar, plus M-Tyranitar (113-133.3%).\n- **Garchomp:** it does not KO even with help, at 79.5-97.3%.\n\nThose are priority KOs against the second- and third-most-used threats, and neither is something Mega Greninja's Shadow Sneak can do. I also concede that Psychic Terrain from Indeedee-F shuts Water Shuriken off against grounded targets. The Ash player has to remove Indeedee-F first, and Dark Pulse OHKOs it.\n\n**Honest concessions:**\n- **Rillaboom:** Mega Greninja's Gunk Shot OHKOs Rillaboom (104.3-122.7%), and my Specs Ice Beam does not (75.4-88.9%). Gunk Shot is only 80% accurate, and Ash needs Helping Hand to KO Rillaboom (113-133.3%).\n- **Speed:** 213 against 202 is real. Only Mega Greninja passes the 204-205 Mega tier.\n- **Bulk:** Mega Greninja survives Whimsicott's Moonblast on some rolls (6 of 16), and Ash does not.\n\n**What they don't price in.** Mega Greninja's case assumes a Helping Hand partner to reach double-digit OHKOs, the same kind of support Ash uses. It also treats the item slot and the team's Mega Evolution as free. Ash keeps both: Specs or a Focus Sash on Greninja, plus a real M-Salamence or M-Metagross next to it.\n\n**Closing:** Given the same Helping Hand partner, even untransformed Ash-Greninja matches Mega Greninja's best-case OHKO count and keeps STAB on every move, and once transformed it reaches 18 net OHKOs with the team's Mega Evolution still unused. That is why Ash-Greninja wins."},"checks":[{"sideName":"Mega Greninja","side":"A","claim":"Mega Gunk Shot OHKOs Rillaboom 104.3-122.7%; 69.6-82.1% with Protean spent","holds":true,"recomputed":"104.3-122.7% KO; spent 69.6-82.1%; also 69.6-82.1% at -1 (Intimidate)"},{"sideName":"Mega Greninja","side":"A","claim":"Jolly Mega + Helping Hand OHKOs 13/21, incl. Incineroar Liquidation 111.4-130.7%","holds":true,"recomputed":"15/21 raw, 13 net of Sash; Incineroar 111.4-130.7%. Protean spent: 11/21. At -1: 8/21, and Incineroar (always Intimidate) takes 75.7-89.1%"},{"sideName":"Mega Greninja","side":"A","claim":"Pre-KO Battle Bond Greninja with Life Orb OHKOs just 5/21","holds":false,"recomputed":"Physical Life Orb 5/21, but special Life Orb 7/21 (6 net). A chose the weaker spread."},{"sideName":"Mega Greninja","side":"A","claim":"Pre-KO rain Water Shuriken: Sneasler 59.2-70.7%, Incineroar 71.3-83.2%; rain Surf 84.7-100% (1/16) on Sneasler","holds":true,"recomputed":"59.2-70.7%; 71.3-83.2%; 84.7-100% (1/16)"},{"sideName":"Mega Greninja","side":"A","claim":"Speed: Mega 213, Ash 202, pre-KO 191; Sneasler and M-Froslass 189, Whimsicott 184","holds":true,"recomputed":"213/202/191; 189/189/184"},{"sideName":"Ash-Greninja","side":"B","claim":"Specs Ash: Hydro Pump 87.4-103.4% on Kingambit; OHKOs 14/21 (12 net of Sash)","holds":false,"recomputed":"Numbers reproduce, but Choice Specs is not in Champions. Life Orb: Kingambit 75.8-90.3%; 13/21 (11 net)"},{"sideName":"Ash-Greninja","side":"B","claim":"Rain Specs Water Shuriken OHKOs Sneasler 103.2-122.3%, Incineroar 115.8-136.6%, M-Tyranitar 113-133.3%; Helping Hand Shuriken KOs Sneasler and Incineroar","holds":false,"recomputed":"Specs is illegal. Life Orb in rain: Incineroar 104-127.7% KO, Sneasler 91.7-110.8% (7/16), M-Tyranitar 15/16. Life Orb with Helping Hand: Incineroar KO, Sneasler 11/16"},{"sideName":"Ash-Greninja","side":"B","claim":"Pre-KO Specs: Sneasler Extrasensory 178.3-211.5%, Incineroar Hydro Pump 104-122.8%, 9/21 OHKOs","holds":false,"recomputed":"Specs is illegal. Life Orb: Sneasler 155.4-185.4% KO; Incineroar 90.1-107.9% (8/16, 80% accurate); 7/21 (6 net)"},{"sideName":"Ash-Greninja","side":"B","claim":"Mega + Helping Hand is 16/21 on fresh Protean, 11/21 with Protean spent","holds":true,"recomputed":"Special: 16 fresh, 13 spent. Physical: 15 fresh, 11 spent. B mixed the two spreads, but the Protean point holds."},{"sideName":"Ash-Greninja","side":"B","claim":"Life Orb Ash Dark Pulse OHKOs Indeedee-F 107.3-127.7% and Farigiraf 101.8-120.7%","holds":true,"recomputed":"107.3-127.7% KO; 101.8-120.7% KO"},{"sideName":"Ash-Greninja","side":"B","claim":"Pre-KO Greninja at 191 Speed outspeeds all 21 board threats","holds":true,"recomputed":"191 > Sneasler/M-Froslass 189. Unburden with Psychic Seed is not modelled."}],"teams":[{"legal":true,"paste":"Greninja @ Greninjite\nAbility: Protean\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Ice Beam\n- Dark Pulse\n- Hydro Pump\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 24 Atk / 10 Def\nAdamant Nature\n- Fake Out\n- Flare Blitz\n- Close Combat\n- Parting Shot\n\nWhimsicott @ Focus Sash\nAbility: Prankster\nLevel: 50\nEVs: 32 HP / 2 Def / 32 Spe\nTimid Nature\n- Tailwind\n- Helping Hand\n- Moonblast\n- Encore\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 32 HP / 14 Def / 20 SpA\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n\nTalonflame @ Sharp Beak\nAbility: Gale Wings\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Brave Bird\n- Flare Blitz\n- Tailwind\n- Taunt\n\nWeavile @ Never-Melt Ice\nAbility: Pickpocket\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Fake Out\n- Icicle Crash\n- Knock Off\n- Helping Hand\n","default_four":"Default four: Greninja and Incineroar lead, with Whimsicott and Gholdengo in the back.\n\n- Turn 1: Incineroar uses Fake Out on the biggest threat to Greninja (Sneasler, Rillaboom or Incineroar), and its Intimidate weakens physical attackers. Greninja Mega Evolves and uses its fresh-Protean STAB move: Ice Beam into Rillaboom, Hydro Pump into Incineroar, or Dark Pulse into Indeedee-F.\n- Turn 2: Incineroar either uses Parting Shot into Whimsicott (for Tailwind and Helping Hand) or Flare Blitzes Rillaboom (102.4-121.7%, a KO).\n- Swap-ins by matchup:\n  - Talonflame against Trick Room teams (it has Taunt), and against Rillaboom with M-Golisopod.\n  - Weavile against M-Salamence, Garchomp and hyper offense (Icicle Crash, plus a second Fake Out and Helping Hand).\n  - Against psyspam, lead Greninja with Whimsicott, because Psychic Terrain blocks Fake Out and Gale Wings into grounded foes.","headline":"Mega Greninja (Timid, 213 Speed) fires a fresh-Protean STAB nuke boosted by Helping Hand, with two Fake Out users, two Helping Hand users and two Tailwind setters (Prankster Whimsicott and Gale Wings Talonflame) around it. The Fire types, Gholdengo and Weavile give at least two engine-verified answers to each of the top 8 usage threats.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Greninja/greninja-mega-notes.md"},{"legal":true,"paste":"Greninja-Ash @ Life Orb\nAbility: Battle Bond\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Hydro Pump\n- Dark Pulse\n- Ice Beam\n- Water Shuriken\n\nPelipper @ Damp Rock\nAbility: Drizzle\nLevel: 50\nEVs: 32 HP / 26 Def / 8 SpA\nQuiet Nature\n- Hurricane\n- Tailwind\n- Helping Hand\n- Protect\n\nSalamence @ Salamencite\nAbility: Intimidate\nLevel: 50\nEVs: 4 HP / 32 Atk / 30 Spe\nAdamant Nature\n- Double-Edge\n- Dragon Claw\n- Tailwind\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nImpish Nature\n- Fake Out\n- Darkest Lariat\n- Parting Shot\n- Helping Hand\n\nArchaludon @ Assault Vest\nAbility: Stamina\nLevel: 50\nEVs: 32 HP / 32 SpA / 2 Spe\nModest Nature\n- Electro Shot\n- Flash Cannon\n- Draco Meteor\n- Aura Sphere\n\nTauros-Paldea-Aqua @ Black Belt\nAbility: Intimidate\nLevel: 50\nEVs: 28 HP / 32 Atk / 6 Spe\nAdamant Nature\n- Wave Crash\n- Close Combat\n- Aqua Jet\n- Protect\n","default_four":"Greninja-Ash, Pelipper, Mega Salamence and Incineroar. Default lead: Pelipper + Greninja. Turn 1, Drizzle goes up, Pelipper uses Helping Hand and Greninja takes its first KO; before its first KO, Life Orb Greninja OHKOs 17/21 board threats with rain plus Helping Hand, mostly with Hydro Pump (80% accurate). Salamence and Incineroar wait in the back to cycle Intimidate and set Tailwind. Against Fake Out leads, lead Incineroar + Greninja and bring Pelipper in on turn 2. Salamence comes whenever the opponent has Rillaboom. Tauros-Aqua comes against Kingambit, M-Tyranitar or Archaludon. Archaludon comes against Fairy teams, M-Golisopod, Milotic or Trick Room. Worst matchup: Rillaboom + Sneasler + Indeedee-F. Lead Salamence + Pelipper there and hold Greninja back.","headline":"HYPOTHETICAL rain team (Ash-Greninja is not in Champions): Pelipper's Drizzle and Helping Hand make Life Orb Battle Bond Greninja's first KO near-automatic (17/21 threats before the transform, 19/21 after it with rain plus Helping Hand). Greninja does not use the Mega, so Mega Salamence is the team's Mega and covers Rillaboom and Whimsicott. Tauros-Aqua, Archaludon and Incineroar cover Kingambit, Fairy types, Trick Room and Fake Out.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Greninja/greninja-ash-notes.md"}],"brief_a":{"game_plan":"Mega Greninja is a turn-1 nuke. Lead it next to Fake Out and Helping Hand support, and use U-turn or switching to reset Protean. Choose the special set, Timid 2 HP / 32 SpA / 32 Spe. It is immune to Intimidate, and with Helping Hand it still OHKOs 13/21 once Protean is spent. The physical set drops to 11/21 when spent and 8/21 at -1. Save the first attack of each switch-in for the move whose STAB matters most, such as Ice Beam into Rillaboom.","lean_into":["Speed: 213 outspeeds all 21 board threats, plus Mega Manectric and Mega Lopunny (205) and Mega Delphox (204)","Special with Helping Hand on fresh Protean: 16/21. Rillaboom Ice Beam 101.4-121.7%, Incineroar Hydro Pump 124.8-147%, Indeedee-F Dark Pulse 113.6-133.9%, M-Metagross Dark Pulse 115.8-136.8%","Special with Helping Hand and Protean spent: still 13/21","Physical with no item on fresh Protean: Rillaboom Gunk Shot 104.3-122.7% (80% accurate), M-Salamence Ice Punch 109.7-129%, Garchomp Ice Punch 142.7-168.6%","Slightly better bulk than Ash: Whimsicott's Moonblast KOs Mega on 10/16 rolls against every roll on Ash; Garchomp's Dragon Claw does 73.8-89.3%","Frees every other team member's item slot"],"must_cover":["Protean spent with no Helping Hand: physical drops to 3/21 OHKOs, special to 5/21","Intimidate (Incineroar, 26.77%): physical at -1 OHKOs 2/21, and Helping Hand Liquidation does only 75.7-89.1% into Incineroar","Rillaboom Wood Hammer 235.6-279.2% and Sneasler Close Combat 170.5-202.7% OHKO it","Archaludon Electro Shot 126.2-149%, M-Golisopod First Impression, Arcanine-H Head Smash, M-Baxcalibur, M-Staraptor and Sylveon also OHKO it","Walls it: Kingambit (special 53.1-63.8%), M-Golisopod (28-33.5% physical, 45.1-53.3% special), Milotic","Trick Room from Farigiraf and Indeedee-F","Megas faster than it at 216-223: Abs
