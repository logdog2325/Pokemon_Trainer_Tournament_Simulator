mbers checks out on a legal item, and they are guaranteed KOs:\n- Zap Cannon: Sneasler 137.6-161.1%, M-Salamence 104.8-124.2%.\n- Focus Blast: Incineroar 104-123.3%, Kingambit 131.9-156.5%.\n- Alluring Voice: Garchomp 100.5-118.4%.\nIt also found that A's bulk spread only has 130 Speed. B's losses were accepting A's illegal Life Orb numbers and overselling \"moves first\". Priority ignores Y's Speed (Grassy Glide + Fake Out does 98.5-117.5% to Y), and Unburden Sneasler reaches 378 Speed under Psychic Terrain.\n\nY is the better Mega: a fast support and breaker that paralyses on every hit and punches up with Helping Hand. X is a narrower anti-terrain Fake Out lead against the Rillaboom and Indeedee modes.","debate":{"oa":"**Thesis:** Mega Raichu X is the better Mega for Reg M-C doubles. It is the only Raichu form that changes the field state the most-used teams depend on, and it lives through hits that knock out Mega Y before it can act a second time.\n\n**1. It takes away the two most common terrains on turn 1.** Rillaboom is the #1 threat on the board at 37.18% usage and Indeedee-F is at 21.78%. Both are Surge setters. Mega Evolution resolves at the start of the turn, after lead switch-in abilities have fired (confirmed-facts.md, rule 2). So Electric Surge writes last, and it replaces Grassy or Psychic Terrain before anyone moves. It fires again every time X switches back in. Mega Y has no answer to terrain at all. From my own engine runs on the fact-sheet spreads:\n- Indeedee-F's Expanding Force on X falls from 48.2-56.9% in Psychic Terrain to 33.6-40.1% under X's Electric Terrain. It also stops being a spread move.\n- Rillaboom's Wood Hammer on X falls from 108.8-129.2% (a KO) in Grassy Terrain to 83.9-99.3% (0/16 KO rolls) in Electric Terrain.\n- Grassy Glide loses its priority.\n- Psychic Terrain would block X's own Fake Out against grounded targets. Removing it gives the move back.\n\n**2. It is about twice as hard to knock out.** From the fact sheet, on the same no-investment spread:\n- 5 of 21 board threats OHKO X; 11 of 21 OHKO Y.\n- Y is OHKO'd by Sneasler Close Combat (120.4-142.3%), Kingambit Kowtow Cleave (12/16), Incineroar Flare Blitz (13/16) and M-Salamence Dragon Claw (11/16).\n- X takes 78.8-92.7%, 62-74.5%, 63.5-75.2% and 62-74.5% from those same hits.\n\nX has base 95/95 defences against Y's 55/80. Raichu has only the one Mega slot, and a Mega that dies before its second action wastes it.\n\n**3. Bulk investment actually works on X.** On Adamant 32 HP / 32 Atk / 2 Def (167 HP / 117 Def), my engine runs show:\n- Garchomp's spread Earthquake still KOs (103-121.6%), so the Ground weakness stays a matter for positioning.\n- Life Orb Garchomp's spread Earthquake does 103-121.6%, so the Ground weakness needs positioning.\n- Mega Golisopod's First Impression: 75.4-89.2%.\n- Sneasler's Close Combat: 63.5-75.4%.\n- Grassy Wood Hammer: 87.4-103.6% (only 4/16 KO rolls).\n\n**4. It hits hard, and grounded targets take its terrain boost.** From the fact sheet, with no item, X OHKOs 6 of 21 board threats and Y OHKOs 5. With Life Orb, X OHKOs 9 of 21 (my engine run), including:\n- Sneasler (171.3-201.3%)\n- Gholdengo (108.9-130.2%)\n- Sylveon (112.4-134.5%)\n- Milotic, Pelipper, Arcanine-Hisui, M-Froslass and M-Staraptor\n- Whimsicott, via Iron Tail at 75% accuracy (discount that one)\n\n**5. Helping Hand turns the defensive core of the format into KOs.** My engine runs for Life Orb Volt Tackle with Helping Hand in its own terrain:\n- Kingambit: 110.1-130%, KO\n- M-Salamence: 114.5-136%, KO\n- M-Metagross: 112.9-133.3%, KO\n- Farigiraf: 130.2-154.1%, KO\n- Indeedee-F: 142.9-168.9%, KO\n\nEven at -1 from Intimidate, it still KOs Indeedee-F in 12/16 rolls and Incineroar in 7/16. The two Trick Room setters on the board can't sit in front of it.\n\n**6. It outspeeds almost all of the usage-weighted board.** At Jolly 32 Spe it has 178 Speed. That beats 17 of 21 threats, including Garchomp (169), M-Salamence (158), Gholdengo (144) and Arcanine-Hisui (156). Only Sneasler, Whimsicott, M-Froslass and M-Staraptor are faster, and it KOs Sneasler, M-Froslass and M-Staraptor outright (fact sheet).\n\n**Team role and partners.** X is a Fake Out / Volt Tackle anti-terrain lead that shuts down the Indeedee + Sneasler and Rillaboom modes.\n- Pair it with a Prankster Tailwind user such as Whimsicott. That flips the 4 faster threats and covers Trick Room.\n- Add a Levitate or Flying partner, or Intimidate Incineroar, to handle Garchomp's Earthquake.\n- A Helping Hand partner converts the point-5 numbers into KOs. X also carries Helping Hand itself if it needs to support.\n\n**Pre-empting the case for Y: \"200 Speed and a Zap Cannon that always paralyses.\"** Both are true, but they matter less than they look:\n1. Paralysis from Zap Cannon hits one target per turn. X already has Electroweb and Thunder Wave, and Tailwind (Whimsicott, Pelipper and M-Staraptor are all on the board) makes Y's raw Speed tier moot.\n2. No Guard works both ways. Every Rock Slide, Blizzard and Hurricane aimed at Y also cannot miss.\n3. Y needs Life Orb to reach 11 OHKOs, only 2 more than Life Orb X's 9. Meanwhile, 11 of 21 threats OHKO Y against 5 for X, a 6-threat gap in X's favour.\n4. Y cannot touch Psychic or Grassy Terrain. Its paralysis turn runs into an Indeedee-boosted spread Expanding Force (54.7-65.7% on Y) or a Grassy Wood Hammer (165.7-196.4%).\n\nSpeed only helps a Pokemon that survives the turn. On the M-C board, X is the form that survives.","ob":"**Thesis:** Mega Raichu Y is the better Mega Raichu for Reg M-C doubles. It is faster than all 21 threats on the board. With No Guard its moves never miss, so it can hit first and cripple what it doesn't KO. Mega Raichu X loses the Speed race to 4 of those threats and has to accept recoil and Electric Terrain to get its numbers.\n\n**1. It moves first against the whole board (fact sheet).** Timid Mega Y reaches 200 Speed. The sheet lists \"Board threats faster than it at max: none.\" Jolly Mega X tops out at 178 and loses to Sneasler 189, Whimsicott 184, M-Froslass 189 and M-Staraptor 178 (that last one is a Speed tie). Sneasler is the #2 threat at 34.29% usage. Against it, X has to take Close Combat for 78.8–92.7% before it can act. Y simply attacks first.\n\n**2. Zap Cannon never misses, so paralysis is guaranteed (fact sheet; confirmed-facts.md).** No Guard turns a 120 BP move that always paralyses into 100% accuracy. Every target it doesn't KO is paralysed at half Speed. That speed control stays after Raichu faints, and Taunt and Tailwind don't undo it. Mega X has no ability that does this. Its Electric Terrain boost lasts five turns and then it's gone.\n\n**3. It covers the Steels and Dark types that wall X (fact sheet).** Focus Blast is normally 70% accurate but always hits here:\n- Archaludon: Y OHKOs it (124.9–147%). X does 39.8–47.5%.\n- M-Tyranitar: Y OHKOs it (131.4–156.5%). X does 59.9–71.5%.\n- Kingambit: Y does 87.9–104.3% (4/16 rolls KO). X does 56.5–66.7%.\n- M-Baxcalibur: Y does 76.7–91.3%. X does 50.5–60.2% with a 75%-accurate Iron Tail.\n\nSurf also OHKOs Arcanine-Hisui (125.6–148.8%). Every Y number is at 100% accuracy with no recoil. X's damage comes mostly from Volt Tackle, which costs it a third of the damage dealt as recoil.\n\n**4. Helping Hand turns it into a KO machine against the top of the usage list (my engine run, Timid 2/0/0/32/0/32).** These are all guaranteed KOs:\n- Zap Cannon: Sneasler (34.29%) 137.6–161.1%, M-Salamence (23.15%) 104.8–124.2%, Gholdengo 114.2–135.5%, Milotic 124.8–148.5%, M-Froslass 122.4–144.9%.\n- Focus Blast: Incineroar (26.77%) 104–123.3%, Kingambit (22.44%) 131.9–156.5%, M-Baxcalibur 115–136.9%.\n- Alluring Voice: Garchomp 100.5–118.4%.\n\nIndeedee-F is close to a KO at 13/16 rolls. That covers 3 of the 5 most-used threats. X, even in its own terrain, doesn't KO Incineroar (70.3–83.7%), Kingambit or M-Salamence (58.6–69.9%).\n\n**5. It can wait to Mega Evolve at no cost (confirmed-facts.md, Worlds 2026 reports).** Base Raichu and Mega Y have exactly the same HP, Defence and Special Defence (60/55/80). Y can start as base Raichu, keep Lightning Rod to pull in the opponent's Electric attacks, and Mega Evolve on the turn it wants. It also keeps Fake Out and Helping Hand. That flexibility is why Mega Raichu Y showed up in Worlds 2026 team reports.\n\n**Best role and partners.** Play it as a fast lead that paralyses or picks off threats. Pair it with a Helping Hand partner, such as Whimsicott or anything else that offers Helping Hand plus a Ground immunity or redirection, so the Helping Hand KOs in point 4 are on the table from turn 1. Raichu covers Ground-weak Steels and slow Dark types with Focus Blast, and Zap Cannon handles speed control. That frees the partner from needing Tailwind. Y outspeeds the whole board already, so the team can spend its other slots on bulk.\n\n**Pre-empting X's best argument: bulk and raw OHKOs.** X's strongest numbers are real. In the fact sheet's calcs, 5 of 21 threats OHKO X and 11 of 21 OHKO Y. X gets 6 OHKOs with no item, against Y's 5. Two things make this matter less:\n- **X's OHKOs mostly land on frail targets.** Three of its six (Pelipper, Milotic, M-Staraptor) are ones Y also KOs or nearly KOs. Its Whimsicott OHKO relies on a 75%-accurate Iron Tail, and it hits Sneasler and M-Froslass only after they've already moved. Its biggest numbers need its own Electric Terrain and Volt Tackle recoil.\n- **Bulk matters less when you act first.** A Pokemon that moves before everything, and paralyses or KOs its target, takes fewer hits. Five of Y's 11 OHKO-ers (Garchomp, Kingambit, Incineroar, M-Salamence, Gholdengo) are threats Y KOs first with Helping Hand. Most of the rest are paralysed after one Zap Cannon. X takes less damage per hit, but it takes more hits because it moves second into Sneasler and Whimsicott.\n\nIn this metagame, moving first and never missing is worth more than extra bulk. Mega Raichu Y is the better Mega form.","ra":"**Rebuttal: Mega Raichu X**\n\n**What I concede.** Y's Speed claim is correct. At 200 Speed it outspeeds all 21 threats, and X at 178 loses to Sneasler, Whimsicott and M-Froslass and ties M-Staraptor. Y's No Guard Focus Blast also covers what X can't: it OHKOs Archaludon (124.9–147%) and M-Tyranitar (131.4–156.5%), where X does 39.8–47.5% and 59.9–71.5%. Y's Helping Hand Focus Blast on Kingambit (131.9–156.5%) checks out in my engine run. Y can also hold its Mega for free, and X can't do that without giving up its bulk.\n\n**1. \"It moves first against the whole board\" skips priority and Trick Room.** Speed does nothing against priority, and the board's top threats carry it. My engine runs:\n- Rillaboom's Grassy Glide on Y: 76.6–91.2%.\n- Kingambit's Sucker Punch on Y: 79.6–94.2%.\n- Incineroar's Fake Out on Y: 21.9–26.3%.\n\nA Fake Out plus a Grassy Glide adds up to 98.5–117.5% on Y. That is a likely KO before Y's 200 Speed matters. The same pair does about 53–64% to X, and X's Electric Surge removes Grassy Glide's priority in the first place. Indeedee-F and Farigiraf also both set Trick Room. Under Trick Room, Y's Speed becomes a drawback, and Y has nothing to push back against Psychic Terrain.\n\n**2. \"Guaranteed paralysis\" is guaranteed only for accuracy.**\n- Garchomp is **immune** to Zap Cannon (engine: IMMUNE). Garchomp is also the threat whose Earthquake does 193.4–229.9% to Y.\n- Zap Cannon hits one target per turn and takes Y's attacking slot for that turn.\n- No Guard also works for the opponent. Anything aimed at Y cannot miss.\n\n\"Most of the rest are paralysed after one Zap Cannon\" is really several turns, and Y has to survive each of them. Eleven of 21 threats OHKO Y.\n\n**3. The Helping Hand KO list needs two actions every turn.** Each number in Y's point 4 depends on:\n- the partner spending its turn on Helping Hand;\n- Y not being hit by Fake Out.\n\nAny Fake Out cancels the whole combo, and Incineroar and Sneasler are two of the five most-used threats on the board. X gets the same boost from Helping Hand. In its own terrain, Life Orb Volt Tackle with Helping Hand KOs Kingambit (110.1–130%), M-Salamence (114.5–136%), M-Metagross, Farigiraf and Indeedee-F. On M-Salamence and Kingambit, the gap Y cites comes from comparing X with no support against Y with Helping Hand. That comparison isn't fair.\n\n**4. Why bulk still decides it.**\n- Y's own sheet lists Sneasler Close Combat at 120.4–142.3% and M-Golisopod First Impression at 143.1–168.6% on Y.\n- X survives Sneasler's hit (78.8–92.7%). Unboosted, it KOs Sneasler back with Volt Tackle (131.8–154.8%).\n- Y's no-item Zap Cannon on Sneasler is only 8/16 to KO.\n\nSo Y's Speed edge against Sneasler is a coin flip, and when it fails Y is knocked out. X gives up the first hit, survives it, and wins the exchange every time.\n\nMega Raichu X still wins. Priority, Trick Room and Fake Out take away the Speed that Y's whole case rests on, while X survives that same pressure, removes Grassy Glide and Psychic Terrain on entry, and gets the same Helping Hand KOs.","rb":"**Rebuttal for Mega Raichu Y**\n\n**Concessions first.** X's terrain point is real. Electric Surge fires when X Mega Evolves, which is after the lead abilities, so it overwrites Grassy and Psychic Terrain. That takes Grassy Glide's priority away and brings grounded Fake Out back. Y cannot do this. X is also the bulkier form: 5 board threats OHKO X and 11 OHKO Y. I also concede that No Guard works both ways, so M-Froslass's Blizzard and any Rock Slide aimed at Y will not miss. Finally, I reran X's Life Orb + Helping Hand Volt Tackle numbers and they are correct: Kingambit 110.1–130%, M-Salamence 114.5–136%, Indeedee-F 142.9–168.9%.\n\n**1. Points 3 and 6 need two different Pokemon.** The bulk in point 3 comes from Adamant 32 HP / 32 Atk / 2 Def, which leaves 0 Speed. I ran that spread through the engine and it has **130 Speed**, not 178. At 130 Speed, nine board threats move before it: Sneasler, Whimsicott, M-Froslass, M-Staraptor, Garchomp, M-Salamence, Arcanine-H, M-Metagross and Gholdengo. The bulk doesn't even solve Garchomp: its Earthquake still does 103–121.6% (a KO), and X's own point 3 lists that line twice. X has to choose. It can be the 178-Speed attacker that takes 78.8–92.7% from Sneasler, or the bulky one that gets outsped by nine threats. It cannot be both. Y is at 200 Speed on every set.\n\n**2. X's Helping Hand KOs cost a lot of its own HP.** Volt Tackle recoil is one third of the damage dealt, and Life Orb takes another 10% of X's HP. My numbers here use board HP (Kingambit 207, M-Salamence 186) and X's 137 HP:\n- KOing Kingambit costs X about 82 HP, roughly 60% of its health.\n- KOing M-Salamence costs about 55%.\n\nSo X's \"survives the turn\" bulk is spent by its own attacks. Y's Helping Hand KOs (Zap Cannon on Sneasler and M-Salamence, Focus Blast on Incineroar and Kingambit) have no recoil, no item and never miss. X's plan also uses up the team's one Life Orb under Item Clause.\n\n**3. The terrain point is narrower than it looks.**\n- **Rillaboom:** Its Wood Hammer only fails to KO X because X Mega Evolved on turn 1. X then takes 83.9–99.3% plus recoil, so the matchup is survival, not a win.\n- **Indeedee-F:** Y outspeeds it and Zap Cannon paralyses it (64.4–76.3%) before Expanding Force goes off. Expanding Force does only 54.7–65.7% to Y anyway, so Y survives it.\n- **Tailwind:** X's answer to its Speed problem is a Prankster Tailwind from Whimsicott. That uses a partner's turn on something Y's Speed already gives it.\n- **Y's Life Orb:** \"Y needs Life Orb to reach 11 OHKOs\" misstates my case. My KO list uses Helping Hand and no item, which leaves the Life Orb free for a teammate.\n\nMega Raichu Y still wins because it moves first on every set, never misses and takes no recoil, while X's bulk, Speed and damage each come from a build or item that rules out one of the others."},"checks":[{"sideName":"Mega Raichu X","side":"A","claim":"Indeedee-F Expanding Force on X: 48.2-56.9% in Psychic Terrain, 33.6-40.1% in Electric Terrain","holds":true,"recomputed":"48.2-56.9% / 33.6-40.1%"},{"sideName":"Mega Raichu X","side":"A","claim":"Rillaboom Wood Hammer on X: 108.8-129.2% Grassy, 83.9-99.3% (0/16) Electric","holds":true,"recomputed":"108.8-129.2% KO / 83.9-99.3%"},{"sideName":"Mega Raichu X","side":"A","claim":"Bulk X 32/32/2 Adamant: Garchomp EQ 103-121.6%, Golisopod FI 75.4-89.2%, Sneasler CC 63.5-75.4%, Grassy WH 4/16","holds":true,"recomputed":"103-121.6% KO, 75.4-89.2%, 63.5-75.4%, 87.4-103.6% (4/16); but this spread has 130 Spe, not 178"},{"sideName":"Mega Raichu X","side":"A","claim":"Life Orb X OHKOs 9/21 (Sneasler 171.3-201.3%, Gholdengo 108.9-130.2%, Sylveon 112.4-134.5%)","holds":false,"recomputed":"Rolls reproduce, but Mega X must hold Raichunite X, so Life Orb is illegal. The count also includes Pelipper and Whimsicott, which hold Focus Sash. Legal no-item count: 6/21, or 4 without the Sash holders."},{"sideName":"Mega Raichu X","side":"A","claim":"LO + HH Volt Tackle KOs Kingambit 110.1-130%, M-Salamence 114.5-136%, M-Metagross 112.9-133.3%","holds":false,"recomputed":"Legal stone + HH: Kingambit 85-100% (1/16), M-Salamence 88.2-104.8% (5/16), M-Metagross 86.5-102.9% (2/16)"},{"sideName":"Mega Raichu X","side":"A","claim":"At -1 (Intimidate), HH Volt Tackle still KOs Indeedee-F 12/16 and Incineroar 7/16","holds":false,"recomputed":"Legal stone, -1 + HH: Indeedee-F 74-87% (0/16), Incineroar 70.3-84.2% (0/16)"},{"sideName":"Mega Raichu X","side":"A","claim":"X survives Sneasler CC (78.8-92.7%), KOs back with Volt Tackle (131.8-154.8%), wins the exchange every time","holds":false,"recomputed":"Damage holds, but X has 10-29 HP left and takes 52 HP recoil from dealing 157, so X always faints: a 1-for-1 trade"},{"sideName":"Mega Raichu X","side":"A","claim":"Priority on Y: Grassy Glide 76.6-91.2%, Sucker Punch 79.6-94.2%, Fake Out 21.9-26.3%; Garchomp immune to Zap Cannon","holds":true,"recomputed":"76.6-91.2%, 79.6-94.2%, 21.9-26.3%, IMMUNE; on X: GG 49.6-59.9%, FO 14.6-17.5%"},{"sideName":"Mega Raichu Y","side":"B","claim":"Timid Mega Y 200 Spe outspeeds all 21 board threats; Jolly X 178 loses to Sneasler/Whimsicott/M-Froslass, ties M-Staraptor","holds":true,"recomputed":"200 and 178. Caveat: Unburden Sneasler under Psychic Terrain has 378 Spe and outspeeds Y"},{"sideName":"Mega Raichu Y","side":"B","claim":"HH Zap Cannon: Sneasler 137.6-161.1%, M-Salamence 104.8-124.2%, Gholdengo 114.2-135.5%, Milotic 124.8-148.5%, M-Froslass 122.4-144.9%","holds":true,"recomputed":"Same. Against a +1 SpD (Psychic Seed) Sneasler, HH Zap is only 91.7-108.9% (8/16)"},{"sideName":"Mega Raichu Y","side":"B","claim":"HH Focus Blast Incineroar 104-123.3%, Kingambit 131.9-156.5%, M-Baxcalibur 115-136.9%; HH Alluring Voice Garchomp 100.5-118.4%; Indeedee-F 13/16","holds":true,"recomputed":"Same (Chople applied to Kingambit)"},{"sideName":"Mega Raichu Y","side":"B","claim":"A's 32 HP/32 Atk/2 Def Adamant X has 130 Speed; 9 board threats outspeed it","holds":true,"recomputed":"130 Spe; Sneasler, Whimsicott, M-Froslass, M-Staraptor, Garchomp, M-Salamence, Arcanine-H, M-Metagross, Gholdengo = 9"},{"sideName":"Mega Raichu Y","side":"B","claim":"X's LO+HH numbers are correct and its plan spends the team's Life Orb (recoil costs ~60% HP to KO Kingambit)","holds":false,"recomputed":"Life Orb is illegal on Mega X. On the legal stone X cannot KO Kingambit (1/16 with HH), so the recoil point does not apply"},{"sideName":"Mega Raichu Y","side":"B","claim":"No-item Focus Blast OHKOs Archaludon 124.9-147% and M-Tyranitar 131.4-156.5%; Surf OHKOs Arcanine-H 125.6-148.8%","holds":true,"recomputed":"Same (fact sheet); with HH 187.3-220.4%, 197.1-234.8%, 188.4-223.3%"}],"teams":[{"legal":true,"paste":"Raichu @ Raichunite X\nAbility: Lightning Rod\nLevel: 50\nEVs: 8 HP / 32 Atk / 26 Spe\nJolly Nature\n- Fake Out\n- Volt Tackle\n- Helping Hand\n- Protect\n\nSneasler @ Electric Seed\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Close Combat\n- Gunk Shot\n- Fake Out\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 2 Atk / 32 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Parting Shot\n- Taunt\n\nHydreigon @ Expert Belt\nAbility: Levitate\nLevel: 50\nEVs: 7 HP / 32 SpA / 27 Spe\nTimid Nature\n- Draco Meteor\n- Dark Pulse\n- Flamethrower\n- Tailwind\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n\nMilotic @ Leftovers\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 14 Def / 20 SpA\nModest Nature\n- Scald\n- Ice Beam\n- Icy Wind\n- Protect\n","default_four":"Default four: Raichu, Sneasler, Incineroar, Gholdengo. Default lead is Raichu + Sneasler. On turn 1 Raichu Mega Evolves, Electric Terrain goes up and Sneasler's Electric Seed fires (+1 Def, Speed 378). Raichu uses Fake Out while Sneasler attacks. On turn 2 Raichu uses Helping Hand into Close Combat (Kingambit 126-149% KO) or attacks with Volt Tackle. Incineroar and Gholdengo wait in the back: Intimidate cycling, and a switch-in that is immune to Close Combat and Fake Out. Against Garchomp or M-Salamence, bring Hydreigon and Milotic instead of Sneasler and Gholdengo, and lead Raichu + Hydreigon (Fake Out plus Tailwind or Draco Meteor). Against Trick Room, lead Raichu + Incineroar (Mega Evolve to overwrite Psychic Terrain, then Fake Out or Taunt).","headline":"Raichu Mega Evolves on turn 1 and its Electric Terrain does two jobs. It wipes out Grassy and Psychic Terrain, and it triggers Unburden Sneasler's Electric Seed (+1 Def, 378 Speed). Raichu then supports with Fake Out and Helping Hand while Sneasler, Gholdengo and Hydreigon take the KOs, and Incineroar and Milotic cover the Dragons and blunt physical attackers with Intimidate.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Raichu/raichu-mega-x-notes.md"},{"legal":true,"paste":"Raichu @ Raichunite Y\nAbility: Lightning Rod\nLevel: 50\nEVs: 2 HP / 8 Def / 32 SpA / 24 Spe\nTimid Nature\n- Zap Cannon\n- Focus Blast\n- Alluring Voice\n- Protect\n\nIndeedee-F @ Psychic Seed\nAbility: Psychic Surge\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nBold Nature\n- Follow Me\n- Helping Hand\n- Expanding Force\n- Trick Room\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 8 Atk / 26 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Darkest Lariat\n- Helping Hand\n\nArcanine-Hisui @ Life Orb\nAbility: Rock Head\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Head Smash\n- Flare Blitz\n- Extreme Speed\n- Protect\n\nHydreigon @ Focus Sash\nAbility: Levitate\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Draco Meteor\n- Dark Pulse\n- Tailwind\n- Protect\n\nMilotic @ Never-Melt Ice\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 26 Def / 8 SpA\nBold Nature\n- Ice Beam\n- Icy Wind\n- Scald\n- Protect\n","default_four":"Default four: Raichu, Indeedee-F, Arcanine-H, Incineroar.\n\nLead Raichu + Indeedee-F. On turn 1 Raichu Mega Evolves. Indeedee uses Follow Me when the opposing lead has a single-target move that OHKOs Raichu (Sneasler, Kingambit, Garchomp or Rillaboom); otherwise it uses Helping Hand. Raichu uses HH Zap Cannon, which never misses and paralyses whatever it doesn't KO, or Focus Blast on Incineroar or Kingambit. Psychic Terrain blocks Grassy Glide, Sucker Punch, First Impression and Fake Out against our grounded pair.\n\nArcanine-H and Incineroar wait in the back. Their Extreme Speed and Fake Out become usable once our Psychic Terrain ends.\n\nSwaps by matchup:\n- Dragons: Hydreigon and Milotic come in for Arcanine and Incineroar.\n- Trick Room: Hydreigon comes in for Incineroar.\n- Sand: Milotic comes in for Arcanine.","headline":"Mega Raichu Y is a 191-Speed paralysis breaker. Indeedee-F's Psychic Terrain shields it from all priority, and Indeedee adds Follow Me and Helping Hand, which make Raichu's hits guaranteed KOs (for example HH Zap Cannon on Sneasler 137.6-161.1% and HH Focus Blast on Kingambit 131.9-156.5%). Life Orb Arcanine-H, Incineroar, Hydreigon (Focus Sash, Tailwind) and Milotic (Icy Wind) give at least two verified answers to each of the top 8 threats and five speed-control layers: paralysis, Tailwind, Icy Wind, Fake Out plus Extreme Speed, and a Trick Room reverse. The worst matchup is Farigiraf Trick Room, because Armor Tail blocks both priority layers.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Raichu/raichu-mega-y-notes.md"}],"brief_a":{"game_plan":"Anti-terrain Fake Out lead holding Raichunite X (it can NOT hold a Life Orb). Jolly 2 HP/32 Atk/32 Spe (178 Spe). Moves: Fake Out / Volt Tackle / Protect plus Helping Hand, Electroweb or Brick Break. Mega Evolve on turn 1: Electric Surge overwrites Rillaboom's Grassy Terrain and Indeedee-F's Psychic Terrain before anyone moves, and it re-fires on every switch-in. That removes Grassy Glide's priority, makes Expanding Force single-target and weaker, and lets Fake Out hit grounded targets again. Do not run the 32 HP/32 Atk/2 Def bulk spread: it drops X to 130 Spe (9 threats outspeed it) and still loses to Garchomp's Earthquake (103-121.6%).","lean_into":["Terrain denial: Indeedee-F Expanding Force drops from 48.2-56.9% to 33.6-40.1% and hits one target. Rillaboom Wood Hammer drops from 108.8-129.2% (KO) to 83.9-99.3% (0/16). Grassy Glide loses priority (38-46%).","Bulk: only 5/21 board threats OHKO it. Sneasler CC 78.8-92.7%, Incineroar Flare Blitz 63.5-75.2%, M-Salamence Dragon Claw 62-74.5%, Kingambit Kowtow Cleave 62-74.5%, Sucker Punch 51.1-61.3%, Fake Out 14.6-17.5%.","No-item Volt Tackle OHKOs in its own terrain: Sneasler 131.8-154.8%, Milotic 150.5-177.7%, M-Froslass 124.5-146.9%, M-Staraptor 149.2-177.3%.","Helping Hand Volt Tackle KOs on the legal stone: Indeedee-F 110.2-129.9%, Incineroar 105.4-125.7%, Farigiraf 100-118.5%, Gholdengo 126-150.3%, Sylveon 129.9-155.4%.","178 Spe outspeeds 17 of 21 board threats, including Garchomp 169, M-Salamence 158, Arcanine-H 156 and Gholdengo 144."],"must_cover":["Garchomp Earthquake: 127-149.6% (KO), and 103-121.6% even on the bulk spread.","Other hits that OHKO or nearly OHKO X: Sylveon Hyper Beam 127-151.1%, Arcanine-H Head Smash 116.8-137.2%, M-Baxcalibur Glaive Rush 107.3-127%, M-Golisopod First Impression (priority) 9/16, Archaludon Draco Meteor 7/16.","Rillaboom KOs X before it Mega Evolves (Grassy Wood Hammer 108.8-129.2%), and X only does 36.7-43.5% back.","Walls: Archaludon 39.8-47.5%, M-Tyranitar 59.9-71.5%, Kingambit 56.5-66.7% (1/16 even with Helping Hand), M-Salamence 58.6-69.9% (5/16 with HH), M-Metagross 2/16 with HH.","Intimidate removes its Helping Hand KOs: at -1, Indeedee-F takes 74-87% and Incineroar 70.3-84.2%.","Volt Tackle recoil: KOing Sneasler after taking its Close Combat kills X (10-29 HP left, 52 HP recoil).","Faster threats: Sneasler 189 (378 under Psychic Terrain with Unburden), Whimsicott 184 and M-Froslass 189; M-Staraptor ties at 178.","Trick Room from Indeedee-F and Farigiraf."],"partner_ideas":["Special Steel/Dark breaker with Fighting or Ground coverage holding the team's Life Orb, for Archaludon, M-Tyranitar and Kingambit","Intimidate Incineroar (Fake Out + Helping Hand) to blunt Garchomp, M-Salamence and Kingambit and check Rillaboom","Levitate Helping Hand partner such as Rotom-Wash or Hydreigon, as the Ground immunity so Garchomp's Earthquake only threatens X","Prankster Whimsicott for Tailwind and Helping Hand, to flip the 4 faster threats and blunt Trick Room","Physical answer to Kingambit and M-Salamence, since X cannot KO either even with Helping Hand","Avoid partners that need Psychic or Grassy Terrain. Electric Terrain also blocks sleep for grounded allies."]},"brief_b":{"game_plan":"Lead as base Raichu (Lightning Rod, Fake Out and Helping Hand available). Its bulk is identical to the Mega's, so Mega Evolve on whichever turn you choose. Timid 2 HP/32 SpA/32 Spe (200 Spe). Moves: Zap Cannon / Focus Blast / Fake Out or Helping Hand / Protect, with Alluring Voice or Surf as flex. Zap Cannon can't miss under No Guard, so every target it doesn't KO is paralysed. A Helping Hand partner turns Y's hits into KOs across the top of the usage board. Give the Life Orb to a teammate.","lean_into":["200 Spe outspeeds all 21 board threats on standard spreads","Zap Cannon is 100% accurate, so paralysis is guaranteed (Garchomp is immune)","No-item OHKOs: Focus Blast on Archaludon 124.9-147% and M-Tyranitar 131.4-156.5%, Surf on Arcanine-H 125.6-148.8%, Zap Cannon on M-Staraptor 140.5-166.5%. Near-KOs: Focus Blast on Kingambit 87.9-104.3%, Zap Cannon on Sneasler 8/16.","Helping Hand KOs, all guaranteed: Zap Cannon on Sneasler 137.6-161.1%, M-Salamence 104.8-124.2%, Gholdengo 114.2-135.5%, Milotic 124.8-148.5% and M-Froslass 122.4-144.9%; Focus Blast on Incineroar 104-123.3%, Kingambit 131.9-156.5% and M-Baxcalibur 115-136.9%; Alluring Voice on Garchomp 100.5-118.4%. HH Zap Cannon on Indeedee-F is 13/16.","No recoil and no item needed. Holding the Mega costs nothing, and the Worlds 2026 reports ran it as support and speed control."],"must_cover":["Rillaboom: Wood Hammer 165.7-196.4% in Grassy Terrain (127.7-151.1% outside it); Grassy Glide priority 76.6-91.2%; Incineroar Fake Out + Grassy Glide 98.5-117.5%","Sneasler: Close Combat 120.4-142.3%. With an Indeedee-F partner, Psychic Seed gives Unburden (378 Spe, faster than Y) and +1 SpD: Zap Cannon falls to 61.1-72.6%, and 8/16 even with Helping Hand.","Garchomp: Earthquake 193.4-229.9%, and it is immune to Zap Cannon","Priority that ignores Y's Speed: M-Golisopod First Impression 143.1-168.6%, Kingambit Sucker Punch 79.6-94.2%, Arcanine-H Extreme Speed 64.2-75.9%","11/21 board threats OHKO it: Incineroar Flare Blitz 13/16, M-Salamence Dragon Claw 11/16, Kingambit Kowtow Cleave 12/16, Arcanine-H Head Smash 177.4-210.9%, plus Archaludon, M-Baxcalibur, M-Metagross, M-Tyranitar, M-Staraptor and Sylveon","Trick Room from Indeedee-F and Farigiraf turns its Speed against it","No Guard means opposing Blizzard, Rock Slide, Hurricane and Draco Meteor never miss it","Fake Out from Incineroar or Sneasler cancels a Helping Hand turn. Focus Sash on Pelipper and Whimsicott stops single-hit KOs."],"partner_ideas":["Indeedee-F (Follow Me + Helping Hand + Psychic Surge). Y is grounded, so Psychic Terrain blocks Grassy Glide, Sucker Punch, Fake Out, First Impression and Extreme Speed against it. Caveat: that terrain also triggers an enemy Sneasler's Psychic Seed.","Intimidate Incineroar (Fake Out + Helping Hand) to soften Rillaboom, Kingambit, Sneasler and M-Golisopod","Levitate Rotom-Wash or Hydreigon (both learn Helping Hand) as the Garchomp answer and Ground immunity","Maushold (Friend Guard + Follow Me + Helping Hand) to cover Y's frailty","Trick Room denial: Taunt, Fake Out on the setter, or Imprison","Rillaboom answer (Fire or Flying attacker, or Intimidate) and a Life Orb physical attacker for Garchomp and Rillaboom"]}},{"species":"Garchomp","slug":"garchomp","hypothetical":false,"hypoNote":"","short":" vs Z","forms":[{"label":"Mega","name":"Mega Garchomp","slug":"garchomp-mega","stone":"Garchompite"},{"label":"Mega Z","name":"Mega Garchomp Z","slug":"garchomp-mega-z","stone":"Garchompite Z"}],"winnerName":"Mega Garchomp","score_a":75,"score_b":68,"rubric_a":"30/40, 17/25, 16/20, 12/15","rubric_b":"25/40, 19/25, 14/20, 10/15","ruleLine":"Rotom Judge rules that Mega Garchomp is the better form (Mega Garchomp 75, Mega Garchomp Z 68).","opinion":"Nearly every damage roll both sides cited reproduces.\n\n**A's case.** A's Ground-STAB spread plan holds up under checking:\n- With sand and Helping Hand, one 100%-accurate Earthquake OHKOs 9 board threats.\n- Through Intimidate it still KOs 4 of them: Sneasler, Incineroar, Gholdengo and Arcanine-H.\n- Mega Garchomp survives the physical hits that OHKO or nearly OHKO Mega Z: Garchomp and M-Salamence Dragon Claw, Arcanine-H Head Smash and Sneasler Close Combat.\n\n**A's key rebuttal point also holds.** Mega Z's KOs are single-target and 85-90% accurate, and Draco Meteor cannot be repeated. At -2 SpA it does only 44.6-53.5% to Sneasler.\n\n**B's \"three slots\" argument also fails, for a reason B missed.** Hippowdon learns Helping Hand. It sets sand on entry and uses Helping Hand in the same turn, so the full sand + Helping Hand setup needs two slots, not three.\n\n**B's case.** B's real, proven points are these:\n- 223 Speed outspeeds the whole board.\n- Special attacks ignore Intimidate. At -1 in sand without Helping Hand, Mega's EQ loses the Incineroar, Gholdengo and Kingambit KOs.\n- Removing the 4x Ice weakness is real: Milotic Ice Beam 46.5-55.1% and snow Icy Wind 45.4-55.1%.\n\nBut B's headline counts are inflated by the two Focus Sash holders: 7/21 is really 5, and 14/21 is really 12. B also misread A's Incineroar number.\n\n**What neither side raised, and it cuts both ways:**\n- **Grassy Terrain from Rillaboom (37.18%, the #1 threat) halves Earthquake on grounded targets.** Sand EQ drops to 52-61.9% on Incineroar, 62.1-74% on Gholdengo and 41.5-48.8% on Kingambit. It still KOs Sneasler on 13/16 rolls. A Rillaboom + Incineroar lead is the worst matchup for Mega Garchomp.\n- **Rain from Pelipper (13.09%) halves Fire Blast.** HH Fire Blast on Gholdengo drops to 63.9-76.3%. It also overwrites sand on any later switch-in.\n- **Sneasler (34.29%) holds a Psychic Seed.** In Indeedee-F's Psychic Terrain it gets +1 SpD, which drops Mega Z's Draco Meteor to 59.9-71.3%. Unburden then doubles its Speed. That is a standard mechanic the engine does not model, and it would put Sneasler above 223.\n\n**Verdict.** On what was proven, Mega Garchomp is the stronger Mega for a team built around sand. Mega Z is a real alternative for a weather-free, fast special attacker.","conclusion":"Mega Garchomp wins narrowly, and only on a team built around sand.\n\nIts Ground-STAB spread Earthquake is 100% accurate and hits both slots. With sand and Helping Hand it OHKOs 9 of the 21 board threats. Through Intimidate it still KOs Sneasler, Incineroar, Gholdengo and Arcanine-H. It also takes the physical Dragon Claws that OHKO Mega Z (Garchomp 110.8-131.9%, M-Salamence 100.5-120% on Z).\n\nB's objection that the plan needs three slots fails because Hippowdon learns Helping Hand. It sets sand and uses Helping Hand on the same turn.\n\nMega Z's proven strengths are real:\n- At 223 Speed it outspeeds the whole board.\n- Its special attacks ignore Intimidate.\n- It is only 2x Ice-weak, not 4x.\n\nBut its headline counts are inflated by the two Focus Sash holders: 7/21 is really 5, and 14/21 is really 12. Every KO is single-target at 85-90% accuracy, and Draco Meteor at -2 SpA does only 44.6-53.5% to Sneasler.\n\nNeither side raised the biggest threat to Mega's plan. Rillaboom (37.18% usage) sets Grassy Terrain, which halves Earthquake: sand EQ on Incineroar drops to 52-61.9%. Mega Z's matching weakness is rain, which halves Fire Blast.","debate":{"oa":"**Opening argument: Mega Garchomp (Garchompite, Sand Force, Dragon/Ground)**\n\n**Thesis:** Mega Garchomp keeps Ground STAB and 170 base Attack, and adds Sand Force. That makes it the stronger spread-damage Mega of the two against the Reg M-C board. It is also the bulkier one physically. Mega Garchomp Z trades that power away for Speed it mostly doesn't need.\n\n**1. Ground STAB is the whole point of the Garchomp line, and Mega Z loses it.**\nMega Z is pure Dragon, so its Earthquake has no STAB. From my engine run (Jolly 2/32/32, spread already x0.75):\n- Against Incineroar (26.77% usage), Mega's Earthquake does 80.2-95% and Mega Z's does 44.6-52.5%.\n- Against Gholdengo, Mega does 95.9-113.6% (11/16 rolls KO). Mega Z does 53.3-62.7%.\n- Against Kingambit, Mega does 63.8-75.4% and Mega Z does 34.8-41.5%.\n\nMega Garchomp hits both opposing slots for nearly double the damage every turn.\n\n**2. In sand, Mega's Earthquake OHKOs part of the board while hitting both targets (fact sheet plus engine).**\nSand Force is x1.3. The fact sheet shows Mega's OHKOs going from 6/21 to 9/21 in sand, with no item. Spread Earthquake in sand OHKOs:\n- Sneasler (34.29%): 195.5-229.9%\n- Incineroar: 104.5-123.8%\n- Gholdengo: 124.9-147.9%\n- Arcanine-Hisui: 281.4-335.5%\n\nIt also has KO rolls on Archaludon (7/16) and M-Froslass (8/16). Mega Z's best no-item physical result on Sneasler is Scale Shot at 84.1-101.9% (1/16), and that move is only 90% accurate.\n\n**3. With Helping Hand, one sand Earthquake KOs half the board (engine).**\nSpread Earthquake in sand with Helping Hand OHKOs 9 of 21 board threats:\n- Sneasler, Incineroar, Gholdengo, Arcanine-Hisui\n- Kingambit: 124.2-146.9%\n- Archaludon: 135.9-161.3%\n- M-Froslass: 136.7-163.3%\n- M-Metagross: 125.7-150.3%\n- M-Tyranitar: 101.9-120.8%\n\nIt also KOs Sylveon on 13/16 rolls. That is a turn-one double knockout against the top 5 threats by usage, while Mega Z is limited to single-target attacks.\n\n**4. Physical bulk against the metagame's physical attackers (fact sheet).**\nBoth forms have 185 HP, but Mega has 135 Def to Mega Z's 105.\n- Sneasler Close Combat: 50.3-58.9% on Mega, 63.8-75.1% on Mega Z.\n- Arcanine-Hisui Head Smash: 36.8-43.8% on Mega. On Mega Z it is 94.6-111.9%, KO on 11/16 rolls.\n- Kingambit Kowtow Cleave: 39.5-47% on Mega, 50.8-60.5% on Mega Z.\n- M-Salamence Dragon Claw: 78.9-94.1% on Mega. It OHKOs Mega Z (100.5-120%).\n- Opposing Garchomp's Dragon Claw KOs Mega on only 3/16 rolls. It KOs Mega Z outright (110.8-131.9%).\n\nMega Garchomp survives the physical Dragon attacks that OHKO Mega Z.\n\n**5. Mega's Speed is already enough (fact sheet).**\nJolly 32 gives 158. That outspeeds 15 of the 21 board threats, including Gholdengo (144), Arcanine-Hisui (156), Archaludon (123) and M-Metagross (148). Of the six that are faster, Mega already OHKOs Sneasler, Whimsicott and M-Froslass. Only M-Salamence ties.\n\n**Team role and partners**\n- **Main partner: Hippowdon (Sand Stream, base form).** It sets sand again every time it switches in, and it doesn't use up the one Mega slot. It also takes our Earthquake well: a Sand Force spread Earthquake does only 30.7-36.3% to Impish 32/32 Hippowdon (engine).\n- **Alternative: Tyranitar, paired with Protect.** Its 61 base Speed makes it the slower setter against a Pelipper lead. Because the last weather write wins, sand stays up.\n- **Other slots:** Flying or Levitate teammates such as Corviknight or Rotom-Wash, plus a Helping Hand user, round out a sand spread-damage core.\n\n**Pre-empting Mega Z's best argument: 223 Speed and no 4x Ice weakness**\n- Mega Z outspeeds all 21 board threats. But Mega already outspeeds 15, and it OHKOs three of the six threats that are faster.\n- Mega Z's extra Speed buys only single-target hits. Its best no-item OHKO count is 7/21 with Timid Special, and that relies on Draco Meteor (90% accurate) and Fire Blast (85% accurate). Mega reaches 9/21 in sand with 100%-accurate Earthquake hitting both targets.\n- Removing the 4x Ice weakness saves Mega Z less than it seems. M-Baxcalibur still OHKOs it (173-205.4%). Blizzard still KOs it on 8/16 rolls. Meanwhile, the physical Dragon hits from Garchomp and M-Salamence now OHKO it.\n- Speed that lets you move first with half the damage, on a body that gets OHKO'd in return, loses to the form that wins the damage race across both slots.\n\nSource note: all numbers are from factsheets/Garchomp.md, or from my runs of rotom-judge/engine.js on Jolly P(2,32,0,0,0,32).","ob":"**Thesis:** Mega Garchomp Z is the stronger Reg M-C Mega. It is faster than all 21 threats on the board, it hits hardest where it needs to (special attacks that Intimidate cannot weaken), and it drops Mega Garchomp's 4x Ice weakness. The one thing Mega Garchomp has is Sand Force, and that only works if a teammate spends a slot setting sand.\n\n**1. It moves first against the whole board (fact sheet).**\n- Timid 32 Spe gives Mega Z 223 Speed.\n- The sheet lists no Mega faster than that. Only Absol Mega Z and Lucario Mega Z tie it.\n- Mega Garchomp tops out at 158. Six board threats outspeed it: Sneasler (34.29% usage), Whimsicott (184), M-Froslass (189), M-Staraptor (178), Garchomp (169), and M-Salamence, which ties at 158.\n- Sneasler is the second most-used threat on the board and is faster than Mega Garchomp. Mega Z outspeeds it and has a 7/16 chance to OHKO it with Draco Meteor (90.4-107%).\n\n**2. The strongest item-free offence on the sheet (fact sheet).**\n- Both Megas hold their stone, so neither gets Life Orb or Choice Band. Base stats decide the damage.\n- Timid Mega Z (193 SpA) OHKOs **7/21** with no item and no weather.\n- Mega Garchomp OHKOs **6/21** on a neutral field.\n- Mega Z's OHKOs include M-Salamence (138.7-164.5%), M-Baxcalibur (114.6-135%), M-Golisopod (Fire Blast 125.3-149.5%), Whimsicott (124.1-146%), Pelipper and Arcanine-Hisui.\n- Mega Garchomp only OHKOs M-Salamence on 12/16 rolls and M-Baxcalibur on 6/16.\n\n**3. Helping Hand doubles its KO list (my engine run, Timid 2/0/0/32/0/32).**\nWith Helping Hand, Mega Z OHKOs **14/21**. That adds:\n- Sneasler: Draco Meteor 135.7-160.5%\n- Archaludon: Draco Meteor 137.6-162.4%\n- Gholdengo: Fire Blast 129.6-152.7%\n- M-Froslass: Fire Blast 136.7-161.2%\n- Kingambit: Fire Blast 110.1-130.4%\n- M-Metagross: Fire Blast 108.8-128.1%\n- M-Staraptor: Draco Meteor 104.3-123.8%\n\nBecause it outspeeds everything, the boosted hit lands before the target can act. Accuracy caveat (E.accuracy): Draco Meteor is 90% and Fire Blast is 85%.\n\n**4. Intimidate does not weaken it.**\n- Incineroar is the third most-used threat (26.77%) and brings Intimidate.\n- Every Mega Garchomp number above drops at -1 Atk. Mega Z's special attacks are unaffected.\n\n**5. Better defensive typing where it counts (fact sheet).**\n- Mega Garchomp is 4x Ice-weak. Mega Z is only 2x.\n- Milotic Ice Beam: 84.3-101.6% into Mega Garchomp, 46.5-55.1% into Mega Z.\n- M-Froslass Blizzard: 164.3-196.8% (guaranteed KO) into Mega Garchomp, 90.8-108.1% (8/16) into Mega Z.\n- Mega Z also resists Water, Electric and Grass.\n- Levitate makes it immune to Ground. Opposing Earthquakes miss it, and it can partner a spread-Earthquake teammate without taking damage.\n- Rillaboom (the most-used threat, 37.18%) hits Mega Z with Wood Hammer for only 44.3-51.9%. It does 68.1-80.5% to Mega Garchomp.\n\n**Team role and partners**\nMega Z is a fast special cleaner that needs no weather. The best supports are:\n- **Helping Hand user.** This turns 7 OHKOs into 14, as above.\n- **Spread-Earthquake partner.** Its Earthquakes hit both opponents and pass harmlessly over Levitate.\n- **Sun setter.** Sun boosts Fire Blast. In sun, Mega Z OHKOs Gholdengo (129-152.7%), Kingambit (110.1-130.4%) and M-Metagross (107.6-127.5%) without Helping Hand.\n\nIt needs no Tailwind or Trick Room. Mega Garchomp needs those just to move before Sneasler.\n\n**Pre-empting the opponent: \"Sand Force and more bulk\"**\n- **Sand costs a slot.** Mega Garchomp's best sheet number is 9/21 OHKOs in sand, but Garchomp does not set sand itself. A Tyranitar or Hippowdon has to lead with it. Weather set on entry resolves in Speed order and the last one written wins, so opposing Pelipper rain can overwrite that sand.\n- **The out-of-sand advantage is small.** On a neutral field, Mega Garchomp's physical count is 6/21 against Mega Z's 7/21 special. Intimidate from the board's third most-used threat erodes its numbers further.\n- **The bulk gap is one threat.** Mega Garchomp is OHKO'd by 4/21 and Mega Z by 5/21. Mega Garchomp's list includes guaranteed KOs from M-Froslass Blizzard and M-Baxcalibur because of its 4x Ice weakness, and M-Froslass outspeeds it. That is survival Mega Garchomp often does not get to use when the attacker moves first.\n\nA Mega that outspeeds the whole board, OHKOs 14/21 with one Helping Hand, and ignores Intimidate is the better Mega.","ra":"**Rebuttal: Mega Garchomp**\n\n**Concessions first.** Mega Z's Speed claim is correct. At 223 it outspeeds all 21 threats, and Mega Garchomp at 158 does not outspeed Sneasler, Whimsicott, M-Froslass, M-Staraptor or Garchomp, and only ties M-Salamence. Their Helping Hand numbers are also correct. I reran all seven additions and every one matches: Sneasler Draco Meteor 135.7-160.5%, Kingambit Fire Blast 110.1-130.4%, and so on. Intimidate also hurts me. At -1 in sand, spread Earthquake drops to 69.3-82.2% on Incineroar, 82.8-98.2% on Gholdengo and 54.1-65.2% on Kingambit, so none of those three is KO'd anymore. The 4x Ice weakness is real too.\n\n**1. \"14/21 with Helping Hand\" means one KO per turn, with moves that miss.** Every one of those 14 KOs hits a single target. Seven of the Helping Hand additions use Fire Blast (85% accurate by E.accuracy) or Draco Meteor (90%). Draco Meteor also drops Special Attack by 2 after use, so Mega Z cannot repeat those KOs on the next turn. My Helping Hand sand Earthquake (100% accurate, x0.75 spread already applied) hits both slots. Even at -1 from Intimidate it still KOs Sneasler (193.6-231.2%), Incineroar (104.5-123.8%), Gholdengo (124.9-147.9%) and Arcanine-Hisui (285.5-340.1%). The opponent's own position depends on a Helping Hand partner, so \"sand costs a slot\" applies to them as well. The difference is that Hippowdon sets sand on entry and still gets to act. A Helping Hand partner gives up its whole turn.\n\n**2. The Sneasler Speed argument overstates the result.** Without Helping Hand, Mega Z's answer to Sneasler is Draco Meteor at 90.4-107%. That KOs on 7/16 rolls and is 90% accurate, so it KOs about 39% of the time. Mega Garchomp moves second but OHKOs Sneasler with Earthquake in every condition: 150.3-177.1% on a neutral field and 129.3-154.1% in sand at -1. Sneasler's Close Combat does only 50.3-58.9% to Mega Garchomp, so Mega Garchomp survives the hit and KOs back. It takes 63.8-75.1% on Mega Z.\n\n**3. \"The bulk gap is one threat\" hides which threats they are.** Mega Z is OHKO'd by Garchomp's Dragon Claw (110.8-131.9%) and by M-Salamence's Dragon Claw (100.5-120%). Those two threats have 17.12% and 23.15% usage. Against Mega Garchomp, M-Salamence does 78.9-94.1% and Garchomp KOs on only 3/16 rolls. Arcanine-Hisui's Head Smash KOs Mega Z on 11/16 rolls and does 36.8-43.8% to Mega Garchomp. Losing the Ice weakness does not save Mega Z much either: M-Baxcalibur still OHKOs it (173-205.4%) and M-Froslass's Blizzard still KOs it on 8/16 rolls. It trades Ice KOs for Dragon KOs from more common attackers.\n\n**4. Their sun point costs them the same slot.** Fire Blast KOs on Gholdengo, Kingambit and M-Metagross need either sun or Helping Hand. Either way a partner is used up, the same cost they hold against sand.\n\n**Conclusion:** Mega Z is faster, but its best turn is one 85-90% single-target KO that it cannot repeat. Mega Garchomp's best turn is a 100% accurate spread KO that still takes out four threats through Intimidate, and it survives the common Dragon attacks that OHKO Mega Z, so Mega Garchomp wins the damage race across both slots.","rb":"**Rebuttal for Mega Garchomp Z**\n\n**1. The sand numbers leave out Intimidate from the third most-used threat.**\nMy opponent lists a sand Earthquake OHKO on Incineroar (104.5-123.8%). But Incineroar brings Intimidate every time it enters, so Mega Garchomp is normally attacking at -1. I ran spread Earthquake in sand at -1 on the engine:\n- Incineroar: 69.3-82.2%, no KO.\n- Gholdengo: 82.8-98.2%, no KO.\n- Kingambit: 54.1-65.2%.\n\nThe \"104.5-123.8%\" figure on Incineroar is actually their **Helping Hand + sand + -1** result. Put another way, one Intimidate cancels the whole Helping Hand boost. Their 9/21 Helping Hand list assumes Incineroar never touched Garchomp's Attack. Mega Z's Draco Meteor and Fire Blast are special, so Intimidate does not change any of them.\n\n**2. The spread plan needs three of the four slots, and the partners take the hit.**\nThe Helping Hand + sand board needs three things at once:\n- a sand setter,\n- a Helping Hand user,\n- Garchomp itself.\n\nHippowdon cannot set sand and use Helping Hand in the same turn it has to be on the field. Also, Earthquake hits your own partner. Their own number shows it: 30.7-36.3% to Impish Hippowdon every turn. Rain can overwrite the sand too. Mega Z needs one partner (a Helping Hand user) to reach 14/21, with no weather involved. Levitate means a spread-Earthquake partner can fire freely next to it.\n\n**3. Moving first decides who survives.**\nMy opponent says Mega \"already OHKOs three of the six faster threats.\" Moving second makes that meaningless:\n- **M-Froslass (189):** it moves first, and its Blizzard is a guaranteed KO on Mega (164.3-196.8%).\n- **Whimsicott:** it sets Tailwind first.\n- **Garchomp (169):** its Dragon Claw has a 3/16 chance to KO Mega first.\n\nThey cite physical Dragon hits that OHKO Mega Z:\n- M-Salamence Dragon Claw: 100.5-120%.\n- Garchomp Dragon Claw: 110.8-131.9%.\n\nThese only matter if the attacker moves first, and neither does:\n- **Garchomp (169):** Mega Z (223) moves first and KOs it with Draco Meteor (145.9-173%, fact sheet).\n- **M-Salamence (158):** Mega Z moves first and KOs it with Draco Meteor (138.7-164.5%).\n\nMega's own matchup with M-Salamence is a 158 Speed tie.\n\n**Concessions.**\n- Mega Garchomp has more physical bulk. Its 135 Def against Mega Z's 105 is real. Sneasler Close Combat (63.8-75.1%) and Arcanine-Hisui Head Smash (11/16 KO) hurt Mega Z more.\n- Mega's Ground-STAB Earthquake does about twice Mega Z's physical Earthquake. That is true, but it doesn't matter much, because Mega Z runs special moves and would not click Earthquake.\n- M-Baxcalibur still OHKOs Mega Z.\n- My KO moves are less reliable than a 100%-accurate Earthquake: Draco Meteor is 90% accurate and Fire Blast is 85%.\n\n**Mega Garchomp Z still wins.** It gets its damage from a single Helping Hand partner, Intimidate can't weaken it, and it moves before every threat on the board. Mega Garchomp's best numbers need sand, a Helping Hand user and no Intimidate all at once, and it often doesn't get to use its extra bulk because faster attackers hit it first."},"checks":[{"sideName":"Mega Garchomp","side":"A","claim":"EQ Mega vs Mega Z: Incineroar 80.2-95 vs 44.6-52.5, Gholdengo 95.9-113.6 (11/16) vs 53.3-62.7, Kingambit 63.8-75.4 vs 34.8-41.5","holds":true,"recomputed":"identical on all six rolls"},{"sideName":"Mega Garchomp","side":"A","claim":"Sand EQ (no HH) OHKOs Sneasler 195.5-229.9, Incineroar 104.5-123.8, Gholdengo 124.9-147.9, Arcanine-H 281.4-335.5","holds":true,"recomputed":"identical; Archaludon 90.6-107.7 (7/16), M-Froslass 91.2-108.8 (8/16)"},{"sideName":"Mega Garchomp","side":"A","claim":"HH+sand EQ OHKOs 9/21 (Kingambit 124.2-146.9, Archaludon 135.9-161.3, M-Froslass 136.7-163.3, M-Metagross 125.7-150.3, M-Tyranitar 101.9-120.8, ...)","holds":true,"recomputed":"identical; Sylveon 97.2-115.8 (13/16)"},{"sideName":"Mega Garchomp","side":"A","claim":"HH+sand EQ at -1 still KOs Sneasler 193.6-231.2, Incineroar 104.5-123.8, Gholdengo 124.9-147.9, Arcanine-H 285.5-340.1","holds":true,"recomputed":"identical; Kingambit falls to 81.2-98.1"},{"sideName":"Mega Garchomp","side":"A","claim":"EQ OHKOs Sneasler in every condition (150.3-177.1 neutral, 129.3-154.1 sand -1)","holds":true,"recomputed":"figures match; -1 no sand 99.4-118.5 (15/16); sand+Grassy 97.5-115.3 (13/16)"},{"sideName":"Mega Garchomp","side":"A","claim":"Mega already OHKOs three of the six faster threats (Sneasler, Whimsicott, M-Froslass)","holds":false,"recomputed":"Whimsicott holds Focus Sash; M-Froslass is KO'd only by 75%-accurate Iron Tail, or sand EQ 8/16; only Sneasler is reliable"},{"sideName":"Mega Garchomp","side":"A","claim":"Mega OHKOs go from 6/21 to 9/21 in sand","holds":false,"recomputed":"counts include Focus Sash Pelipper and Whimsicott: really 4 to 7"},{"sideName":"Mega Garchomp","side":"A","claim":"Defense: Garchomp Dragon Claw 3/16 on Mega vs 110.8-131.9 KO on Z; M-Salamence Dragon Claw 78.9-94.1 vs 100.5-120; Arcanine Head Smash 36.8-43.8 vs 94.6-111.9 (11/16)","holds":true,"recomputed":"identical"},{"sideName":"Mega Garchomp Z","side":"B","claim":"Timid 223 Speed outspeeds all 21 threats","holds":true,"recomputed":"223; Sneasler Unburden + Psychic Seed not modeled"},{"sideName":"Mega Garchomp Z","side":"B","claim":"Timid Mega Z OHKOs 7/21 vs Mega 6/21 no item","holds":false,"recomputed":"both include Focus Sash Pelipper and Whimsicott: really 5 vs 4"},{"sideName":"Mega Garchomp Z","side":"B","claim":"HH additions: Sneasler DM 135.7-160.5, Archaludon DM 137.6-162.4, Gholdengo FB 129.6-152.7, M-Froslass FB 136.7-161.2, Kingambit FB 110.1-130.4, M-Metagross FB 108.8-128.1, M-Staraptor DM 104.3-123.8","holds":true,"recomputed":"identical"},{"sideName":"Mega Garchomp Z","side":"B","claim":"OHKOs 14/21 with one Helping Hand","holds":false,"recomputed":"12/21 excluding the two Focus Sash holders; all single-target, and all but Earth Power are 85-90% accurate"},{"sideName":"Mega Garchomp Z","side":"B","claim":"Sun Fire Blast OHKOs Gholdengo 129-152.7, Kingambit 110.1-130.4, M-Metagross 107.6-127.5","holds":true,"recomputed":"identical; in rain, HH Fire Blast on Gholdengo is 63.9-76.3"},{"sideName":"Mega Garchomp Z","side":"B","claim":"Sand EQ at -1: Incineroar 69.3-82.2, Gholdengo 82.8-98.2, Kingambit 54.1-65.2","holds":true,"recomputed":"identical"},{"sideName":"Mega Garchomp Z","side":"B","claim":"A's 104.5-123.8% Incineroar figure is actually HH+sand+-1","holds":false,"recomputed":"sand, no HH, no Intimidate gives exactly 104.5-123.8; HH+sand+-1 matches only because 1.5 x 2/3 = 1"},{"sideName":"Mega Garchomp Z","side":"B","claim":"Mega Z moves first and KOs Garchomp DM 145.9-173, M-Salamence 138.7-164.5","holds":true,"recomputed":"identical; after -2 SpA, DM does Garchomp 72.4-87.6 and Sneasler 44.6-53.5"}],"teams":[{"legal":true,"paste":"Garchomp @ Garchompite\nAbility: Rough Skin\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Earthquake\n- Rock Slide\n- Dragon Claw\n- Protect\n\nHippowdon @ Smooth Rock\nAbility: Sand Stream\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nImpish Nature\n- Helping Hand\n- Protect\n- High Horsepower\n- Slack Off\n\nRotom-Heat @ Sitrus Berry\nAbility: Levitate\nLevel: 50\nEVs: 32 HP / 2 Def / 32 SpA\nModest Nature\n- Overheat\n- Electroweb\n- Will-O-Wisp\n- Protect\n\nAerodactyl @ Focus Sash\nAbility: Unnerve\nLevel: 50\nEVs: 31 HP / 12 Atk / 23 Spe\nJolly Nature\n- Tailwind\n- Rock Slide\n- Dual Wingbeat\n- Wide Guard\n\nTyranitar @ Chople Berry\nAbility: Sand Stream\nLevel: 50\nEVs: 32 HP / 12 Def / 22 SpA\nModest Nature\n- Ice Beam\n- Dark Pulse\n- Icy Wind\n- Protect\n\nCorviknight @ Rocky Helmet\nAbility: Mirror Armor\nLevel: 50\nEVs: 32 HP / 2 Atk / 32 Def\nImpish Nature\n- Brave Bird\n- Iron Head\n- Tailwind\n- Taunt\n","default_four":"Default four: Garchomp, Hippowdon, Rotom-Heat, Aerodactyl.\n\nLead Hippowdon + Garchomp. Turn 1, Garchomp Mega Evolves and uses Earthquake. Hippowdon uses Helping Hand when the foes include a Helping Hand + sand KO target, accepting 46-54.4% from our own Earthquake. It uses Protect when sand Earthquake alone is enough (Sneasler, Incineroar, Gholdengo, Arcanine-H).\n\nIn the back: Aerodactyl (190 Speed Tailwind, Wide Guard) and Rotom-Heat (Overheat).\n\nMatchup swaps:\n- Rillaboom teams: lead Rotom-Heat + Corviknight, and bring Garchomp in only after Rillaboom is gone.\n- Dragon teams: bring Tyranitar; its Ice Beam OHKOs M-Salamence and Garchomp.\n- Trick Room teams: bring Corviknight (Taunt) and Tyranitar.","headline":"Hippowdon sets sand and uses Helping Hand on the same turn, so Jolly Mega Garchomp's Sand Force Earthquake gets double KOs from turn one. The partners are immune to Earthquake (Rotom-Heat, Aerodactyl, Corviknight), Tyranitar is a backup sand setter with Ice Beam for Dragons, and speed control comes from two Tailwind setters plus Electroweb and Icy Wind.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Garchomp/garchomp-mega-notes.md"},{"legal":true,"paste":"Garchomp @ Garchompite Z\nAbility: Rough Skin\nLevel: 50\nEVs: 30 HP / 32 SpA / 4 Spe\nTimid Nature\n- Draco Meteor\n- Fire Blast\n- Earth Power\n- Protect\n\nWhimsicott @ Focus Sash\nAbility: Prankster\nLevel: 50\nEVs: 32 HP / 2 Def / 32 Spe\nTimid Nature\n- Tailwind\n- Helping Hand\n- Sunny Day\n- Moonblast\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 4 Atk / 30 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Darkest Lariat\n- Parting Shot\n\nSneasler @ White Herb\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Fake Out\n- Close Combat\n- Dire Claw\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 27 HP / 17 Def / 22 SpA\nModest Nature\n- Make It Rain\n- Psyshock\n- Shadow Ball\n- Protect\n\nMilotic @ Leftovers\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 14 Def / 20 SpA\nModest Nature\n- Scald\n- Ice Beam\n- Icy Wind\n- Protect","default_four":"Default: lead Garchomp-Mega Z + Whimsicott, with Incineroar and Gholdengo in the back. On turn 1, Whimsicott uses Prankster Helping Hand (or Tailwind) while Garchomp Mega Evolves and KOs a threat.\n\nOther leads:\n- vs Rillaboom/Incineroar: lead Incineroar + Garchomp, back Whimsicott (Sunny Day) + Sneasler.\n- vs rain: lead Whimsicott (Sunny Day) + Garchomp, back Gholdengo + Milotic.\n- vs Sneasler/psyspam: lead Gholdengo + Garchomp, back Whimsicott + Incineroar.\n- vs Trick Room: lead Sneasler + Garchomp, back Incineroar + Milotic.\n- vs Dragons: Garchomp + Milotic, with Incineroar for Intimidate.","headline":"Timid 30 HP/32 SpA/4 Spe Mega Garchomp Z moves at 192, above the board's fastest (Sneasler and M-Froslass at 189), and takes one special KO per turn. Whimsicott's Prankster Helping Hand, plus Prankster Sunny Day (which also beats rain), turns Draco Meteor and Fire Blast into OHKOs. Incineroar, Sneasler, Gholdengo and Milotic give every top-8 threat two answers, and the speed control is Tailwind, Icy Wind, two Fake Outs and Unburden. The weakest matchup is Indeedee-F Psychic Terrain Trick Room: the terrain blocks both Fake Outs on Indeedee, and Follow Me soaks the single-target nukes.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Garchomp/garchomp-mega-z-notes.md"}],"brief_a":{"game_plan":"Sand spread core. Hippowdon (Sand Stream + Helping Hand, 60-67 Speed, slower than Pelipper so it wins a simultaneous lead) sets sand and uses Helping Hand on the same turn. Jolly 2/32/32 Mega Garchomp spams 100%-accurate Earthquake for turn-one double KOs. Surround it with Levitate/Flying partners so EQ is free. If Hippowdon stays in, Protect it or accept 46-54.4% self-damage from HH sand EQ.","lean_into":["Ground-STAB spread EQ, neutral field: Incineroar 80.2-95%, Gholdengo 95.9-113.6% (11/16), Kingambit 63.8-75.4% (about 2x Mega Z)","Sand EQ with no HH OHKOs Sneasler 195.5-229.9%, Incineroar 104.5-123.8%, Gholdengo 124.9-147.9% and Arcanine-H 281.4-335.5%","HH + sand EQ OHKOs 9/21 across both slots: adds Kingambit 124.2-146.9%, Archaludon 135.9-161.3%, M-Froslass 136.7-163.3%, M-Metagross 125.7-150.3%, M-Tyranitar 101.9-120.8%","At -1 from Intimidate, HH + sand EQ still KOs Sneasler, Incineroar, Gholdengo and Arcanine-H","Physical bulk (185 HP / 135 Def): Sneasler CC 50.3-58.9%, Arcanine-H Head Smash 36.8-43.8%, Kowtow Cleave 39.5-47%, M-Salamence Dragon Claw 78.9-94.1%, Garchomp LO Dragon Claw only 3/16","158 Speed outspeeds 15/21, including Gholdengo 144, M-Metagross 148 and Arcanine-H 156; survives Sneasler's CC and OHKOs it back","Electric immunity"],"must_cover":["Ice, 4x weak: M-Froslass Blizzard 164.3-196.8% KO and it moves first at 189; snow Icy Wind 84.3-99.5%; M-Baxcalibur Icicle Crash 190.3-227%; Milotic Ice Beam 84.3-101.6%","Intimidate (Incineroar 26.77%): at -1 in sand without HH, EQ does Incineroar 69.3-82.2%, Gholdengo 82.8-98.2%, Kingambit 54.1-65.2%","Grassy Terrain (Rillaboom 37.18%) halves EQ: sand EQ does Incineroar 52-61.9%, Gholdengo 62.1-74%, Kingambit 41.5-48.8%; Rillaboom takes only 39.6-47.3% from HH sand EQ, and its Wood Hammer does 68.1-80.5%","Pelipper's rain overwrites sand when it switches in later","Faster threats: Sneasler 189, Whimsicott 184 (Focus Sash, Tailwind), M-Froslass 189, M-Staraptor 178, Garchomp 169, M-Salamence speed tie at 158","Special OHKOs: Sylveon Hyper Beam 188.1-224.3%, Archaludon Draco Meteor 134.1-158.9%","Focus Sash on Pelipper and Whimsicott","EQ hits grounded allies: base Tyranitar takes 90.3-106.8% from sand EQ"],"partner_ideas":["Hippowdon (Sand Stream + Helping Hand, Smooth Rock) as the core sand setter and Helping Hand user","Base Tyranitar (Sand Stream, 81 Spe) as a second setter; it must Protect on EQ turns. Not M-Tyranitar: one Mega only","Rotom-Wash (Levitate, Helping Hand): EQ-immune; checks Pelipper and M-Froslass","Ungrounded speed control: Dragonite (Tailwind, Icy Wind, Helping Hand, Multiscale) or Corviknight (Tailwind; resists Ice and Fairy)","Rillaboom / Grassy Terrain answer: a Flying or Fire attacker such as Talonflame (Gale Wings, Tailwind) or Charizard","Ice and Fairy answer: a Steel or Fire partner (Corviknight, Scizor), or Incineroar for Fake Out and Intimidate, which must Protect on EQ turns"]},"brief_b":{"game_plan":"Timid 2/32 SpA/32 Spe Mega Z (223 Speed, faster than the whole board) runs Draco Meteor, Fire Blast, Earth Power and Protect as a weatherless special attacker. A Helping Hand partner, or sun for Fire Blast, turns each turn into one guaranteed KO before the target moves. Levitate lets a grounded spread-EQ partner fire freely beside it. Protect or switch after Draco Meteor to reset the -2 SpA drop.","lean_into":["223 Speed outspeeds all 21 threats; no Mega is faster (Absol Mega Z and Lucario Mega Z tie)","No-item OHKOs: Draco Meteor on Garchomp 145.9-173%, M-Salamence 138.7-164.5%, M-Baxcalibur 114.6-135%; Fire Blast on M-Golisopod 125.3-149.5%; Earth Power on Arcanine-H 153.5-181.4% (100% accurate)","With Helping Hand, 12 real OHKOs: Sneasler DM 135.7-160.5%, Archaludon DM 137.6-162.4%, Gholdengo FB 129.6-152.7%, M-Froslass FB 136.7-161.2%, Kingambit FB 110.1-130.4%, M-Metagross FB 108.8-128.1%, M-Staraptor DM 104.3-123.8%","Sun Fire Blast without HH: Gholdengo 129-152.7%, Kingambit 110.1-130.4%, M-Metagross 107.6-127.5%","Special attacks ignore Incineroar's Intimidate","Only 2x Ice-weak: Milotic Ice Beam 46.5-55.1%, snow Icy Wind 45.4-55.1%, M-Froslass Blizzard 8/16","Resists Water, Electric, Grass and Fire (Rillaboom Wood Hammer 44.3-51.9%); Levitate gives Ground immunity"],"must_cover":["Accuracy: Draco Meteor 90%, Fire Blast 85%","After Draco Meteor's -2 SpA, it does Sneasler 44.6-53.5% and Garchomp 72.4-87.6%","Physical hits that OHKO or nearly OHKO it once it loses Speed (Tailwind from Whimsicott or M-Staraptor, Trick Room from Indeedee-F or Farigiraf): Garchomp Dragon Claw 110.8-131.9%, M-Salamence Dragon Claw 100.5-120%, Arcanine-H Head Smash 94.6-111.9% (11/16), M-Baxcalibur Glaive Rush 173-205.4%, Sneasler CC 63.8-75.1%","Special hits: Sylveon Hyper Voice 93.5-111.9% (9/16) and Hyper Beam 207-244.3%; Archaludon Draco Meteor 145.9-173%; Whimsicott Moonblast 72.4-85.4%","Rain (Pelipper 13.09%) halves Fire Blast: HH Fire Blast on Gholdengo is 63.9-76.3%","Sneasler's Psychic Seed in Psychic Terrain gives +1 SpD (Draco Meteor 59.9-71.3%), and Unburden doubles its Speed past 223","Targets it barely dents: Incineroar DM 50.5-59.9%, Milotic DM 41.6-49%, Sylveon FB 30.5-36.2%; unboosted Kingambit FB 73.4-87% and M-Metagross FB 72.5-85.4%","Focus Sash on Pelipper and Whimsicott"],"partner_ideas":["Helping Hand user: Indeedee-F (Helping Hand, Fake Out, Follow Me; beware that its Psychic Terrain triggers an opposing Sneasler's Psychic Seed) or Maushold (Friend Guard, Helping Hand)","Sun setter for Fire Blast: Torkoal (Drought, Helping Hand, 36 Spe, wins a simultaneous lead against Pelipper) or Ninetales (Drought)","Grounded spread-EQ partner that Levitate ignores: Excadrill or Hippowdon (no second Garchomp, Species Clause)","Incineroar for Fake Out and Intimidate against the physical Dragons and Arcanine-H","Steel answer to Fairy and Ice: Gholdengo, Kingambit or Archaludon","Anti-speed-control: Protect plus Taunt, Fake Out or fast KOs on Tailwind and Trick Room setters (Whimsicott, Indeedee-F, Farigiraf)"]}},{"species":"Absol","slug":"absol","hypothetical":false,"hypoNote":"","short":" vs Z","forms":[{"label":"Mega","name":"Mega Absol","slug":"absol-mega","stone":"Absolite"},{"label":"Mega Z","name":"Mega Absol Z","slug":"absol-mega-z","stone":"Absolite Z"}],"winnerName":"Mega Absol Z","score_a":62,"score_b":81,"rubric_a":"20/40, 18/25, 15/20, 9/15","rubric_b":"33/40, 21/25, 16/20, 11/15","ruleLine":"Rotom Judge rules that Mega Absol Z is the better form (Mega Absol 62, Mega Absol Z 81).","opinion":"Nearly every damage roll both sides cited reproduces. The debate turned on which premises survived.\n\nA's opening depended on a Life Orb that Mega Absol cannot hold alongside Absolite. Without it, the claim that A OHKOs more of the board reverses. On legal items, with 100%-accurate moves only and not counting Focus Sash holders, Z OHKOs **7** threats (96.58% usage) and Mega OHKOs **5** (58.90%).\n\nA's defensive argument was built on the fact sheet's Jolly spread. A then recommended a Hasty spread that drops Defense to 72. On that spread, Mega is OHKO'd by **16 of 21** threats, not 13. Kingambit's Iron Head, Incineroar's Flare Blitz and Garchomp's Dragon Claw all become KOs.\n\nA's Magic Bounce case also shrinks. Under the standard Prankster-vs-Dark rule, Whimsicott's Encore already fails against both Absol forms. That leaves Incineroar's Parting Shot as the main status move that Magic Bounce uniquely stops on this board.\n\nA's real, proven points are these:\n- 100%-accurate Ice Beam is the only answer to Garchomp and M-Salamence that either form has. It lands 12/16 and 8/16 unboosted and guarantees both KOs with Helping Hand.\n- Intimidate takes a third off every one of Z's kills. B's Helping Hand and +1 KOs all fall short at -1.\n\nB's case held up. Z moves first against the whole board. It is immune to both Fake Out users and to the Fighting moves of Sneasler (34.29%) and M-Staraptor. It is OHKO'd by 12 of 21 threats against Mega's 13-16, and it OHKOs more of the board without needing an item.\n\nB's weak points:\n- The Pelipper Helping Hand KO ignores Focus Sash.\n- Phantom Force is two-turn, so it is not a real lead KO.\n- B conceded, correctly, that Intimidate hurts Z.\n\nZ is the better form. Its main liabilities are Intimidate, Fairy hits and Garchomp/Salamence, and each can be fixed with a partner. Mega's Fighting/Bug weakness and low Defense cannot be fixed that way.","conclusion":"Mega Absol Z wins. Mega Absol's opening count of 16 OHKOs depended on a Life Orb, which it cannot hold alongside Absolite. Without it, and counting only 100%-accurate moves and non-Sash targets, Z OHKOs 7 threats (96.58% usage) and Mega OHKOs 5 (58.90%). Mega's defensive claims also used the Jolly spread, but A recommended Hasty. On Hasty (72 Def), Mega is OHKO'd by 16 of 21 threats, not 13, and Kingambit's Iron Head KOs 8/16. Z's 223 Speed outspeeds every board threat, and it is immune to both top Fake Out users and to Sneasler's and Staraptor's Close Combat. Mega's proven strength is 100%-accurate Ice Beam on Garchomp (12/16) and M-Salamence (8/16), which becomes a guaranteed KO on both with Helping Hand. Intimidate also knocks every one of Z's Helping Hand and +1 KOs under 100%. That makes Mega a niche Dragon-killer. Z is the better lead sweeper, as long as a partner handles Intimidate and Fairy.","debate":{"oa":"**Thesis:** Mega Absol can run a mixed set, and its SpA 115 lets it hit things Mega Absol Z can't touch. With a Life Orb it OHKOs more of the Reg M-C board, it bounces the board's status moves back, and the Fighting immunity people credit to Z saves it from only one extra OHKO.\n\n**1. It OHKOs more of the board: 16 of 21 against Z's 13 (my engine runs).** I ran both at Life Orb and took the best move for each target from the full movepool. Mega was Hasty with P(0,32,0,2,0,32), giving Atk 202, SpA 137 and Spe 183. It OHKOs 16 of 21 threats, and those 16 add up to 255.66 in usage. Mega Z was Jolly with P(2,32,0,0,0,32). It OHKOs 13 of 21, adding up to 196.90. The threats only Mega kills are M-Salamence, Garchomp and M-Golisopod, which together hold 58.76% usage:\n- Ice Beam into M-Salamence: 120.4-142.5% KO\n- Ice Beam into Garchomp: 126.5-149.2% KO\n- Fire Blast into M-Golisopod: 117-140.1% KO\n\nZ's best hits into the same targets are Stone Edge on Salamence for 55.9-66.7% with 80% accuracy, Play Rough on Garchomp for 65.9-77.8%, and Night Slash on Golisopod for 34.6-41.8% (fact sheet, no item).\n\n**2. Ice Beam never misses, and Z needs inaccurate moves just to chip (engine plus fact sheet).** With no item at all, Hasty Mega's Ice Beam does 97.3-114.6% to Garchomp (12/16 rolls) and 92.5-109.7% to M-Salamence (8/16), both at 100% accuracy. Z's answers are Stone Edge (80%) and Play Rough (90%), and neither reaches 80% damage. Salamence is 23.15% usage and Garchomp is 17.12%, so these are two of the top eight threats.\n\n**3. Its special attacks ignore Intimidate.** Incineroar is the #3 threat at 26.77%. Z's Sharpness damage is entirely physical, so every Intimidate cuts it by a third. Mega's Ice Beam, Fire Blast and Thunderbolt don't lose anything. Thunderbolt does 151.8-181% to Pelipper even on the physical-leaning spread with no item. Z needs Stone Edge there, which does 94.9-112.4% (11/16) with 80% accuracy.\n\n**4. Magic Bounce sends back status moves the board actually runs (fact sheet and engine BOARD sets).** Incineroar's Parting Shot (26.77%) and Whimsicott's Encore (12.65%) come back at the user. That means Whimsicott can't Encore-lock Mega Absol's Protect or Swords Dance, and Incineroar's Parting Shot debuff lands on Incineroar. Z has Sharpness, which does nothing against either move.\n\n**5. The typing difference is smaller than it looks.** Mega resists Dark and Ghost. Its worst hit from Kingambit (22.44%) is Iron Head at 82.4-97.2%, so it never OHKOs. Against Z, Kowtow Cleave does 86.6-102.1% (3/16) and Sucker Punch is only neutral. Farigiraf's Foul Play does 15.5-18.3% to Mega and 31.7-37.3% to Z (fact sheet).\n\n**Team role and partners.** Mega Absol's job is a fast mixed breaker. At 183 Speed it already outspeeds 18 of 21 board threats, including Garchomp (169), M-Salamence (158) and Arcanine-Hisui (156). Its best partner is Indeedee-F:\n- Follow Me pulls Sneasler's Close Combat away from Absol.\n- Psychic Terrain blocks priority against grounded targets. Absol is grounded, so Fake Out from Incineroar and Sneasler and Sucker Punch from Kingambit can't touch it.\n- Absol is Dark, so it takes nothing from a Psychic-type hit, and it can go on hitting with Ice Beam and Foul Play.\n\nFoul Play uses the target's own Attack, and it OHKOs Gholdengo, Farigiraf, Indeedee-F and M-Froslass on this set. That leaves Absol's Attack points free, so a set of Ice Beam, Foul Play, Close Combat or Fire Blast, and Protect covers 16 KOs.\n\n**Pre-empting Z's strongest points.**\n- **Speed (223, nothing on the board is faster).** Speed isn't damage. Mega at 183 is already slower than only Sneasler, Whimsicott and M-Froslass. Whimsicott's Tailwind has Prankster priority, so it goes up before either Absol moves. Sneasler with a Psychic Seed gets Unburden and outspeeds both forms. On raw kills, Z's extra Speed still leaves Salamence and Garchomp alive, and Mega kills them.\n- **Fighting immunity.** The fact sheet shows Z is OHKO'd by 12 of 21 threats and Mega by 13 of 21. The one difference is Sneasler. M-Golisopod's First Impression still KOs Z at 128.9-152.1%, and M-Staraptor's Brave Bird still KOs Z at 101.4-119%. Paying for one fewer OHKO taken with three fewer OHKOs dealt, on the three most-used Dragon and Bug attackers, is a bad trade.\n\n**Caveats.**\n- Both KO counts are the best move from each form's full movepool, not a real four-move set.\n- The count includes Megahorn (85% accuracy) and Iron Tail (75%) for both forms. Mega's Pelipper KO in that count used Thunder (70%), and Thunderbolt covers it at 100% on the no-item spread.\n- The Hasty nature lowers Mega's Defense from 80 to 72.","ob":"**Thesis:** In Reg M-C doubles, Mega Absol Z has the edge in the three things that decide games: Speed, immunities and damage output. It is faster than every threat on the board and cannot be touched by Fake Out or Fighting moves. Sharpness also makes it hit harder than Mega Absol's Foul Play and Night Slash.\n\n**1. It is the fastest Pokemon on the board (fact sheet).** Jolly with 32 Speed gives Z 223 Speed. Every one of the 21 threats is slower. No Mega is faster; it only ties Garchomp Mega Z and Lucario Mega Z. Mega Absol reaches only 183, so it moves after Sneasler (189, 34.29% usage), Whimsicott (184, 12.65%) and M-Froslass (189). Twenty Megas are faster than it. Sneasler is the second most-used threat on the board, and only Z moves before it.\n\n**2. Its typing removes the board's best answers to Absol (fact sheet).** Dark/Ghost is weak only to Fairy and is immune to Normal, Fighting and Psychic. Mega Absol is weak to Fighting, Bug and Fairy. The effect on the two defense tables:\n- **Sneasler:** its best hit, Close Combat, does 216.9-257.7% to Mega Absol. Its best hit on Z is Dire Claw at 35.9-43%.\n- **M-Golisopod:** First Impression does 258.5-304.2% to Mega Absol and 128.9-152.1% to Z. Z still loses that exchange, but Z moves first.\n- **M-Staraptor:** Close Combat does 202.8-238% to Mega Absol. Its best hit on Z is Brave Bird.\n- **Fake Out:** Rillaboom (37.18%) and Incineroar (26.77%) are the two most common Fake Out users. Fake Out is a Normal move, so it cannot hit Z at all. Mega Absol has no answer to Fake Out.\n\nZ is OHKO'd by 12 of the 21 threats; Mega Absol is OHKO'd by 13.\n\n**3. Sharpness gives Z more reliable OHKOs (fact sheet and engine).** With no item, Z OHKOs 8 of 21 threats; Mega Absol OHKOs 6. Night Slash comparisons from the sheet:\n- Farigiraf: 98.6-117.6% (14/16 rolls) from Z, against 87.4-103.6% (4/16) from Mega Absol's Foul Play.\n- Indeedee-F: a guaranteed KO from Z, against 11/16 rolls for Mega Absol.\n- M-Metagross: 86-101.8% from Z, against 74.9-88.9% for Mega Absol.\n\nEngine run: Night Slash from Z does 58.4-68.6% to Garchomp, and from Mega Absol 37.8-45.4%. Both forms must hold their Mega Stone, so neither can use Life Orb or Choice Band. Z's advantage comes from Sharpness and needs no item.\n\n**4. X-Scissor beats Rillaboom, the most-used threat (engine).** X-Scissor from Z does 81.2-95.7% to Rillaboom. That equals the sheet's Megahorn number, but with 100% accuracy instead of 85%. With Helping Hand it does 121.7-143.5%, a guaranteed OHKO. Mega Absol has no slicing boost; its best Helping Hand Night Slash on Rillaboom does 52.2-61.4%.\n\n**5. Helping Hand and Swords Dance extend its OHKO list (engine).**\n- **Helping Hand Night Slash:** Pelipper 110.2-132.8% KO, M-Metagross 128.7-152.6% KO.\n- **Helping Hand Phantom Force:** Gholdengo 161.5-191.7% KO.\n- **After one Swords Dance (+2), Night Slash OHKOs:** Rillaboom 104.8-124.6%, Garchomp 115.1-136.2%, Milotic 111.4-131.2%.\n\nZ can set up behind Protect. Fake Out cannot touch it, and Sneasler cannot hurt it much, so the two usual ways to stop a set-up turn do not work.\n\n**6. Ghost STAB gives it a second attacking type (engine).** Phantom Force does 107.7-127.8% to Gholdengo, a KO without help. Shadow Sneak gives Z Ghost-type priority on top of the Dark-type Sucker Punch.\n\n**Team role and partners.** Z works as the team's fast lead sweeper. The moveset is Night Slash / X-Scissor or Phantom Force / Sucker Punch / Protect. Suggested partners:\n- **A Helping Hand user.** This turns the Rillaboom, Pelipper and Metagross 2HKOs into OHKOs.\n- **A Fairy-resistant partner such as Kingambit or a Steel-type,** to cover Z's one weakness.\n- **Fake Out and Intimidate support** is still useful for the partner's own safety. Z does not need it itself.\n\nZ does not want Tailwind, because it is already the fastest Pokemon on the board. That frees the partner's move slot for Helping Hand or a second attack.\n\n**Pre-empting Magic Bounce.** Mega Absol's best argument is Magic Bounce, which reflects Taunt, Encore, Parting Shot, Will-O-Wisp and Thunder Wave. That matters less than it looks, for three reasons:\n- It does nothing against damaging moves. Mega Absol is still OHKO'd by 13 of 21 threats, including a 216.9-257.7% Close Combat from Sneasler.\n- It does not stop Fake Out, the board's most common way to disrupt a Pokemon, and Z is immune to Fake Out.\n- Whimsicott (184 Speed) is the main source of disrupting status moves on this board. Z outspeeds it; Mega Absol does not. So Z can attack before Whimsicott does anything that isn't a Prankster move. In practice, Z avoids more disruption through its typing and Speed than Mega Absol does through reflecting status moves.","ra":"**Rebuttal: Mega Absol**\n\n**The concession first.** Z's advocate is right that Absol has to hold its Mega Stone. My Life Orb numbers (16 KOs against 13) are invalid, and I withdraw them. I reran it with no item: Hasty Mega P(0,32,0,2,0,32) OHKOs **7 of 21** (14/16 rolls or better), and Z OHKOs **8**. Z's raw no-item KO count is higher. Z is also truly immune to Fake Out, and Magic Bounce does not reflect Fake Out.\n\n**1. The Helping Hand and Swords Dance KOs assume nobody interferes.** Both need a free turn or a partner's slot, and Incineroar (26.77%) is right there. Z's damage is entirely physical, so Intimidate works on it. I recomputed:\n- **Helping Hand X-Scissor on Rillaboom at -1:** 82.6-97.6%. That is no longer a KO.\n- **Helping Hand Night Slash on Pelipper at -1:** 75.2-90.5%. Not a KO either.\n- **Swords Dance then Intimidate (+1) Night Slash on Garchomp:** 85.9-102.2%, only 2 of 16 rolls. Their \"+2 OHKOs Garchomp\" needs Swords Dance with no Intimidate at all.\n\nHelping Hand on my side does more. **Helping Hand Ice Beam** does 145.9-171.9% to Garchomp and 138.7-164.5% to M-Salamence. Both are guaranteed KOs at 100% accuracy, and Intimidate does not reduce either one.\n\n**2. The KO counts are close, but Mega's KOs are on the board's biggest threats.** Without an item, Ice Beam still hits Garchomp for 97.3-114.6% (12 of 16 rolls) and M-Salamence for 92.5-109.7% (8 of 16). Those two hold 40.27% of usage between them. Z's best hits on them are Play Rough at 65.9-77.8% (90% accuracy) and Stone Edge at 55.9-66.7% (80% accuracy), which are not close to a KO. Thunderbolt kills Pelipper at 151.8-181%. Z's answer there is Stone Edge at 94.9-112.4% (11 of 16) with 80% accuracy. Z's extra kills come from Sharpness, and Sharpness only boosts physical slicing moves. That means Intimidate lowers all of those kills and none of mine.\n\n**3. Several things in Z's opening are overstated.**\n- **Phantom Force** takes two turns. In doubles, Gholdengo simply Protects or switches out.\n- **Speed does not make up for Z's defense.** Z is still OHKO'd by 12 of 21 threats. That includes M-Golisopod's First Impression at 128.9-152.1%, which is priority, so outspeeding it does nothing. It also includes Whimsicott's Moonblast at 122.5-145.1%.\n- **Z is not safe from Dark and Ghost hits.** Kingambit's Kowtow Cleave does 86.6-102.1% to Z, and Farigiraf's Foul Play does double what it does to Mega (31.7-37.3% against 15.5-18.3%). Mega resists both types.\n- **Fake Out has a fix.** Mega Absol's Fake Out problem is solved by the Indeedee-F partner I alread
