<title>Rotom Judge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a hearing record. One case at a time, transcript read top to bottom, a player docked to the bottom edge.
   Speaker colour is information: A and B are the two advocates, the judge is amber (Rotom's own colour). */
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#14161b; --muted:#5b6270; --line:#d8dbe2;
  --a:#0b6f80; --a-soft:rgba(11,111,128,.10);
  --b:#a3244f; --b-soft:rgba(163,36,79,.09);
  --judge:#b86e00; --judge-soft:rgba(184,110,0,.12);
  --ok:#2b8a3e; --ok-soft:rgba(43,138,62,.12); --bad:#c92a2a; --bad-soft:rgba(201,42,42,.10);
  --live:rgba(184,110,0,.18);
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1116; --surface:#171a21; --ink:#e8eaf0; --muted:#9aa1ae; --line:#2a2f3a;
  --a:#46c4d6; --a-soft:rgba(70,196,214,.12); --b:#f0729c; --b-soft:rgba(240,114,156,.11);
  --judge:#f5b638; --judge-soft:rgba(245,182,56,.13); --ok:#69db7c; --ok-soft:rgba(105,219,124,.13);
  --bad:#ff8787; --bad-soft:rgba(255,135,135,.12); --live:rgba(245,182,56,.20); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#171a21; --ink:#e8eaf0; --muted:#9aa1ae; --line:#2a2f3a;
  --a:#46c4d6; --a-soft:rgba(70,196,214,.12); --b:#f0729c; --b-soft:rgba(240,114,156,.11);
  --judge:#f5b638; --judge-soft:rgba(245,182,56,.13); --ok:#69db7c; --ok-soft:rgba(105,219,124,.13);
  --bad:#ff8787; --bad-soft:rgba(255,135,135,.12); --live:rgba(245,182,56,.20); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:16px/1.62 var(--body); margin:0}
.wrap{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:0 140px}
h1,h2,h3,h4{font-family:var(--display); font-weight:800; text-wrap:balance; line-height:1.12; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--judge); outline-offset:2px}

/* top bar: case picker */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line)}
.top-in{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; flex-direction:column; gap:8px}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.brand b{font-family:var(--display); font-weight:800; font-size:18px; letter-spacing:.01em}
.brand span{font:12px/1.3 var(--ui); color:var(--muted)}
.cases{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.cases::-webkit-scrollbar{display:none}
.case-chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:6px 12px; font:600 13px/1 var(--ui); white-space:nowrap}
.case-chip[aria-current="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.case-chip small{font-weight:400; opacity:.7; margin-left:4px}

/* case header */
.hero{padding-block:22px 6px; display:flex; flex-direction:column; gap:12px}
.eyebrow{font:600 11px/1.3 var(--ui); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tag{border:1px solid currentColor; border-radius:4px; padding:1px 6px; letter-spacing:.06em}
.tag.hypo{color:var(--judge)}
.hero h1{font-size:clamp(26px,7vw,40px)}
.hero h1 .vs{font-family:var(--body); font-style:italic; font-weight:400; color:var(--muted); font-size:.62em; padding-inline:.18em}
.ruling{font:600 15px/1.4 var(--ui)}
.ruling .who{color:var(--judge)}
.scores{display:grid; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px}
.score-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:baseline}
.score-row .nm{font:600 14px/1.3 var(--ui); min-width:0}
.score-row .num{font:800 20px/1 var(--display); font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1; height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:4px}
.score-row .rub{grid-column:1/-1; font:12px/1.4 var(--mono); color:var(--muted)}
.rub-key{font:12px/1.4 var(--ui); color:var(--muted)}
.listen-all{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:10px;
  padding:14px; background:var(--judge); color:#1a1200; font:700 16px/1 var(--ui)}
.listen-all svg{width:18px; height:18px}

/* transcript */
.sec{padding-block:26px 4px; display:flex; flex-direction:column; gap:10px; scroll-margin-top:110px}
.sec-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.who-chip{display:inline-flex; align-items:center; gap:8px; font:700 12px/1 var(--ui); letter-spacing:.07em; text-transform:uppercase; padding:6px 10px; border-radius:6px}
.who-chip.a{background:var(--a-soft); color:var(--a)} .who-chip.b{background:var(--b-soft); color:var(--b)} .who-chip.j{background:var(--judge-soft); color:var(--judge)}
.sec h2{font-size:22px}
.play-sec{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px 6px 10px; font:600 13px/1 var(--ui); display:inline-flex; gap:6px; align-items:center}
.play-sec svg{width:12px; height:12px}
.txt{border-left:3px solid var(--line); padding-left:14px; min-width:0}
.txt.a{border-color:var(--a)} .txt.b{border-color:var(--b)} .txt.j{border-color:var(--judge)}
.txt p, .txt li{margin:0 0 .75em}
.txt ul, .txt ol{margin:0 0 .75em; padding-left:1.2em}
.txt h4{font-size:17px; margin:1em 0 .4em}
.txt strong{font-weight:600}
.txt code{font:14px var(--mono)}
.blk{border-radius:4px; transition:background-color .2s}
.blk.speaking{background:var(--live); box-shadow:0 0 0 4px var(--live)}
.tbl{overflow-x:auto; margin:0 0 .9em}
.tbl table{border-collapse:collapse; font:13px/1.4 var(--ui); min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
.conclusion{background:var(--judge-soft); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:8px}
.conclusion h3{font-size:18px; color:var(--judge)}
.conclusion .rule{font:700 16px/1.4 var(--ui)}

/* fact checks */
.checks{display:flex; flex-direction:column; gap:8px}
.check{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px}
.pill{font:700 11px/1 var(--ui); letter-spacing:.05em; text-transform:uppercase; border-radius:4px; padding:4px 6px; align-self:start}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.bad{background:var(--bad-soft); color:var(--bad)}
.check .cl{font:14px/1.45 var(--ui)} .check .cl b{font-weight:600}
.check .rc{grid-column:2; font:12px/1.4 var(--mono); color:var(--muted)}

/* teams */
.team{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0}
.team h3{font-size:19px}
.team .hl{font:15px/1.5 var(--body)}
.team .b4{font:13px/1.5 var(--ui); color:var(--muted)}
.legal{font:700 11px/1 var(--ui); letter-spacing:.05em; text-transform:uppercase}
.legal.ok{color:var(--ok)} .legal.bad{color:var(--bad)}
.paste{position:relative; min-width:0}
.paste pre{margin:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font:12.5px/1.5 var(--mono); overflow-x:auto; max-height:320px}
.copy{position:absolute; top:8px; right:8px; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:5px 9px; font:600 12px/1 var(--ui)}
details.brief{font:14px/1.5 var(--ui)} details.brief summary{cursor:pointer; color:var(--muted); font-weight:600}
details.brief ul{padding-left:1.2em; margin:.4em 0}

/* player */
.player{position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.player-in{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:8px}
.now{font:600 12px/1.3 var(--ui); color:var(--muted); display:flex; gap:8px; align-items:center; min-width:0}
.now .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--judge)}
.now .dot.a{background:var(--a)} .now .dot.b{background:var(--b)}
.now span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ctrls{display:flex; align-items:center; gap:8px}
.ctrls button{border:1px solid var(--line); background:var(--bg); border-radius:8px; height:40px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding-inline:10px; font:600 13px/1 var(--ui)}
.ctrls button svg{width:16px; height:16px}
.ctrls .main{background:var(--judge); color:#1a1200; border-color:var(--judge); min-width:64px}
.ctrls .grow{flex:1}
.voices{border-top:1px solid var(--line); padding-top:10px; display:grid; gap:8px}
.voices label{display:grid; grid-template-columns:90px minmax(0,1fr); gap:8px; align-items:center; font:600 13px/1.2 var(--ui)}
.voices select{width:100%; min-width:0; font:13px var(--ui); padding:6px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
.voices p{margin:0; font:12px/1.4 var(--ui); color:var(--muted)}
.nospeech{font:13px/1.4 var(--ui); color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .blk{transition:none} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Rotom Judge</b><span id="caseCount"></span></div>
    <nav class="cases" id="cases" aria-label="Choose a debate"></nav>
  </div>
</header>

<main class="wrap" id="case"></main>

<div class="player" id="player" hidden>
  <div class="player-in">
    <div class="now"><i class="dot" id="nowDot"></i><span id="nowTxt">Ready</span></div>

      <button id="prev" aria-label="Previous section"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>

      <label for="vJ">Judge<select id="vJ"></select></label>

</div>

<script type="application/json" id="data">{"cases":[{"species":"Charizard","slug":"charizard","hypothetical":false,"hypoNote":"","short":"X vs Y","forms":[{"label":"Mega X","name":"Mega Charizard X","slug":"charizard-mega-x","stone":"Charizardite X"},{"label":"Mega Y","name":"Mega Charizard Y","slug":"charizard-mega-y","stone":"Charizardite Y"}],"winnerName":"Mega Charizard Y","score_a":77,"score_b":89,"rubric_a":"32/40, 19/25, 15/20, 11/15","rubric_b":"37/40, 22/25, 17/20, 13/15","ruleLine":"Rotom Judge rules that Mega Charizard Y is the better form (Mega Charizard X 77, Mega Charizard Y 89).","opinion":"Mega Y wins because it hits hard from the turn it Mega Evolves, and Mega X has to survive a setup turn first.\n\n**Turn-one damage.** On the set A recommended (Flare Blitz / Dragon Claw), Mega X at +0 OHKOs only **9/21** threats. Mega Y in its own sun OHKOs **13/21** using only moves at 90% accuracy or better. Even without Overheat, Y still OHKOs **10/21** with 100%-accurate Weather Ball, Solar Beam, Scorching Sands and Air Slash, with no drops. Neither advocate found that last figure; it removes most of A's objection to Overheat's Special Attack drop.\n\n**Mega X's case.** A's numbers are real. Once X has used Dragon Dance, it reaches Speed 250 and OHKOs 15/21 with no item. It also takes Rock Slide at 37-59% from Sneasler and Garchomp, where the same attacks KO Y.\n\n**Garchomp stops X's setup turn.** B showed that Garchomp (169 Speed) moves before X (167) and OHKOs it with Dragon Claw (105.8-125.8%). My own run adds that Garchomp's spread Earthquake also does **97.4-117.4% (15/16)** to X. X can't make Garchomp's attacks miss or redirect all of them, and Y is immune to Earthquake and takes Dragon Claw for only 70.3-83.9%.\n\n**A's headline number was inflated.** \"OHKOs the whole board\" used five attacking moves. A corrected the no-item figure to 15 in its rebuttal but kept a 21/21 figure that is still wrong for the four-move set: 20/21 with Helping Hand and 18/21 with Life Orb.\n\n**B conceded Y's real weaknesses honestly.** Y is OHKO'd by 8/21 threats on a neutral field and has a 4x Rock weakness. B then showed that Intimidate reduces Sneasler's Rock Slide on Y to 67-80%.\n\nNeither side made an item or mechanic error. Minor loose points:\n- B's \"Intimidate halves Dragon Dance progress\" is imprecise. Intimidate cancels the Attack boost and leaves the Speed boost.\n- A's \"51% of the board\" adds up usage rates, which can't be summed as a share of teams.\n\n**Engine note.** The engine's accuracy table has no entry for Dragon Rush, so the fact sheet lists it at 100%. In the main-series games Dragon Rush is 75% accurate. The team builder should prefer Dragon Claw.","conclusion":"Mega Y wins. On turn one, Y in its own sun OHKOs 13/21 board threats using only moves at 90% accuracy or better, and still 10/21 without Overheat (100%-accurate Weather Ball, Solar Beam and others). Mega X on its recommended Flare Blitz / Dragon Claw set OHKOs only 9/21 at +0. X's case is real but conditional. After one Dragon Dance it has Speed 250 and OHKOs 15/21 with no item, and it takes Rock Slide at 37-59% from Sneasler and Garchomp, where the same attacks KO Y. But Garchomp (169 Speed) outspeeds X at +0 and OHKOs it with Dragon Claw (105.8-125.8%), and its spread Earthquake also does 97.4-117.4% (15/16), so X's setup turn is not safe. A's headline 21/21 used five attacking moves. On the four-move set it is 20/21 with Helping Hand and 18/21 with Life Orb. B's numbers all held and its concessions (8/21 OHKO'd on a neutral field, the Rock weakness, and Intimidate reducing it to 67-80% from Sneasler) were accurate. Y is an immediate sun spread nuke: Heat Wave in sun with Helping Hand OHKOs 9/21 across both targets. X is a single-target Dragon Dance sweeper that fits sand, rain or neutral-weather teams and needs Follow Me, Psychic Terrain and Intimidate support.","debate":{"oa":"**Thesis:** Mega Charizard X is the better Mega for Reg M-C doubles. One Dragon Dance makes it faster than the whole board and able to OHKO every threat on it, all with 100%-accurate moves. It also takes Rock, Water and Electric hits neutrally where Mega Y breaks, and it does not need sun that the opponent can overwrite.\n\n**1. One Dragon Dance OHKOs the whole board.** These are my engine runs: Jolly, 2 HP / 32 Atk / 32 Spe, moves Flare Blitz, Dragon Claw, Brick Break, Thunder Punch and Earthquake.\n- At +1 with no item it OHKOs **17/21** threats (14 or more of 16 rolls).\n- At +1 with Life Orb it OHKOs **21/21**.\n- At +1 with Helping Hand and no item it also OHKOs **21/21**.\n\nEvery one of those moves is 100% accurate. Even at +0, Life Orb X OHKOs **15/21**, the same number Mega Y needs sun to reach.\n\n**2. After one Dragon Dance it outspeeds everything.** Its Speed goes from 167 to **250**. The fastest threats on the board are Sneasler and M-Froslass at 189, and the fastest Megas in the game are 223 (Absol, Garchomp and Lucario Mega Z). The fact sheet lists five board threats faster than both Charizards at +0. At +1, X outspeeds all of them.\n\n**3. It is not 4x weak to Rock.** These are from the fact sheet and my engine runs. Spread damage already includes the x0.75 doubles penalty.\n\n| Attack | vs Mega X | vs Mega Y |\n|---|---|---|\n| Garchomp Rock Slide | 48.4-58.7% | 131-157.4%, KO |\n| Sneasler Rock Slide | 37.4-45.2% | 100.6-121.3%, KO |\n| M-Tyranitar Rock Slide | 74.8-89% | 196.1-234.8%, KO |\n| Arcanine-Hisui Rock Slide | 70.3-81.9% | 181.3-214.8%, KO |\n\nSneasler (34.29% usage) and Garchomp (17.12%) are two of the most common Pokemon on the board. X survives their Rock Slide easily and can set up. Y dies to it.\n\n**4. Water and Electric hits are only neutral on X.** These are my engine runs:\n- M-Golisopod Liquidation: **45.8-54.2%** on X, **122.6-144.5% KO** on Y.\n- Pelipper Weather Ball in rain: **76.1-91%** on X, **120-140.6% KO** on Y.\n\nOver the whole board (fact sheet), X is OHKO'd by **6/21** threats and Y by **8/21**.\n\n**5. Grounded is an advantage for X.** Mega X is grounded (engine `isGrounded` = true), so a Psychic Terrain partner blocks priority aimed at it. That covers Incineroar's Fake Out, Kingambit's Sucker Punch and Arcanine-Hisui's Extreme Speed, which are exactly what stop a setup turn. Mega Y is Flying, so terrain gives it nothing.\n\n**6. X does not depend on weather.** Its power comes from Tough Claws (contact moves x1.3) and Attack boosts, not from a weather effect the opponent can replace.\n- In sand from Tyranitar's Sand Stream, which is a base-form ability that resets for free, X still OHKOs **11/21** at +0 and **21/21** at +1 with Life Orb (my engine runs).\n- Y's no-item OHKO count falls from **15 in sun to 11 in sand** (my engine runs), and each time Y resets sun it spends a switch.\n\n**Team role and partners**\n\nMega X is a Dragon Dance sweeper, and the best partner is **Indeedee-F**. On the setup turn, Follow Me redirects single-target attacks away from X. Psychic Terrain blocks priority against grounded X and boosts Indeedee's own Expanding Force.\n\nThe recommended set is Charizardite X, Flare Blitz / Dragon Claw / Dragon Dance / Protect. A Helping Hand partner does the job of a Life Orb (21/21 at +1) without the recoil, which leaves the other item slot free under Item Clause.\n\nX also fits sand or neutral-weather teams where Y would be fighting its own side's weather.\n\n**Answering Mega Y's best point: \"15/21 OHKOs with no item\"**\n\nThat number (fact sheet) only holds in Y's own sun, and it depends on two unreliable moves:\n- **Overheat** is 90% accurate and drops Y's Special Attack by two stages after one use. It provides most of those KOs: Rillaboom, Kingambit, Gholdengo, Whimsicott, Indeedee-F, Farigiraf and Archaludon.\n- **Hurricane** is **50% accurate in sun** (`E.accuracy`). Three of the 15 KOs rely on it: Sneasler, Pelipper and M-Staraptor.\n\nDiscount for accuracy and the Special Attack drop, and Y's count falls well below 15. X at +1 has 17/21 KOs with no item and 21/21 with Life Orb, all at 100% accuracy and with no drops.\n\nIf the opponent's sun is replaced, Y falls to 11 KOs in sand and 8 in rain (my engine runs). Meanwhile Y loses to the Rock Slides that Sneasler and Garchomp, 51% of the board's combined usage, click on turn one.\n\nY hits hard in the right conditions. X hits every board threat for a KO after one setup turn and survives the moves that remove Y.","ob":"**Thesis:** Mega Charizard Y is the stronger Mega in Reg M-C. Drought gives it sun whenever it Mega Evolves or switches in. Sun raises its OHKO count on the usage board by more than a third. The same sun takes away the Water hits that were supposed to punish it. It also can't be touched by the Ground moves the top threats carry.\n\n**1. It OHKOs more of the board, and more of the popular threats** (fact sheet, confirmed by my own engine runs). With no investment beyond Timid 32 SpA / 32 Spe in its own sun, Y OHKOs **15/21** board threats and X OHKOs **11/21**. Some of Y's 15 rely on 50% Hurricane or 70% Focus Blast, so count only moves at 90% accuracy or better. Y still OHKOs 13: Overheat in sun KOs Sneasler (147.8-174.5%) and M-Staraptor (114.1-134.6%) at 90% (my runs). Y alone OHKOs Indeedee-F (104-122.6%), Farigiraf (14/16), Archaludon (149.7-177.3%) and M-Staraptor, which together are **56.6% usage**. X alone OHKOs Garchomp and Pelipper, which are **30.2%**.\n\n**2. Its spread damage is decisive.** X's physical spread moves do little (my run, Helping Hand on). Earthquake OHKOs only Sneasler and Arcanine-H. Rock Slide OHKOs nothing, with its best roll 4/16 on M-Froslass. Y's Heat Wave in sun with Helping Hand OHKOs **9 threats**, hitting both targets at once (my run, x0.75 spread applied): Rillaboom 136.2-162.3%, Sneasler 121-143.3%, Kingambit, M-Golisopod, Gholdengo, Whimsicott, Archaludon 124.3-146.4%, M-Froslass and M-Metagross. Rillaboom and Sneasler are the two most-used threats (37.18% and 34.29%). Y can remove both from one slot in one turn.\n\n**3. It is immune to Ground, which blanks the top threat.** Y is ungrounded Fire/Flying. The most-used threat, Rillaboom (37.18%), hits X with High Horsepower for 68.4-81.3%. Against Y the same move is **IMMUNE** (my run). Garchomp's Earthquake is also immune. Sneasler's Close Combat does 60.6-72.3% to X but only **40.6-48.4%** to Y, which resists Fighting. Y also resists Fairy: Whimsicott's Moonblast does 16.1-19.4%.\n\n**4. Sun protects it as well as powering it.** Two of the sheet's OHKOs on Y assume the opponent's field or a neutral field. In Y's own sun both stop being OHKOs (my runs):\n- Pelipper's Weather Ball drops from 120-140.6% to **20-23.2%**, because it becomes a resisted Fire move.\n- M-Golisopod's Liquidation drops from 122.6-144.5% to **60.6-72.3%**.\n\nWith sun up, Y is OHKO'd by **6/21**, the same count as X (fact sheet). Mega Evolution resolves after both sides' switch-in abilities (confirmed-facts.md). So a Pelipper lead does not win turn one. Pelipper has to switch out and back in to take the weather back, and Drought fires again every time Y re-enters.\n\n**5. Its damage costs nothing and it keeps its bulk.** X's main moves are Flare Blitz, which has recoil, and Dragon Rush. The Stat line comes from its 159 base SpA (211 in-game at Timid 32) and it has 135 SpD, compared with X's 105 (fact sheet). The two forms have identical Speed (167) and identical HP (155).\n\n**Team role and partners:** Y is a sun-based spread nuke. Its best partners are:\n- **Whimsicott**, for Prankster Tailwind. Doubled Speed from 167 outspeeds all 21 board threats.\n- **Incineroar**, for Fake Out and Intimidate while Y Mega Evolves on turn one.\n- **A Helping Hand user**, which turns Heat Wave into the 9-KO spread shown above.\n\nSolar Beam fires in one turn in sun, so Y also has an answer to Water types: 77.4-91.2% on Pelipper (my run).\n\n**Pre-empting X's case, the 4x Rock weakness:** X's side will point to Rock Slide. Three things weaken that argument:\n1. Rock Slide is 90% accurate and a spread move (x0.75).\n2. Y outspeeds and OHKOs two of the Rock Slide users first: Arcanine-H with Scorching Sands (130.2-153.5%, 100% accuracy) and M-Tyranitar with Focus Blast (131.4-156.5%, 70% accuracy).\n3. X has its own unavoidable weakness. Garchomp's Dragon Claw OHKOs X (105.8-125.8%), M-Salamence's Dragon Claw OHKOs it 14/16, and Sylveon and Archaludon OHKO it too. Dragon Claw is single-target and 100% accurate, and Tailwind and Wide Guard do nothing to stop it.\n\nBoth forms are OHKO'd by 6 threats while their own conditions hold. Only one of them also OHKOs 13-15 threats and can take two out in the same turn.","ra":"**Rebuttal for Mega Charizard X**\n\n**1. The \"9-KO Heat Wave\" needs two conditions.** I re-ran it (Timid 32 SpA, sun, x0.75 spread applied). The 9 KOs only happen with sun and Helping Hand together. Without Helping Hand, sun Heat Wave OHKOs just **6/21**: Kingambit, M-Golisopod, Gholdengo, Whimsicott, M-Froslass and M-Metagross. It no longer OHKOs Sneasler (80.9-95.5%), Archaludon (82.9-97.8%) or Rillaboom, which is only 7/16.\n\nHeat Wave is also 90% accurate against each target (`E.accuracy`), so a clean double KO lands about 81% of the time.\n\nY's plan also needs three partners in one partner slot: Whimsicott for Tailwind, Incineroar for Fake Out, and a Helping Hand user. Only one of them can be on the field with Y. I concede their Helping Hand numbers are correct, and that X's spread moves are weak. X is a single-target sweeper and I do not claim otherwise.\n\n**2. \"Y alone OHKOs Indeedee-F, Farigiraf, Archaludon and M-Staraptor\" compares Y at +0 with X at +0.** X's whole plan is to use Dragon Dance first. After one Dragon Dance, X with no item OHKOs Indeedee-F with Flare Blitz (105.6-125.4%) and M-Staraptor (108.1-128.6%), and Farigiraf 13/16 of the time.\n\nY reaches those KOs with Overheat, which drops Y's Special Attack by two stages after one use. Y's accuracy-filtered figure of 13 therefore counts KOs that each cost the next attack.\n\nI also need to correct my own opening. The 17/21 figure used five attacking moves. With the set I actually recommended (Flare Blitz / Dragon Claw / Dragon Dance / Protect), X at +1 with no item OHKOs **15/21**. That equals Y's in-sun figure, but every move is 100% accurate and nothing drops. The 21/21 figure still needs Life Orb or Helping Hand.\n\n**3. Ground immunity: I concede most of this point.** I don't dispute these numbers:\n- Rillaboom's High Horsepower does 68.4-81.3% to X and nothing to Y.\n- Sneasler's Close Combat does 60.6-72.3% to X.\n- Garchomp's Dragon Claw OHKOs X, and at +0 Garchomp (169) moves before X (167).\n\nThese hits do not OHKO X, though, except Garchomp's Dragon Claw. The Rock Slides are a different matter. Sneasler's and Garchomp's Rock Slides **KO Y** (100.6-121.3% and 131-157.4%), while X takes them at 37-59%. Sneasler outspeeds both forms at +0, so Y cannot remove it first.\n\nAfter X's Dragon Dance, the Garchomp problem reverses. X moves first and OHKOs it with Dragon Claw (151.9-178.4%).\n\n**4. Weather.** I concede that sun turns Pelipper's Weather Ball and M-Golisopod's Liquidation into non-KOs on Y, and that Drought re-fires whenever Y switches in. Even so, each weather reset costs Y a switch, and Sand Stream or Drizzle resets just as easily. X loses nothing when the weather changes.\n\n**Why X still wins:** Y matches X's KO numbers only with sun, a Helping Hand partner, 90% moves and an Overheat drop, while X reaches 15/21 after one Dragon Dance with 100%-accurate moves on any field and survives the Rock Slides from Sneasler and Garchomp (51% combined usage) that KO Mega Y.","rb":"**Rebuttal (Mega Charizard Y)**\n\n**1. \"One Dragon Dance OHKOs 21/21\" needs five attacking moves on a four-move set.** X's side lists Flare Blitz, Dragon Claw, Brick Break, Thunder Punch and Earthquake as its attacks, but the set it recommends is Flare Blitz / Dragon Claw / Dragon Dance / Protect. I ran that set at +1 with no item. It OHKOs **15/21**:\n- **Misses:** Incineroar (Dragon Claw 68.3-81.2%), Farigiraf (Flare Blitz 13/16), Milotic (73.3-86.6%), Archaludon (Flare Blitz 6/16), Arcanine-H (Dragon Claw 11/16) and M-Tyranitar (45.4-53.1%).\n- **Pelipper** is a KO on only 14/16 rolls.\n- **21/21 costs extra.** It needs a Life Orb or a Helping Hand partner on top of the setup turn. Helping Hand also uses up the turn that partner would spend on Follow Me.\n\nSo X's real count is 15 after a free turn. Y reaches 13 at 90% accuracy or better with no setup turn at all.\n\n**2. The Dragon Dance turn is not free.** Garchomp's Speed is 169 and X's is 167, so Garchomp moves first. Its Dragon Claw OHKOs X at +0 (**105.8-125.8%**, my run). Follow Me can redirect that attack, but Garchomp can still hit X with Rock Slide or Earthquake instead.\n\nThe Indeedee-F plan has its own problem: Y OHKOs Indeedee-F in sun (104-122.6%). Psychic Terrain blocks priority, but it does nothing about the faster Sneasler, M-Froslass, Whimsicott or M-Staraptor.\n\nX's \"outspeeds everything\" point depends on surviving the setup turn. Y already outspeeds 16 of the 21 threats with no setup, and Tailwind covers the rest.\n\n**3. Rock Slide: I concede the raw numbers.** Unboosted Rock Slide from Sneasler (100.6-121.3%) and Garchomp (131-157.4%) OHKOs Y. This is Y's real weakness, and it is why Y wants Incineroar as a partner. With Intimidate applied (my runs):\n- Sneasler's Rock Slide falls to **67.1-80%**, with no KO.\n- Garchomp's Rock Slide falls to **87.1-103.9%**, a KO on 4/16 rolls.\n- Rock Slide is also only 90% accurate.\n\nX has the same kind of exposure: Garchomp's Dragon Claw OHKOs it, and Intimidate halves X's Dragon Dance progress.\n\n**4. Further concessions:**\n- On the fact sheet's neutral field, Y is OHKO'd by **8/21** threats to X's 6. My \"6 in sun\" number depends on Drought being active.\n- Hurricane is 50% accurate in sun.\n- Overheat's Special Attack drop is real.\n- In sand, Y's count does fall to 11.\n\nThat is why I already counted only moves at 90% accuracy or better (13 KOs). Heat Wave is also on the set, and it has no Special Attack drop.\n\nAs for sand: Drought fires again every time Y switches in, and Mega Evolution resolves after the opponent's entry abilities. So a Tyranitar lead does not take the weather on turn one.\n\n**5. Grounded status helps X in one way and hurts it in another.** Being grounded lets Psychic Terrain protect X from priority. It also leaves X open to Rillaboom's High Horsepower (68.4-81.3%) and Garchomp's Earthquake. The most-used threat can hit X hard, while Y is immune to both moves.\n\n**Summary:** X's best case needs a free setup turn, a Life Orb or a partner's Helping Hand, and one more attacking move than it has room for. Even then it reaches 15 KOs. Y gets 13 accurate OHKOs from turn one, and Heat Wave with Helping Hand removes Rillaboom and Sneasler from the same slot in one turn.\n\nMega Charizard Y still wins because it does its damage immediately, to both targets, with no setup turn to survive, and its one real weakness (Rock Slide) is fixed by Intimidate."},"checks":[{"sideName":"Mega Charizard X","side":"A","claim":"+1 no item with 5 attacks (FB/DC/BB/TP/EQ) OHKOs 17/21; +1 Life Orb 21/21; +1 Helping Hand 21/21","holds":true,"recomputed":"17/21, 21/21, 21/21"},{"sideName":"Mega Charizard X","side":"A","claim":"Recommended FB/DC/DD/Protect set: Helping Hand does the job of Life Orb (21/21 at +1); 21/21 still needs LO or HH","holds":false,"recomputed":"FB/DC at +1: HH 20/21, LO 18/21 (misses Incineroar 5/16, Milotic 12/16, M-Tyranitar 58.9-69.6%)"},{"sideName":"Mega Charizard X","side":"A","claim":"Rock Slide on X vs Y: Garchomp 48.4-58.7 vs 131-157.4 KO; Sneasler 37.4-45.2 vs 100.6-121.3 KO; Arcanine-H 70.3-81.9 vs 181.3-214.8 KO","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard X","side":"A","claim":"Golisopod Liquidation 45.8-54.2 (X) / 122.6-144.5 KO (Y); Pelipper rain Weather Ball 76.1-91 / 120-140.6 KO","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard X","side":"A","claim":"Sun Heat Wave without HH OHKOs 6/21; Sneasler 80.9-95.5, Archaludon 82.9-97.8, Rillaboom 7/16","holds":true,"recomputed":"6/21, exact match"},{"sideName":"Mega Charizard X","side":"A","claim":"Sand: X +0 11/21, X +1 LO 21/21; Y 11 in sand, 8 in rain; +1 Speed 250; X grounded","holds":true,"recomputed":"11, 21, 11, 8; Spe 250; isGrounded X true / Y false"},{"sideName":"Mega Charizard X","side":"A","claim":"+1 no item: Indeedee-F 105.6-125.4, M-Staraptor 108.1-128.6, Farigiraf 13/16, Garchomp Dragon Claw 151.9-178.4","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard Y","side":"B","claim":"Y in sun, only moves at 90% accuracy or better: 13/21; Overheat Sneasler 147.8-174.5, M-Staraptor 114.1-134.6","holds":true,"recomputed":"13/21 (11 via Overheat); exact numbers; 10/21 without Overheat"},{"sideName":"Mega Charizard Y","side":"B","claim":"Sun Heat Wave with Helping Hand OHKOs 9 (Rillaboom 136.2-162.3, Sneasler 121-143.3, Archaludon 124.3-146.4)","holds":true,"recomputed":"9/21, exact match"},{"sideName":"Mega Charizard Y","side":"B","claim":"X spread with HH: EQ OHKOs only Sneasler and Arcanine-H; Rock Slide OHKOs nothing, best 4/16 M-Froslass","holds":true,"recomputed":"EQ Sneasler 122.3-145.2, ArcH 177.9-212.8; RS M-Froslass 87.8-104.1 (4/16)"},{"sideName":"Mega Charizard Y","side":"B","claim":"Rillaboom High Horsepower 68.4-81.3 on X, immune on Y; Sneasler CC on Y 40.6-48.4","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard Y","side":"B","claim":"In sun: Pelipper Weather Ball on Y 20-23.2, Golisopod Liquidation 60.6-72.3","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard Y","side":"B","claim":"Intimidate: Sneasler Rock Slide on Y 67.1-80, Garchomp Rock Slide 87.1-103.9 (4/16)","holds":true,"recomputed":"exact match"},{"sideName":"Mega Charizard Y","side":"B","claim":"+1 FB/DC misses Incineroar 68.3-81.2, Farigiraf 13/16, Milotic 73.3-86.6, Archaludon 6/16, Arcanine-H 11/16, M-Ttar 45.4-53.1; Garchomp Dragon Claw OHKOs X at +0 (105.8-125.8) and outspeeds 169 vs 167","holds":true,"recomputed":"exact match"}],"teams":[{"legal":true,"paste":"Charizard @ Charizardite X\nAbility: Blaze\nLevel: 50\nEVs: 30 Atk / 10 Def / 26 Spe\nJolly Nature\n- Flare Blitz\n- Dragon Claw\n- Dragon Dance\n- Protect\n\nIndeedee-F @ Colbur Berry\nAbility: Psychic Surge\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nRelaxed Nature\n- Follow Me\n- Helping Hand\n- Expanding Force\n- Trick Room\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 2 Atk / 32 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Throat Chop\n- Parting Shot\n\nWeavile @ Focus Sash\nAbility: Pressure\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Icicle Crash\n- Knock Off\n- Fake Out\n- Taunt\n\nMilotic @ Leftovers\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 14 Def / 20 SpA\nModest Nature\n- Scald\n- Ice Beam\n- Icy Wind\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n","default_four":"Charizard-X, Indeedee-F, Weavile, Incineroar. Default lead: Indeedee-F + Charizard. On turn 1, Charizard Mega Evolves and uses Dragon Dance while Indeedee uses Follow Me, with Psychic Terrain blocking priority. On turn 2, Charizard attacks at +1 (240 Speed) and Indeedee uses Helping Hand or Expanding Force. Against Garchomp or Sneasler, lead Weavile + Charizard: Weavile Fake Outs or uses Icicle Crash while Charizard sets up, and Indeedee stays in the back. Against Incineroar + Kingambit, bring Gholdengo. Against M-Salamence or Dragon-heavy teams, bring Milotic. Against Trick Room, bring Weavile (Taunt), Indeedee (to reverse Trick Room), Charizard and Gholdengo.","headline":"Indeedee-F's Psychic Terrain and Follow Me buy Mega Charizard X a Dragon Dance turn. At +1 Charizard runs 240 Speed and KOs most of the board. Weavile and Milotic remove Garchomp and M-Salamence, Incineroar brings Intimidate and Fake Out, and Gholdengo covers Kingambit, Tyranitar, Archaludon and the Fairies. Speed control is Dragon Dance, Icy Wind, two Fake Out users, and Taunt plus Trick Room against opposing Trick Room. Incineroar has no Knock Off in Champions, so it runs Throat Chop.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Charizard/charizard-mega-x-notes.md"},{"legal":true,"paste":"Charizard @ Charizardite Y\nAbility: Solar Power\nLevel: 50\nEVs: 8 HP / 32 SpA / 26 Spe\nTimid Nature\n- Heat Wave\n- Overheat\n- Solar Beam\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 8 Atk / 26 Def\nImpish Nature\n- Fake Out\n- Flare Blitz\n- Helping Hand\n- Parting Shot\n\nWhimsicott @ Focus Sash\nAbility: Prankster\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Tailwind\n- Helping Hand\n- Moonblast\n- Sunny Day\n\nGarchomp @ Life Orb\nAbility: Rough Skin\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Earthquake\n- Dragon Claw\n- Stone Edge\n- Protect\n\nSneasler @ White Herb\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Fake Out\n- Close Combat\n- Gunk Shot\n- Protect\n\nMilotic @ Never-Melt Ice\nAbility: Competitive\nLevel: 50\nEVs: 32 HP / 26 Def / 8 SpA\nBold Nature\n- Ice Beam\n- Icy Wind\n- Scald\n- Protect\n","default_four":"The default four are Charizard-Mega-Y, Incineroar, Whimsicott and Garchomp. Lead Charizard with Incineroar: on turn 1 Charizard Mega Evolves while Incineroar uses Fake Out on the Rock Slide user, and Charizard fires Heat Wave or Overheat. On turn 2 Incineroar either uses Helping Hand on Heat Wave or Parting Shot to bring Whimsicott in for Tailwind. The alternative lead is Charizard with Whimsicott, for Prankster Tailwind or Helping Hand Heat Wave on turn one. Swap in by matchup: Milotic against dragons, and Sneasler against Kingambit, Incineroar or Tyranitar sand. Against sand or Hisuian Arcanine, lead Sneasler with Incineroar and keep Charizard in the back until the Rock user is gone.","headline":"Mega Charizard Y sun offence: it Mega Evolves on turn one while Incineroar's Intimidate and two Fake Outs (Incineroar, Sneasler) cover its 4x Rock Slide weakness. Prankster Whimsicott gives Tailwind, Helping Hand and a Sunny Day to win back the weather. Garchomp (spamming Earthquake, which Charizard is immune to), Sneasler and Milotic (Ice Beam, Icy Wind) handle the walls Charizard cannot break.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Charizard/charizard-mega-y-notes.md"}],"brief_a":{"game_plan":"Mega X is a single-target Dragon Dance sweeper. It needs one protected setup turn, then uses Speed 250 and +1 Attack to OHKO most of the board with Flare Blitz and Dragon Claw. Keep it grounded under Psychic Terrain, which stops priority from Fake Out, Sucker Punch and Extreme Speed. Use Follow Me or Rage Powder to redirect attacks on the setup turn. It fits sand, rain or neutral-weather teams, where Mega Y loses power. Prefer Dragon Claw over Dragon Rush: Dragon Rush is really 75% accurate even though the engine lists it at 100%.","lean_into":["After one Dragon Dance, Speed 250 outspeeds every board threat (the fastest are 189) and every Mega (the fastest is 223)","At +1 with no item, Flare Blitz and Dragon Claw OHKO 15/21: Rillaboom 207-245%, Sneasler 191-226%, Garchomp 151.9-178.4%, Indeedee-F 105.6-125.4%, M-Salamence 117-138%, M-Staraptor 108-129%","At +1, Helping Hand raises the count to 20/21 and Life Orb to 18/21","Rock resistance compared with Y: Rock Slide from Garchomp does 48.4-58.7%, Sneasler 37.4-45.2%, Arcanine-H 70.3-81.9%, M-Tyranitar in sand 74.8-89%","Water hits are only neutral: M-Golisopod Liquidation 45.8-54.2%, Pelipper Weather Ball in rain 76.1-91%; Incineroar Flare Blitz does 12.3-14.2%","Weather does not matter: in sand X still OHKOs 11/21 at +0 and 21/21 at +1 with Life Orb"],"must_cover":["Garchomp (Speed 169, faster than X at +0): Dragon Claw 105.8-125.8% (KO) and spread Earthquake 97.4-117.4% (15/16); Intimidate lowers these to 70.3-85.8% and 65.2-77.4%","Rillaboom High Horsepower 68.4-81.3%; Sneasler (faster than X) Close Combat 60.6-72.3%","M-Salamence Dragon Claw 98.1-116.1% (14/16)","OHKOs on X: Archaludon Draco Meteor 174-207%, Arcanine-H Head Smash 183-216%, M-Baxcalibur Glaive Rush 167-197%, Sylveon Hyper Beam 124-146%","Intimidate (Incineroar, 26.77%) cancels its Attack boost","Threats it cannot OHKO even at +1 with no item: Incineroar (68.3-81.2%), M-Tyranitar (45.4-53.1%), Milotic (73.3-86.6%), Archaludon (6/16), Farigiraf (13/16), Arcanine-H (11/16)","Weak spread damage: with Helping Hand, Rock Slide OHKOs nothing and Earthquake OHKOs only Sneasler and Arcanine-H","Trick Room from Indeedee-F or Farigiraf reverses its Speed advantage"],"partner_ideas":["Indeedee-F for Follow Me and Psychic Terrain, which block priority against grounded X; it can pass Helping Hand instead of X holding Life Orb","Intimidate support (Incineroar) to blunt Garchomp on the setup turn","A fast Ice or Fairy attacker to remove Garchomp and M-Salamence","A special Water or Fighting attacker for Incineroar, M-Tyranitar and Milotic","Wide Guard or a Ground-immune partner against Garchomp's Earthquake","A Trick Room answer (Taunt or Imprison) against Indeedee-F and Farigiraf"]},"brief_b":{"game_plan":"Mega Y is an immediate sun nuke. It Mega Evolves on turn one, which resolves after both sides' entry abilities, so its Drought takes the weather. It then fires Heat Wave, Weather Ball or Overheat at once, with no setup. Pair it with Intimidate and Fake Out to cover its 4x Rock weakness, and with Helping Hand to turn Heat Wave into double KOs. Pivot out and back in to reset sun, since Drought re-fires on every switch-in. Suggested set: Heat Wave / Weather Ball or Overheat / Solar Beam or Scorching Sands / Protect, Timid 32 SpA / 32 Spe.","lean_into":["In sun with only moves at 90% accuracy or better, Y OHKOs 13/21 with no item: Rillaboom 166-197%, Sneasler 147.8-174.5%, Indeedee-F 104-122.6%, Farigiraf 14/16, Archaludon 149.7-177.3%, Arcanine-H 130.2-153.5%, M-Staraptor 114.1-134.6%","Without Overheat it still OHKOs 10/21 with 100%-accurate Weather Ball, Solar Beam, Scorching Sands and Air Slash, with no Special Attack drop","Heat Wave in sun with Helping Hand OHKOs 9/21 across both targets, including Rillaboom 136-162% and Sneasler 121-143%; without Helping Hand it OHKOs 6/21","Immune to Ground: Rillaboom High Horsepower and Garchomp Earthquake do nothing; it resists Sneasler Close Combat (40.6-48.4%) and Whimsicott Moonblast (16.1-19.4%)","Sun cuts Water damage: Pelipper Weather Ball does 20-23.2% and M-Golisopod Liquidation 60.6-72.3%; Solar Beam hits Pelipper for 77.4-91.2%"],"must_cover":["Rock Slide (4x): Sneasler 100.6-121.3% and Garchomp 131-157.4% (both faster than Y); M-Tyranitar 196-235%, Arcanine-H 181-215%","With Intimidate, Sneasler's Rock Slide falls to 67.1-80%, but Garchomp's still KOs 4/16","Arcanine-H Head Smash 483-574% (Arcanine-H is OHKO'd first by Scorching Sands)","Gholdengo with Power Gem and Life Orb: 140.6-167.7%","M-Salamence Double-Edge 116.1-136.8%; M-Baxcalibur Glaive Rush 111-131.6%; Archaludon Electro Shot in rain 8/16","Weather wars: in sand Y OHKOs only 11/21 and in rain 8/21, and Tyranitar and Pelipper reset weather for free","Walls it cannot OHKO: Incineroar (41.6-49%), Milotic (55.4-65.3%), Garchomp (70.3-83.2%), M-Salamence (66.7-78.5%), M-Tyranitar without Focus Blast (65.7-78.3%)","Overheat drops Special Attack by two stages; Hurricane is 50% accurate in sun and Focus Blast 70%"],"partner_ideas":["Incineroar for Intimidate and Fake Out on the turn Y Mega Evolves, covering Sneasler and Garchomp Rock Slide","A Helping Hand user to turn Heat Wave into the 9-KO spread","Prankster Whimsicott for Tailwind: at Speed 334, Y outspeeds all 21 threats","Wide Guard to block spread Rock Slide","A Water or Fighting partner for M-Tyranitar, Incineroar and Garchomp","A Rock-resistant pivot so Y can switch out and re-enter to reset Drought"]}},{"species":"Mewtwo","slug":"mewtwo","hypothetical":true,"hypoNote":"Mewtwo is not in Pokémon Champions yet. This debate uses its main-series stats and Scarlet/Violet moves as a what-if. Every other Pokémon, item and rule is real Champions data.","short":"X vs Y","forms":[{"label":"Mega X","name":"Mega Mewtwo X","slug":"mewtwo-mega-x","stone":"Mewtwonite X"},{"label":"Mega Y","name":"Mega Mewtwo Y","slug":"mewtwo-mega-y","stone":"Mewtwonite Y"}],"winnerName":"Mega Mewtwo Y","score_a":82,"score_b":87,"rubric_a":"35/40, 21/25, 16/20, 10/15","rubric_b":"36/40, 22/25, 17/20, 12/15","ruleLine":"Rotom Judge rules that Mega Mewtwo Y is the better form (Mega Mewtwo X 82, Mega Mewtwo Y 87).","opinion":"Every number both sides cited reproduces exactly. The case is decided by which weaknesses a partner can fix.\n\nY's physical frailty is real. Kowtow Cleave OHKOs it through Psychic Terrain (119.1-142.1%), and Knock Off does 65.6-78.7%. But\nits priority deaths (Sucker Punch 14/16, First Impression 179-210%, Grassy Glide) are removed by Psychic Terrain on a grounded Y.\nA's strongest counter was the 105-vs-105 Indeedee/Rillaboom terrain tie. That is fixable, because a Relaxed or Quiet\n0-Speed Indeedee-F runs at 94 (engine), so it is slower than Rillaboom and wins the lead terrain every time. Y also keeps its\ndamage through Intimidate, and its PT+HH Psystrike answers the #1 threat, Rillaboom (116.9-138.6%), which X can only\ndent (63.8-75.4%).\n\nX's central claim, that Fighting STAB beats the Dark types, fails against the most common Dark type itself. Incineroar's\nIntimidate drops X's Helping Hand Drain Punch on Kingambit to 71-84.1%, and Incineroar and Kingambit are the two most-used\nDark types. A also made a mechanics error: Sylveon's Hyper Beam is single-target, so Wide Guard does not cover X's worst\nmatchup. A's Fake Out/Steadfast point also conflicts with its own Psychic Terrain partner, which blocks Fake Out on X.\nA was right about accuracy: 8 of Y's 13 OHKOs need a 70-85% move. That is why the margin is narrow. B used it well by\nchoosing Helping Hand plus Psychic Terrain boosts that turn 100%-accurate Psystrike into KOs. Also, Aura Sphere\n(never misses) with Helping Hand KOs Kingambit at 102.9-121.7% (engine), so Y's Kingambit answer does not have to be a\n70% Focus Blast.","conclusion":"Mega Mewtwo Y wins narrowly (87-82) in this hypothetical matchup. Every damage number either side cited checks out in the engine. X really is much bulkier against physical hits (Kowtow Cleave 44.8-53% vs Y's 119.1-142.1%), and 8 of Y's 13 OHKOs rely on 70-85% moves. But X's main claim, that Fighting STAB answers the Dark types, breaks against Incineroar's Intimidate: Helping Hand Drain Punch on Kingambit drops to 71-84.1%, no KO. A also made a mechanics error: Sylveon's Hyper Beam is single-target, so Wide Guard does not stop it. Y's priority weakness is fixable. Psychic Terrain blocks priority on the grounded Y, and a 0-Speed Relaxed Indeedee-F (94 Speed) is slower than Rillaboom (105), so it wins the terrain on the lead. Terrain plus Helping Hand Psystrike also KOs the #1 threat Rillaboom (116.9-138.6%), and Helping Hand Aura Sphere KOs Kingambit (102.9-121.7%) with no accuracy roll. X is the physically bulky, Intimidate-sensitive Helping Hand attacker. Y is a Psychic Terrain hyper-offense sweeper that must avoid Kowtow Cleave and Knock Off.","debate":{"oa":"Thesis: in the Reg M-C format as it actually exists, Mega Mewtwo X is the better Mega form. It survives the priority attacks and physical Dark and Bug moves that make up most of the usage-weighted board. Its OHKOs come from moves that always hit. And its Fighting typing hits Incineroar and Kingambit, the two most-used Pokemon that stop a Psychic attacker. Mega Y wins more on paper and fewer on the field.\n\n**1. Y's OHKO lead depends on inaccurate moves; X's does not (fact sheet).** On paper Y OHKOs 13/21 and X OHKOs 9/21. But 8 of Y's 13 need Focus Blast (70%), Fire Blast (85%) or Thunder (70%): Kingambit, M-Golisopod, Gholdengo, Pelipper, Whimsicott, Archaludon, M-Froslass and M-Tyranitar. Only 5 of Y's OHKOs use a 100%-accurate move. X gets 8 OHKOs with 100% moves: Sneasler, M-Salamence (15/16), Garchomp, Pelipper, Whimsicott, Arcanine-Hisui, M-Tyranitar and M-Staraptor (14/16). Its ninth, M-Froslass, uses Stone Edge (80%). In a best-of-3 set, the OHKOs that always land are the ones that count.\n\n**2. Y is OHKO'd by the most-used physical attackers; X is not (engine and fact sheet).** Both forms below use the same offensive spread: 2 HP, 32 in the attacking stat, 32 Speed.\n- Kingambit (22.44%) Sucker Punch: into Y 99.5-118% (14/16). Into X 36.6-44.3%.\n- Kingambit Kowtow Cleave: into Y 119.1-142.1%, a guaranteed OHKO. Into X 44.8-53%.\n- Mega Golisopod (18.49%) First Impression: into Y 179.2-210.4%. Into X 66.7-79.8%.\n- Rillaboom (37.18%) Wood Hammer in Grassy Terrain: into Y 102.7-122.4%. Into X 77.6-92.3%.\n- Mega Tyranitar Crunch: into Y 129-154.1%. Into X 49.2-57.9%.\n\nOverall Y is OHKO'd by 7/21 board threats and X by 4/21 (fact sheet). Y's losses sit on the highest-usage Pokemon, and Sucker Punch and Kowtow Cleave hit Y harder than any of X's four checks hit X.\n\n**3. X's Fighting STAB beats the Dark types that wall Psychic (engine).** Y's Psystrike does nothing to Incineroar or Kingambit, and its answers to them are 70% Focus Blasts. X answers them with 100%-accurate moves:\n- Drain Punch into Incineroar (26.77%): 87.1-104%. With Helping Hand, 130.7-155.9%, a guaranteed KO.\n- Drain Punch into Kingambit, with its Chople Berry counted: 70.5-84.1%. With Helping Hand, 105.8-126.1%, a guaranteed KO.\n\nDrain Punch also heals X while it attacks. It gets the same neutral 76-91% on Archaludon and Mega Baxcalibur, and a Helping Hand KO on both.\n\n**4. X takes Fake Out and Knock Off better, and Steadfast helps (engine).** Incineroar's Knock Off does 25.1-30.1% to X and 65.6-78.7% to Y. Every Fake Out from Incineroar, Sneasler or Rillaboom that flinches X triggers Steadfast, which raises X's 200 Speed to 300 for the rest of the game. At that point X outspeeds the whole board without needing Tailwind.\n\n**5. X's Speed is already enough (fact sheet).** At 200 Speed (Jolly, 32 Speed), X outspeeds all 21 board threats, the same as Y does at 211. Y's extra Speed only matters against Mega Mewtwo X itself and Mega Greninja. Neither is on the board.\n\n**Team role and partners.** X works as a physical attacker next to a Helping Hand and Follow Me partner, or next to Psychic Terrain. Indeedee-F provides both, and its Psychic Terrain boosts Zen Headbutt to 62.3-73.4% on Rillaboom and 128.1-151.9% on Mega Staraptor (engine). Whimsicott is another option: Tailwind plus Helping Hand, with Prankster, which makes Drain Punch KO Incineroar and Kingambit. The 4 threats that OHKO X are Mega Salamence, Mega Staraptor, Sylveon and Gholdengo. Each has an answer on X's own moveset or on a teammate:\n- Mega Salamence: X outspeeds it (200 vs 158) and Ice Punch KOs 15/16.\n- Mega Staraptor: X outspeeds it (200 vs 178), and Zen Headbutt in Psychic Terrain KOs.\n- Sylveon and Gholdengo: a partner with Wide Guard, or a Steel type, covers them.\n\n**Pre-empting Y's best point: raw special damage and 13 OHKOs.** The number looks strong until you count accuracy and bulk. Five of Y's OHKOs are on Focus Blast (Kingambit, Incineroar is not even one, Archaludon, M-Tyranitar) or Thunder, where a single miss loses the turn. Two of them, Pelipper and Whimsicott, carry Focus Sash, so neither form actually OHKOs them. And Y is OHKO'd in return by Kingambit's Sucker Punch, which goes first no matter how fast Y is. Y's 211 Speed cannot outrun priority.\n\nOne weakness I will admit: X is physical, so Incineroar's Intimidate matters. At -1 Attack, Helping Hand Drain Punch still does 86.1-104% to Incineroar (engine). Y has no equivalent answer to Kingambit at any stat stage. X is the form that gets through the Pokemon people actually use.","ob":"**Thesis:** Mega Mewtwo Y is the better Mega. It is the fastest Mewtwo, it OHKOs more of the Reg M-C board, it is far harder to hit on the special side, and its partners fix its weak points in ways Mega X cannot copy.\n\n**1. It OHKOs more of the board: 13/21 threats vs Mega X's 9/21 (fact sheet, no item).**\nTimid 2/32 SpA/32 Spe gives 246 SpA. Here is what it deletes: Sneasler (Psystrike 443-522%), M-Salamence (Ice Beam 163-194%), Garchomp (Ice Beam 171-203%) and Arcanine-Hisui (Earth Power 195-230%). It also takes out Gholdengo (Fire Blast 109-129%), M-Golisopod (Fire Blast 160-191%), Kingambit (Focus Blast 102-121%) and Archaludon (Focus Blast 144-170%). Mega X cannot OHKO Kingambit (Brick Break 70.5-84.1%), Gholdengo (Fire Punch 71-84%) or Golisopod (76.9-92.3%). Those three together make up 56% usage. The accuracy cost is real: Fire Blast is 85%, Focus Blast 70%.\n\n**2. It is the fastest Mewtwo: 211 vs 200 Speed (fact sheet).**\nBoth forms outspeed all 21 board threats. Y also beats Mega X itself, plus Mega Manectric and Mega Lopunny (205) and Mega Delphox (204), all of which outspeed X.\n\n**3. Intimidate does not touch it.**\nIncineroar is the #3 threat at 26.77% usage. I ran Mega X at -1 Atk in the engine. At -1 X loses its kills:\n- Incineroar: Brick Break 57.4-69.3%\n- M-Salamence: Ice Punch 66.7-79.6%\n- Garchomp: Ice Punch drops to 86.5-103.8% (3/16 rolls KO)\n\nMega Y's special numbers stay the same. With Helping Hand, Focus Blast OHKOs Incineroar 120.3-142.6% (engine).\n\n**4. Much better special bulk and neutral Flying/Fairy (fact sheet).**\nMega X is weak to Fairy and Flying. The same hits on each form:\n\n| Hit | on Mega X | on Mega Y |\n|---|---|---|\n| Sylveon Hyper Beam | OHKO, 184-217% | 78.7-92.9% |\n| M-Staraptor Brave Bird | OHKO, 105-125% | 69.4-82.5% |\n| Whimsicott Moonblast | 63.4-75.4% | 27.9-32.8% |\n| Indeedee-F Expanding Force | 35-41% | 14.8-17.5% |\n| Pelipper's best hit | Hurricane 83-99.5% | Weather Ball 49.7-59% |\n\n**5. Its amplifiers are real and on-format (engine).**\nMewtwo cannot hold Life Orb, and neither form can, because the stone uses the item slot. So the boosts come from the field and from partners:\n- Psychic Terrain + Helping Hand Psystrike: Milotic 122.8-145.5% KO, Rillaboom 116.9-138.6% KO\n- Helping Hand Psystrike on Sylveon: 110.2-130.5% KO\n- Helping Hand Dark Pulse on Indeedee-F: 100-118.6% KO\n- Fire Blast in sun: Rillaboom 110.1-130.4% KO, M-Metagross 138-162.6% KO\n\nFor comparison, Rillaboom is the #1 threat at 37.18% usage, and no-item Mega X only does 63.8-75.4% to it.\n\n**Team role and partners**\nMega Y is a fast special sweeper that fires first in every slot.\n- **Indeedee-F (Psychic Surge, Follow Me, Helping Hand)** is the main partner. It turns Psystrike into the Rillaboom and Milotic KOs listed above. Its Psychic Terrain also blocks priority against grounded Mewtwo Y. That shuts off the priority hits that exploit Y's lower physical bulk: M-Golisopod's First Impression (+2, 179-210% on Y) and Kingambit's Sucker Punch. Follow Me soaks the Dark and Bug attacks aimed at it.\n- **Torkoal (Drought, 20 Speed)** is the alternative partner. It needs no Mega slot and gives the sun Fire Blast numbers above.\n\n**Pre-empting Mega X's best point: \"Y is OHKO'd by 7/21, X only by 4/21.\"**\nLook at who those 7 are:\n- **Slow threats that Y hits first and OHKOs:** Kingambit (70 Speed; Focus Blast KO, and guaranteed with Helping Hand), M-Golisopod (60; Fire Blast 160%), Arcanine-Hisui (156; Earth Power 195%) and M-Tyranitar (91; Focus Blast 153%).\n- **Rillaboom:** it only KOs Y in its own Grassy Terrain (102.7-122.4%). Y still moves first, at 211 vs 105.\n- **The remaining two:** M-Salamence and M-Baxcalibur. Y outspeeds both. Salamence takes Ice Beam 163%, and Baxcalibur takes Focus Blast 89-106%.\n\nIn short, most of Y's \"defensive losses\" are to threats it moves before and OHKOs. Mega X's losses are to Sylveon, Staraptor and Salamence, which hit it for super-effective damage through types it cannot change. It is also weakened by the Intimidate it faces from the #3 threat on the board. Mega Y has more kills, more Speed and less exposure: it is the better Mega.","ra":"**Rebuttal (Mega Mewtwo X)**\n\n**1. \"13/21 OHKOs\" is really 11, and 6 of those depend on accuracy.** The engine's board gives Pelipper and Whimsicott Focus Sash, so Y's Thunder (329.9-391.2%) and Fire Blast (156.2-185.4%) leave both at 1 HP. That applies to X too, which drops to 7. Look at the OHKOs that always land. Y keeps 5: Sneasler, M-Salamence, Garchomp, Arcanine-H and one more. X keeps 6: Sneasler, M-Salamence (15/16), Garchomp, Arcanine-H, M-Tyranitar and M-Staraptor (14/16). Y's other 6 need Focus Blast (70%) or Fire Blast (85%). I concede one point: the engine does count Chople Berry, so Y's Focus Blast OHKOs Kingambit at 102.4-120.8% even through the berry. That OHKO is real, but it still lands only 70% of the time.\n\n**2. Psychic Terrain only blocks priority; Kingambit still OHKOs Y.** They are right that Indeedee-F's terrain stops Sucker Punch and First Impression on a grounded Y. But Kowtow Cleave in Psychic Terrain still does 119.1-142.1% to Y (engine). Y moves first and hits with Focus Blast 70% of the time. The other 30%, Y dies. Mega X takes 44.8-53% from the same hit.\n\nTheir plan also runs into Rillaboom. Indeedee-F and Rillaboom both have 105 Speed on the board, and the slower setter's terrain is the one that stays. Both set terrain on entry, so that becomes a 50/50 speed tie. When Grassy Terrain wins, Wood Hammer OHKOs Y (102.7-122.4%). When Psychic Terrain wins, it does 79.2-94%. Y's main partner only protects it half the time against the #1 threat.\n\n**3. Intimidate: I concede this, but look at the whole picture.** Their -1 numbers are correct: Drain Punch does 57.4-69.3% to Incineroar. I also have to correct my own opening. Helping Hand Drain Punch at -1 does 86.1-104%, and only 3/16 rolls KO. Y's Helping Hand Focus Blast does 120.3-142.6% if it hits, so into an Intimidate Incineroar, Y is the better form. However, without Helping Hand, Y's Focus Blast does only 80.2-95% to Incineroar, so Y also needs the partner. And Incineroar's Knock Off does 65.6-78.7% to Y against 25.1-30.1% to X. Y wins that trade only 70% of the time.\n\n**4. Special bulk: I concede the numbers.** Their table is accurate. Sylveon's Hyper Beam and Mega Staraptor's Brave Bird OHKO X. But X outspeeds Staraptor (200 vs 178), and Zen Headbutt in Psychic Terrain OHKOs it. Sylveon's Hyper Beam is a spread move, which Wide Guard stops. Y's worst matchups are Kingambit, Mega Golisopod and Rillaboom, which have 22-37% usage each. X's are fewer and on lower-usage threats.\n\n**5. Speed.** Mega Manectric, Mega Lopunny and Mega Delphox are not on the board. Against all 21 threats, 211 Speed and 200 Speed outspeed exactly the same set.\n\n**Summary.** Y does more damage when Focus Blast hits and Indeedee-F wins the terrain tie. X does its job without either: it OHKOs more with 100%-accurate moves and takes only 44.8-53% from Kowtow Cleave, against Y's 119.1-142.1%.\n\nMega Mewtwo X still wins because more of its KOs land every time and it survives the Pokemon people actually use, so it loses fewer games to a missed Focus Blast or a lost terrain tie.","rb":"**Rebuttal: Mega Mewtwo Y**\n\n**1. X's priority numbers ignore the partner it named.** Kingambit's Sucker Punch (99.5-118%, 14/16) and Golisopod's +2 First Impression (179-210%) are correct engine numbers in a vacuum. But Y's listed partner is Indeedee-F, and X's opening names the same partner. Psychic Terrain blocks every priority move aimed at a grounded target (confirmed-facts.md). Mega Y is grounded, so both hits fail. That also covers Rillaboom's Grassy Glide and every Fake Out. The Fake Out point cuts against X: X also wants Indeedee, and under Indeedee's terrain Fake Out never flinches X, so Steadfast never triggers. I concede the non-priority hit. Kowtow Cleave OHKOs Y at 119-142%. Y still moves first (211 vs 70), and a Focus Blast miss loses Y.\n\n**2. The Dark-type answer falls apart at -1.** X's own concession matters more than it admits. Incineroar and Kingambit are often brought together, and X's plan against Kingambit needs Helping Hand. I ran it in the engine with Kingambit's Chople Berry counted:\n- X at -1, Helping Hand Drain Punch into Kingambit: **71-84.1%, no KO**\n- X at -1, unboosted: 47.3-56%\n- X at -1, Helping Hand into Incineroar: only 3/16 rolls KO (86.1-104%)\n\nY's answers ignore Intimidate. Helping Hand Focus Blast does 153.6-181.2% to Kingambit through Chople and 120.3-142.6% to Incineroar. Unboosted Focus Blast OHKOs Kingambit at 102.4-120.8%. So Y's answer is a 70% roll to KO. After one Intimidate, X's answer is close to a 0% roll to KO Kingambit.\n\n**3. The accuracy argument: partly conceded, partly overstated.** X is right that only 5 of Y's 13 OHKOs use 100%-accurate moves, and that the Focus Sash on Pelipper and Whimsicott removes those KOs for both forms. I accept both. But three of X's own \"sure\" KOs are also rolls:\n- M-Salamence: 15/16\n- M-Staraptor: 14/16\n- M-Froslass: Stone Edge at 80%\n\nX's clean lead also falls apart in the matchups that matter by usage:\n- **Rillaboom (#1, 37.18%):** X's best hit is 63.8-75.4%. Y's Psystrike in terrain alone does 77.8-92.3%, and Psychic Terrain plus Helping Hand OHKOs.\n- **Gholdengo and M-Golisopod:** X needs two hits on each. Y has an 85% OHKO on each.\n\nA 70-85% chance of a KO still beats a 0% chance.\n\n**4. Bulk trade.** I concede Knock Off: it does 65.6-78.7% to Y against 25-30% to X. Y's 7/21 physical exposure is real, and it is the price of the form. But the threats that OHKO X are Sylveon (184-217%), Staraptor and Gholdengo. X can only handle them by adding Wide Guard or a Steel partner, which takes up a slot. Y's exposure is mostly to slow Pokemon it moves before, and its partner's terrain blocks the priority.\n\n**Conclusion:** Mega Y keeps its damage through Intimidate, moves first, and under its own Psychic Terrain it cannot be hit by the priority moves X's case depends on. It is therefore the Mega that converts against the real Reg M-C board, while X loses its main answer to Kingambit after one Intimidate."},"checks":[{"sideName":"Mega Mewtwo X","side":"A","claim":"Kingambit Sucker Punch into Y 99.5-118% (14/16), into X 36.6-44.3%","holds":true,"recomputed":"99.5-118% (14/16); 36.6-44.3%"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Kowtow Cleave into Y 119.1-142.1% even in Psychic Terrain; into X 44.8-53%","holds":true,"recomputed":"119.1-142.1% KO with or without PT; 44.8-53%"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Wood Hammer into Y 102.7-122.4% Grassy, 79.2-94% Psychic Terrain; Indeedee-F and Rillaboom tie at 105","holds":true,"recomputed":"102.7-122.4% KO; 79.2-94%; both 105 Spe"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Drain Punch Incineroar 87.1-104%, +HH 130.7-155.9%, -1 +HH 86.1-104% (3/16)","holds":true,"recomputed":"87.1-104% (3/16); 130.7-155.9% KO; 86.1-104% (3/16)"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Drain Punch Kingambit (Chople) 70.5-84.1%, +HH 105.8-126.1%","holds":true,"recomputed":"70.5-84.1%; 105.8-126.1% KO"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Knock Off 25.1-30.1% into X vs 65.6-78.7% into Y; Zen Headbutt PT on M-Staraptor 128.1-151.9%","holds":true,"recomputed":"25.1-30.1%; 65.6-78.7%; 128.1-151.9% KO"},{"sideName":"Mega Mewtwo X","side":"A","claim":"Sylveon's Hyper Beam is a spread move that Wide Guard stops","holds":false,"recomputed":"Hyper Beam is single-target: 184.2-216.9% on X, no spread; only Hyper Voice (82-98.9%) is spread"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"X at -1: Brick Break Incineroar 57.4-69.3%, Ice Punch M-Salamence 66.7-79.6%, Garchomp 86.5-103.8% (3/16)","holds":true,"recomputed":"57.4-69.3%; 66.7-79.6%; 86.5-103.8% (3/16)"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"X -1 +HH Drain Punch Kingambit 71-84.1% no KO; -1 unboosted 47.3-56%","holds":true,"recomputed":"71-84.1%; 47.3-56%"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"Y HH Focus Blast Incineroar 120.3-142.6%, Kingambit 153.6-181.2%; unboosted Kingambit 102.4-120.8%","holds":true,"recomputed":"120.3-142.6% KO; 153.6-181.2% KO; 102.4-120.8% KO (all 70% acc)"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"PT+HH Psystrike Milotic 122.8-145.5%, Rillaboom 116.9-138.6%; PT alone Rillaboom 77.8-92.3%","holds":true,"recomputed":"122.8-145.5% KO; 116.9-138.6% KO; 77.8-92.3%"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"HH Psystrike Sylveon 110.2-130.5%, HH Dark Pulse Indeedee-F 100-118.6%, sun Fire Blast Rillaboom 110.1-130.4% / M-Metagross 138-162.6%","holds":true,"recomputed":"110.2-130.5%; 100-118.6%; 110.1-130.4%; 138-162.6%"},{"sideName":"Mega Mewtwo Y","side":"B","claim":"Sylveon Hyper Beam into X 184.2-216.9% vs Y 78.7-92.9%; M-Staraptor Brave Bird into X 104.9-124.6%","holds":true,"recomputed":"184.2-216.9% KO; 78.7-92.9%; 104.9-124.6% KO"}],"teams":[{"legal":true,"paste":"# HYPOTHETICAL: Mewtwo is not in Pokemon Champions. Mega Mewtwo X team, Reg M-C doubles.\n\nMewtwo @ Mewtwonite X\nAbility: Pressure\nLevel: 50\nEVs: 11 HP / 32 Atk / 23 Spe\nJolly Nature\n- Zen Headbutt\n- Drain Punch\n- Ice Punch\n- Protect\n\nIndeedee-F @ Sitrus Berry\nAbility: Psychic Surge\nLevel: 50\nEVs: 32 HP / 26 Def / 8 SpD\nRelaxed Nature\n- Follow Me\n- Helping Hand\n- Expanding Force\n- Trick Room\n\nTalonflame @ Sharp Beak\nAbility: Gale Wings\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Tailwind\n- Brave Bird\n- Flare Blitz\n- Protect\n\nArcanine-Hisui @ Charcoal\nAbility: Intimidate\nLevel: 50\nEVs: 12 HP / 32 Atk / 22 Spe\nJolly Nature\n- Flare Blitz\n- Head Smash\n- Extreme Speed\n- Protect\n\nSneasler @ Psychic Seed\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Close Combat\n- Gunk Shot\n- Fake Out\n- Protect\n\nGholdengo @ Life Orb\nAbility: Good as Gold\nLevel: 50\nEVs: 7 HP / 2 Def / 32 SpA / 25 Spe\nModest Nature\n- Make It Rain\n- Shadow Ball\n- Focus Blast\n- Protect\n","default_four":"The default four are Mewtwo X, Indeedee-F, Talonflame and Arcanine-Hisui. Lead Indeedee-F with Mewtwo X and Mega Evolve on turn 1. Indeedee uses Helping Hand for the Kingambit, Incineroar, Rillaboom and Sylveon KOs, and Follow Me when Sylveon, Gholdengo, Staraptor or Salamence would hit Mewtwo. Talonflame (Tailwind) and Arcanine-H (Intimidate, Fire coverage) wait in the back. Against Tailwind or Trick Room teams, lead Talonflame with Mewtwo and keep Indeedee in the back to reverse Trick Room. Against Incineroar and Kingambit, bring Sneasler instead of Talonflame and lead it with Indeedee: the Psychic Seed triggers, and Sneasler reaches 378 Speed for Helping Hand Close Combat. Against Sylveon or Gholdengo, bring Gholdengo instead of Talonflame. Against rain, bring Sneasler and Gholdengo instead of Talonflame and Arcanine.","headline":"This is a hypothetical team, because Mewtwo is not in Champions. Mega Mewtwo X (190 Speed, moves that never miss) is paired with a 94-Speed Relaxed Indeedee-F: Helping Hand and Psychic Terrain turn Mewtwo's near-misses into KOs, and Follow Me absorbs the Sylveon, Salamence and Staraptor hits that would OHKO it. Talonflame's Tailwind and Sneasler's Unburden are the two speed-control layers. Arcanine-H, Sneasler and Gholdengo take over the Dark-type and Fairy KOs when Intimidate blunts Mewtwo.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Mewtwo/mewtwo-mega-x-notes.md"},{"legal":true,"paste":"Mewtwo @ Mewtwonite Y\nAbility: Unnerve\nLevel: 50\nEVs: 21 Def / 32 SpA / 13 Spe\nTimid Nature\n- Psystrike\n- Aura Sphere\n- Ice Beam\n- Protect\n\nIndeedee-F @ Terrain Extender\nAbility: Psychic Surge\nLevel: 50\nEVs: 32 HP / 32 Def / 2 SpD\nRelaxed Nature\n- Follow Me\n- Helping Hand\n- Reflect\n- Protect\n\nArcanine-Hisui @ Life Orb\nAbility: Intimidate\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nAdamant Nature\n- Head Smash\n- Flare Blitz\n- Close Combat\n- Protect\n\nIncineroar @ Sitrus Berry\nAbility: Intimidate\nLevel: 50\nEVs: 32 HP / 20 Atk / 14 SpD\nAdamant Nature\n- Flare Blitz\n- Darkest Lariat\n- Parting Shot\n- Will-O-Wisp\n\nSneasler @ Psychic Seed\nAbility: Unburden\nLevel: 50\nEVs: 2 HP / 32 Atk / 32 Spe\nJolly Nature\n- Close Combat\n- Dire Claw\n- Throat Chop\n- Protect\n\nWhimsicott @ Focus Sash\nAbility: Prankster\nLevel: 50\nEVs: 2 HP / 32 SpA / 32 Spe\nTimid Nature\n- Tailwind\n- Moonblast\n- Encore\n- Taunt\n","default_four":"Default four: Mewtwo, Indeedee-F, Arcanine-Hisui and Incineroar. Lead Indeedee-F + Mewtwo, with Arcanine and Incineroar in the back.\n\nOn turn 1, Mewtwo Mega Evolves. Indeedee's Psychic Surge lands last at 94 Speed, so it overwrites Rillaboom's Grassy Terrain. Indeedee then uses Helping Hand to set up KOs (HH Psystrike on Rillaboom 116.9-138.6%, HH Aura Sphere on Kingambit 102.9-121.7%), or Follow Me when a physical nuke is aimed at Mewtwo. The two Intimidates in the back cut Kowtow Cleave on Mewtwo to 64.1-77.3%, or 42.5-51.4% with Reflect up.\n\nOther matchups:\n- Tailwind / hyper-offense: lead Whimsicott + Mewtwo, with Indeedee-F and Arcanine in the back.\n- Trick Room: bring Mewtwo, Whimsicott, Sneasler and Arcanine. Whimsicott uses Prankster Taunt on the setter.\n- Kingambit + Incineroar Dark cores: bring Mewtwo, Indeedee-F, Sneasler and Arcanine. Sneasler HH Close Combat KOs Chople Kingambit (126.1-149.3%) and KOs Incineroar at +0 (105-124.8%).","headline":"HYPOTHETICAL Psychic Terrain hyper-offense built around Mega Mewtwo Y. A 94-Speed Relaxed Indeedee-F wins the terrain on the lead, which protects the grounded Y from priority, and its Helping Hand pushes Psystrike, Aura Sphere and Ice Beam (all 100% accurate) to KOs on Rillaboom, Kingambit, Sneasler, M-Salamence and Garchomp. Two Intimidates (Arcanine-Hisui, Incineroar), Reflect, Prankster Tailwind/Taunt (Whimsicott) and Unburden Sneasler cover the physical threats Y cannot handle. Each top-8 threat has at least two engine-verified answers. One correction to the brief: Incineroar cannot learn Knock Off in Champions, and its real Darkest Lariat does 70.7-84% to Y.","notes_path":"/home/user/Pokemon_Trainer_Tournament_Simulator/champions-team-building/rotom-judge/out/Mewtwo/mewtwo-mega-y-notes.md"}],"brief_a":{"game_plan":"HYPOTHETICAL (Mewtwo not in Champions). Mega Mewtwo X is a fast (200 Spe, outspeeds all 21 board threats), physically bulky Psychic/Fighting attacker. It stays in against Dark and Bug priority and threatens with 100%-accurate coverage (Zen Headbutt, Drain Punch, Ice Punch, Earthquake). Pair it with Helping Hand to reach the Incineroar and Kingambit KOs, and with Psychic Terrain for Zen Headbutt. The team must handle Intimidate and the Fairy/Flying/Ghost hits that OHKO X. Do not count on Steadfast when running Psychic Terrain, because the terrain blocks Fake Out on X.","lean_into":["Physical bulk against the top physical threats: Kowtow Cleave 44.8-53%, Sucker Punch 36.6-44.3%, M-Golisopod First Impression 66.7-79.8%, Incineroar Knock Off 25.1-30.1%, M-Tyranitar Crunch 49.2-57.9%","100%-accurate OHKOs: Zen Headbutt Sneasler 346-413%, Ice Punch Garchomp 129.7-153.5%, Ice Punch M-Salamence 98.9-118.3% (15/16), Earthquake Arcanine-Hisui 158-188%, Brick Break M-Tyranitar 115.9-139.1%, Zen Headbutt M-Staraptor 98.4-116.8% (128.1-151.9% in Psychic Terrain)","Helping Hand Drain Punch at +0: Incineroar 130.7-155.9% KO, Kingambit through Chople Berry 105.8-126.1% KO, and it heals","200 Speed outspeeds M-Salamence (158) and M-Staraptor (178), the fast threats that OHKO it"],"must_cover":["Intimidate (Incineroar 26.77%): at -1, Drain Punch on Incineroar 57.4-69.3%, HH Drain Punch on Kingambit 71-84.1% (no KO), Ice Punch on M-Salamence 66.7-79.6% and Garchomp 86.5-103.8%; there is no Clear Amulet in Champions","Sylveon single-target Pixilate Hyper Beam 184.2-216.9% (still 123-144.8% through Light Screen); Wide Guard does NOT stop it, only Hyper Voice (82-98.9%)","M-Staraptor Brave Bird 104.9-124.6% and M-Salamence Double-Edge 161.2-190.2% (107.7-127.3% at -1); X loses if opposing Tailwind or Trick Room makes it move second","Gholdengo Shadow Ball 99.5-119.1% (15/16) while X only does 71-84% back with Fire Punch","Rillaboom (#1, 37.18%): X's best hit is only 63.8-75.4%; Wood Hammer in Grassy does 77.6-92.3% to X","M-Golisopod: X needs two hits (Fire Punch 76.9-92.3%)"],"partner_ideas":["Indeedee-F: Helping Hand, Follow Me to redirect Sylveon/Staraptor/Gholdengo hits, and Psychic Terrain for Zen Headbutt","Its own Intimidate (Incineroar or Arcanine-Hisui) to weaken M-Salamence and M-Staraptor, plus an Incineroar answer that is not physical","Steel type to wall Fairy/Flying and pressure Sylveon (M-Metagross, Archaludon or Kingambit)","Fire or Flying attacker to handle Rillaboom and M-Golisopod, and a Ghost/Dark answer to Gholdengo","Speed control (Tailwind from Whimsicott or Pelipper), or Protect for the turns an opposing Tailwind is up"]},"brief_b":{"game_plan":"HYPOTHETICAL (Mewtwo not in Champions). Mega Mewtwo Y runs Psychic Terrain hyper-offense. A 0-Speed Relaxed/Quiet Indeedee-F (94 Spe, slower than Rillaboom's 105, so its terrain comes up last on the lead) blocks every priority move aimed at the grounded Y, and adds Helping Hand plus Follow Me. Y moves first at 211 and uses terrain-boosted Psystrike, with Aura Sphere or Focus Blast for the Dark types. Its damage ignores Intimidate. Protect it from the non-priority physical nukes, above all Kowtow Cleave.","lean_into":["13/21 OHKOs with no item. The 100%-accurate ones: Psystrike Sneasler 443-522% and M-Staraptor 126.5-149.2%, Ice Beam M-Salamence 163-194% and Garchomp 171-203%, Earth Power Arcanine-Hisui 195-230%","Psychic Terrain + Helping Hand Psystrike: Rillaboom 116.9-138.6% KO, Milotic 122.8-145.5% KO; HH Psystrike Sylveon 110.2-130.5%; HH Dark Pulse Indeedee-F 100-118.6%","Dark answers unaffected by Intimidate: HH Aura Sphere Kingambit 102.9-121.7% (never misses); Focus Blast Kingambit 102.4-120.8% (70%); HH Focus Blast Incineroar 120.3-142.6% (70%)","Fire Blast (85%): Gholdengo 108.9-129%, M-Golisopod 160-191%; in sun Rillaboom 110.1-130.4%, M-Metagross 138-162.6%","Special bulk: Sylveon Hyper Beam 78.7-92.9%, Whimsicott Moonblast 27.9-32.8%, M-Staraptor Brave Bird 69.4-82.5%"],"must_cover":["Kingambit Kowtow Cleave 119.1-142.1% (not priority, so terrain does not help; 101.4-119.2% even with 32 HP). Intimidate reduces it to 79.8-95.1%, Reflect to 79.2-94.5%","Priority whenever Psychic Terrain is down: Sucker Punch 99.5-118% (14/16), M-Golisopod First Impression 179-210% (119-142% at -1), Rillaboom Grassy Glide","Rillaboom Wood Hammer in Grassy 102.7-122.4% KO (79.2-94% under Psychic Terrain), so Y must win the terrain war","Incineroar Knock Off 65.6-78.7%, while Y does only 80.2-95% back without Helping Hand","Other physical OHKOs Y must hit first or Protect from: M-Tyranitar Crunch 129-154%, Arcanine-Hisui Head Smash 111-132%, M-Baxcalibur Glaive Rush 102-121%, M-Salamence Double-Edge 106-126%","Accuracy: 8 of 13 OHKOs rely on Focus Blast (70%), Fire Blast (85%) or Thunder (70%); Pelipper and Whimsicott carry Focus Sash"],"partner_ideas":["Indeedee-F with Psychic Surge, Follow Me and Helping Hand at Relaxed/Quiet 0 Speed (94) to win the terrain on a Rillaboom lead; the team should not run its own Fake Out under Psychic Terrain","Intimidate user (Incineroar or Arcanine-Hisui) to take Kowtow Cleave (79.8-95.1%) and Knock Off (45.9-53.6%) out of KO range","Reflect setter as a screen against the physical attackers","Physical or Fairy/Fighting teammate that can KO Kingambit and M-Tyranitar on its own, so the team does not depend on Focus Blast","Torkoal (Drought, very slow setter) as a secondary sun mode for Fire Blast"]}},{"species":"Raichu","slug":"raichu","hypothetical":false,"hypoNote":"","short":"X vs Y","forms":[{"label":"Mega X","name":"Mega Raichu X","slug":"raichu-mega-x","stone":"Raichunite X"},{"label":"Mega Y","name":"Mega Raichu Y","slug":"raichu-mega-y","stone":"Raichunite Y"}],"winnerName":"Mega Raichu Y","score_a":63,"score_b":79,"rubric_a":"21/40, 20/25, 14/20, 8/15","rubric_b":"33/40, 20/25, 15/20, 11/15","ruleLine":"Rotom Judge rules that Mega Raichu Y is the better form (Mega Raichu X 63, Mega Raichu Y 79).","opinion":"Almost every damage roll either side cited reproduces. The case turns on which premises survived checking.\n\n**A's damage case falls apart on items.** Points 4 and 5 (9 OHKOs, and the Helping Hand KOs on Kingambit, M-Salamence and M-Metagross) all need a Life Orb that Mega Raichu X can't hold. A's rebuttal claimed Helping Hand gives X \"the same KOs\" as Y. On the legal stone that is false:\n\n| Target (HH, Electric Terrain) | X Volt Tackle | Y |\n|---|---|---|\n| Kingambit | 1/16 | KO (Focus Blast) |\n| M-Salamence | 5/16 | KO (Zap Cannon) |\n| M-Metagross | 2/16 | — |\n\nA's line on Sneasler, \"wins the exchange every time\", ignores Volt Tackle recoil. X dies in that trade.\n\n**A's real, proven points:**\n- **Terrain denial.** Mega Evolving on turn 1 overwrites Grassy or Psychic Terrain.\n  - Wood Hammer falls from a KO to 83.9-99.3%.\n  - Grassy Glide loses priority.\n  - Expanding Force drops to 33.6-40.1% and is no longer a spread move.\n  - Fake Out works again.\n- **Double the bulk.** X is OHKO'd by 5/21 board threats; Y by 11/21.\n- **Priority punishes Y.** Grassy Glide + Fake Out does 98.5-117.5% to Y and about 53-64% to X. First Impression and Garchomp's EQ OHKO Y.\n\n**B's case held.**\n- Y moves first against the whole board on its standard spread.\n- No Guard makes Zap Cannon guaranteed paralysis.\n- Focus Blast covers the Steel and Dark walls that X can't touch (Archaludon, M-Tyranitar, Kingambit).\n- Its Helping Hand KO list is all legal and correct. It reaches 3 of the top 5 threats (Sneasler, Incineroar, Kingambit) plus M-Salamence and Garchomp.\n- B's best rebuttal was the Speed catch. A's bulk spread and A's 178-Speed spread are different Pokemon.\n\n**B's weak spots:**\n- It accepted A's illegal Life Orb numbers.\n- It oversold \"moves first on every set\". Priority from Rillaboom, Kingambit, Incineroar, M-Golisopod and Arcanine-H ignores Speed, and so does an Unburden Sneasler under Psychic Terrain (378 Spe).\n- It never answered Rillaboom. Wood Hammer does 165.7-196.4% to Y, and 127.7-151.1% even outside Grassy Terrain.\n\n**What each form is for:**\n- **Mega Y** is the better Mega. It hits harder across the board, has wider legal Helping Hand coverage, gives guaranteed Speed control, and costs nothing to hold as base Raichu. The Worlds 2026 reports confirm this, and they played it as support/speed control.\n- **Mega X** is a narrower anti-terrain Fake Out lead. It is the better pick only if a team specifically needs to deny Rillaboom and Indeedee terrain.","conclusion":"Mega Raichu Y wins, 79 to 63.\n\nA's terrain and bulk numbers all reproduce. Mega Evolving on turn 1 cuts Grassy Wood Hammer from a KO to 83.9-99.3%, and only 5/21 board threats OHKO X against 11/21 for Y. But A's damage case (points 4 and 5, and the rebuttal's claim that Helping Hand gives X \"the same KOs\") relies on a Life Orb that Mega X can't hold, because it has to hold Raichunite X. On the legal stone, Helping Hand Volt Tackle is only 1/16 on Kingambit, 5/16 on M-Salamence and 2/16 on M-Metagross, and at -1 from Intimidate every claimed KO disappears. A also claimed X \"wins the exchange every time\" against Sneasler, but X dies to Volt Tackle recoil: 52 HP of recoil against the 10-29 HP it has left after Close Combat.\n\nEvery one of B's Helping Hand nu
